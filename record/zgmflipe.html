<style>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=320,H=480,SK='pinball_best';
let best=0;try{best=parseInt(localStorage.getItem(SK))||0}catch(e){}
const saveBest=()=>{try{localStorage.setItem(SK,String(best))}catch(e){}};
const k={L:0,R:0,P:0};let pk={L:0,R:0};
let ledTh=0,gnome=false,rank=0,th=0,prevTh=0,fade=1,msg2='',st='title',t=0,score=0,balls=3,mult=1,charge=0,saveT=0,msg='',msgT=0,gate=false,still=0,newRec=false,aud=null,hits=0,ball;
function beep(f,d,ty,v,up){try{if(!aud)return;const n=aud.currentTime,o=aud.createOscillator(),g=aud.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,up?f*2:f*.5),n+d);g.gain.setValueAtTime(v||.03,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(n+d)}catch(e){}}
// ---------- tavolo ----------
const walls=[[12,160,12,378.7],[12,378.7,97.1,430.9],[284,170,284,455],[284,378.7,198.9,430.9],[308,160,308,455],[284,455,308,455]];
for(let i=0;i<28;i++){const a=Math.PI+i/28*Math.PI,b=Math.PI+(i+1)/28*Math.PI;walls.push([160+148*Math.cos(a),160+148*Math.sin(a),160+148*Math.cos(b),160+148*Math.sin(b)])}
const mir=x=>296-x;
const bumpers=[{x:104,y:130,r:14,s:100,f:0},{x:192,y:130,r:14,s:100,f:0},{x:148,y:188,r:14,s:100,f:0},{x:52,y:244,r:10,s:50,f:0},{x:244,y:244,r:10,s:50,f:0},{x:66,y:352,r:11,s:25,f:0,c:'#ff4a9a',k:210},{x:230,y:352,r:11,s:25,f:0,c:'#ff4a9a',k:210},{x:60,y:150,r:10,s:50,f:0},{x:236,y:150,r:10,s:50,f:0}];
const tg=[{a:[117,261],b:[137,252],on:0,f:0},{a:[137,252],b:[159,252],on:0,f:0},{a:[159,252],b:[179,261],on:0,f:0}];
const bars=[{a:[20,316],b:[23.5,297]},{a:[23.5,297],b:[27,278]},{a:[276,316],b:[272.5,297]},{a:[272.5,297],b:[269,278]}].map(q=>({a:q.a,b:q.b,on:0,f:0}));
const lights=[{x:104,y:62,on:0},{x:132,y:62,on:0},{x:160,y:62,on:0},{x:188,y:62,on:0}];
const fl=[{x:94,y:436,len:48,side:1,th:.55,w:0},{x:202,y:436,len:48,side:-1,th:.55,w:0}];
const TH_REST=.55,TH_UP=-.35,OMEGA=19,G=560;
// ---------- fisica ----------
function seg(b,ax,ay,bx,by,e){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=((b.x-ax)*dx+(b.y-ay)*dy)/l2;u=u<0?0:u>1?1:u;
  const px=ax+u*dx,py=ay+u*dy;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);
  if(d>=b.r||d===0)return null;nx/=d;ny/=d;b.x=px+nx*b.r;b.y=py+ny*b.r;
  const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny}
  return{nx,ny,vn};
}
function tseg(b,ax,ay,bx,by,e,rad){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=((b.x-ax)*dx+(b.y-ay)*dy)/l2;u=u<0?0:u>1?1:u;
  const px=ax+u*dx,py=ay+u*dy;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),R=b.r+rad;
  if(d>=R||d===0)return null;nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;
  const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny}return{nx,ny,vn};
}
function flipHit(f){
  const b=ball,cs=Math.cos(f.th),sn=Math.sin(f.th),ax=f.x,ay=f.y,bx=ax+f.side*cs*f.len,by=ay+sn*f.len;
  const dx=bx-ax,dy=by-ay;let u=((b.x-ax)*dx+(b.y-ay)*dy)/(dx*dx+dy*dy);u=u<0?0:u>1?1:u;
  const px=ax+u*dx,py=ay+u*dy,rad=6-2.5*u;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),R=b.r+rad;
  if(d>=R||d===0)return;nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;
  const rx=px-ax,ry=py-ay,w=f.w;let vsx,vsy;if(f.side>0){vsx=-w*ry;vsy=w*rx}else{vsx=w*ry;vsy=-w*rx}
  let rvx=b.vx-vsx,rvy=b.vy-vsy;const vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=(1+.25)*vn*nx;rvy-=(1+.25)*vn*ny;b.vx=rvx+vsx;b.vy=rvy+vsy}
}
function step(dt){
  // flipper
  for(let i=0;i<2;i++){const f=fl[i],tg=(i==0?k.L:k.R)?TH_UP:TH_REST;
    if(f.th>tg){f.th=Math.max(tg,f.th-OMEGA*dt);f.w=f.th>tg?-OMEGA:0}
    else if(f.th<tg){f.th=Math.min(tg,f.th+OMEGA*dt);f.w=f.th<tg?OMEGA:0}
    else f.w=0}
  const b=ball;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  const sp=Math.hypot(b.vx,b.vy);if(sp>1000){b.vx*=1000/sp;b.vy*=1000/sp}
  for(const w of walls)seg(b,w[0],w[1],w[2],w[3],.4);
  if(gate)seg(b,284,170,284,78,.4);
  for(const m of bumpers){const dx=b.x-m.x,dy=b.y-m.y,d=Math.hypot(dx,dy),R=m.r+b.r;
    if(d<R&&d>0){const nx=dx/d,ny=dy/d;b.x=m.x+nx*R;b.y=m.y+ny*R;const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}const a=b.vx*nx+b.vy*ny;const kk=m.k||260;if(a<kk){b.vx+=nx*(kk-a);b.vy+=ny*(kk-a)}
      m.f=.15;score+=m.s*mult;hits++;beep(m.r>12?520:700,.09,'triangle',.04,1)}}
  for(const q of tg){const h=tseg(b,q.a[0],q.a[1],q.b[0],q.b[1],.4,3);
    if(h&&h.vn<-40&&!q.on){q.on=1;q.f=.15;score+=100*mult;hits++;beep(780,.07,'square',.03,1);
      if(tg.every(z=>z.on)){tg.forEach(z=>{z.on=0;z.f=.5});score+=1000*mult;say('BERSAGLI!','+'+(1000*mult));beep(600,.35,'triangle',.05,1)}}}
  for(const q of bars){const h=tseg(b,q.a[0],q.a[1],q.b[0],q.b[1],.4,4);
    if(h){const a=b.vx*h.nx+b.vy*h.ny;if(a<230){b.vx+=h.nx*(230-a);b.vy+=h.ny*(230-a);q.f=.15;hits++;beep(840,.07,'square',.03,1);
      if(!q.on){q.on=1;score+=100*mult}else score+=25*mult;
      if(bars.every(z=>z.on)){bars.forEach(z=>{z.on=0;z.f=.5});balls++;score+=500*mult;say('PALLA EXTRA!','+1 PALLA');beep(520,.5,'triangle',.05,1)}}}}
  for(const f of fl)flipHit(f);
  for(const l of lights){const dl=Math.hypot(b.x-l.x,b.y-l.y);if(dl>=14)l.arm=true;if(!l.on&&l.arm!==false&&dl<9){l.on=1;score+=50*mult;beep(900,.08,'sine',.03,1);
    if(lights.every(q=>q.on)){lights.forEach(q=>{q.on=0;q.arm=false});if(mult<5)mult++;score+=500*mult;say('MOLTIPLICATORE x'+mult+'!');beep(500,.4,'triangle',.05,1)}}}
  if(!(b.cool>0)&&!(b.tun>0)){const A=Math.hypot(b.x-PL.x,b.y-PL.y)<9?0:Math.hypot(b.x-PR.x,b.y-PR.y)<9?1:-1;
    if(A>=0){b.tun=.7;b.dir=A==0?1:-1;b.vx=b.vy=0;score+=250*mult;hits++;say('TUNNEL!');beep(300,.4,'sine',.05,1)}}
  if(!gate&&b.x<281&&b.y<165)gate=true;
}
function say(s,s2){msg=s;msg2=s2||'';msgT=1.8}
const THN0=['PIRATI','SCHELETRI E FANTASMI','SPAZIO E ALIENI','GNOMI E FATE','DINOSAURI','FONDALE MARINO','CITTA','PIRAMIDI','GENIO DELLA LAMPADA','CASTELLI','BOSCO UNICORNI','ODISSEA','ANTICA ROMA','SPIAGGIA','MOSTRI','NATALE','VILLAGGIO INNEVATO','GIRO DEL MONDO','ITALIA','GIAPPONE','FRANCIA','RUSSIA','STATI UNITI D AMERICA','AUSTRALIA','POLO SUD','INGHILTERRA','GROTTA DELLE STALATTITI','ANTICO EGITTO','VILLAGGIO DEI FOLLETTI','SAVANA','GIUNGLA','ZOO','PREISTORIA','VECCHIO WEST'],PL={x:26,y:197},PR={x:270,y:197};
function syncTheme(){const nt=Math.floor(score/2500)%THN.length;if(nt!==th){prevTh=th;th=nt;fade=0;if(st=='play'||st=='ready')say('NUOVO TEMA!',THN[nt])}}
function spawn(){ball={x:296,y:446,vx:0,vy:0,r:6};gate=false;charge=0;still=0;st='ready'}
function newGame(){if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(aud&&aud.state=='suspended')aud.resume();
  score=0;balls=3;mult=1;hits=0;newRec=false;th=0;ledTh=0;gnome=false;prevTh=0;fade=1;rank=0;tg.forEach(q=>q.on=0);bars.forEach(q=>q.on=0);lights.forEach(l=>l.on=0);msgT=0;spawn()}
function launch(){const v=540+charge*420;ball.x=296;ball.y=446;ball.vx=0;ball.vy=-v;st='play';saveT=12;still=0;beep(180,.25,'sawtooth',.05,1);if(!msgT)say('BALL SAVE!')}
function drain(){
  beep(120,.6,'sawtooth',.06);
  if(saveT>0){say('BALL SAVE!');spawn();return}
  const bonus=hits*20*mult;score+=bonus;hits=0;balls--;mult=1;
  if(balls<=0){st='over';newRec=score>best;if(newRec){best=score;saveBest()}}else{say('BONUS '+bonus);spawn()}
}
function update(dt){
  t+=dt;msgT=Math.max(0,msgT-dt);if(fade<1)fade=Math.min(1,fade+dt*1.2);syncTheme();
  for(const m of bumpers)m.f=Math.max(0,m.f-dt);for(const q of tg)q.f=Math.max(0,q.f-dt);for(const q of bars)q.f=Math.max(0,q.f-dt);
  {const nr=Math.min(RK.length-1,Math.floor(score/5000));if(nr>rank){rank=nr;if(st=='play'||st=='ready'){say('NUOVO GRADO!',RK[nr]);beep(660,.5,'triangle',.05,1)}}else if(nr<rank)rank=nr}
  if(k.L&&!pk.L)beep(110,.04,'square',.03);if(k.R&&!pk.R)beep(110,.04,'square',.03);pk.L=k.L;pk.R=k.R;
  if(st=='ready'){
    if(k.P)charge=Math.min(1,charge+dt*.9);else if(charge>.05){launch();return}else charge=0;
    ball.y=446+charge*12;ball.vx=ball.vy=0;
    for(let i=0;i<2;i++){const f=fl[i],tg=(i==0?k.L:k.R)?TH_UP:TH_REST;f.th+=Math.sign(tg-f.th)*Math.min(Math.abs(tg-f.th),OMEGA*dt);f.w=0}
    return}
  if(st!='play'){for(let i=0;i<2;i++){fl[i].th=TH_REST;fl[i].w=0}return}
  saveT=Math.max(0,saveT-dt);ball.cool=Math.max(0,(ball.cool||0)-dt);
  if(ball.tun>0){ball.tun-=dt;if(ball.tun<=0){ball.tun=0;const d=ball.dir;ball.x=d>0?PR.x-16:PL.x+16;ball.y=PL.y;ball.vx=-d*180;ball.vy=(Math.random()-.4)*80;ball.cool=.9;beep(500,.2,'triangle',.04,1)}return}
  const n=10;for(let i=0;i<n;i++){step(dt/n);if(ball.tun>0)break}
  if(Math.hypot(ball.vx,ball.vy)<12){still+=dt}else still=0;
  if(ball.x>286&&ball.y>420&&still>.5){spawn();return}
  if(still>3&&ball.y<420){ball.vy=-180;ball.vx=(Math.random()-.5)*160;still=0}
  if(ball.y>H+14)drain();
}
// ---------- grafica ----------
function text(s,x,y,sz,al,col){ctx.font='bold '+sz+'px monospace';ctx.textAlign=al||'left';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#e6ecff';ctx.fillText(s,x,y)}
function line(pts,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
const archPts=[];for(let i=0;i<=28;i++){const a=Math.PI+i/28*Math.PI;archPts.push([160+148*Math.cos(a),160+148*Math.sin(a)])}

function bgPirates(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071a33');g.addColorStop(.55,'#0b3b52');g.addColorStop(1,'#04202c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(236,100,4,236,100,70);g.addColorStop(0,'rgba(255,244,200,.55)');g.addColorStop(1,'rgba(255,244,200,0)');ctx.fillStyle=g;ctx.fillRect(150,20,170,170);
  ctx.fillStyle='rgba(244,236,200,.8)';ctx.beginPath();ctx.arc(236,100,17,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<24;i++)ctx.fillRect((i*83)%300+10,(i*37)%160+16,1,1);
  const sx=((t*14)%440)-70,sy=262+Math.sin(t*1.3)*4;ctx.save();ctx.translate(sx,sy);ctx.rotate(Math.sin(t*1.3)*.05);
  ctx.fillStyle='rgba(22,10,4,.85)';ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.lineTo(26,14);ctx.lineTo(-26,14);ctx.closePath();ctx.fill();
  ctx.fillRect(-1,-46,2,46);ctx.fillRect(-20,-30,2,30);ctx.fillRect(18,-26,2,26);
  ctx.fillStyle='rgba(225,210,160,.5)';[[ -1,-44,-26,-4],[ -1,-44,26,-4]].forEach(p=>{ctx.beginPath();ctx.moveTo(-1,-44);ctx.lineTo(p[2],p[3]);ctx.lineTo(-1,-4);ctx.closePath();ctx.fill()});
  ctx.beginPath();ctx.moveTo(19,-24);ctx.lineTo(36,-6);ctx.lineTo(19,-4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(-1,-52,12,7);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(3,-51,3,3);
  ctx.restore();
  for(let l=0;l<3;l++){ctx.fillStyle=['rgba(14,90,120,.45)','rgba(10,70,100,.55)','rgba(6,45,70,.7)'][l];ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8)ctx.lineTo(x,282+l*34+Math.sin(x*.045+t*(1+l*.5)+l)*5);ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
}
function bat(x,y,f){ctx.fillStyle='rgba(18,0,26,.85)';ctx.beginPath();ctx.ellipse(x,y,4,5,0,0,7);ctx.fill();
  for(const sg of[-1,1]){ctx.beginPath();ctx.moveTo(x,y-2);ctx.lineTo(x+sg*18,y-9+f);ctx.lineTo(x+sg*12,y+1);ctx.lineTo(x+sg*7,y+5);ctx.closePath();ctx.fill()}}
function bone(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='rgba(230,235,215,.3)';ctx.fillRect(-11,-2,22,4);
  for(const sx of[-11,11])for(const sy of[-2.5,2.5]){ctx.beginPath();ctx.arc(sx,sy,2.6,0,7);ctx.fill()}ctx.restore()}
function bgSkeleton(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12041c');g.addColorStop(1,'#26103a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(148,400,10,148,400,190);g.addColorStop(0,'rgba(80,255,160,.2)');g.addColorStop(1,'rgba(80,255,160,0)');ctx.fillStyle=g;ctx.fillRect(0,200,W,280);
  ctx.fillStyle='rgba(210,225,200,.15)';ctx.beginPath();ctx.arc(148,235,72,0,7);ctx.fill();ctx.fillRect(116,285,64,40);
  ctx.fillStyle='rgba(8,0,14,.8)';ctx.beginPath();ctx.arc(120,240,17,0,7);ctx.arc(176,240,17,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(148,262);ctx.lineTo(139,282);ctx.lineTo(157,282);ctx.closePath();ctx.fill();
  const gl=.35+.25*Math.sin(t*3);ctx.fillStyle='rgba(120,255,170,'+gl+')';ctx.beginPath();ctx.arc(120,240,6,0,7);ctx.arc(176,240,6,0,7);ctx.fill();
  ctx.fillStyle='rgba(8,0,14,.55)';for(let i=0;i<7;i++)ctx.fillRect(120+i*9,300,2,25);ctx.fillRect(120,307,63,2);
  for(let i=0;i<6;i++)bone((i*61+30)%300+10,H+20-((t*22+i*95)%560),t*.8+i);
  for(let i=0;i<3;i++)bat(((t*38+i*150)%440)-60,95+i*75+Math.sin(t*2+i)*14,Math.sin(t*14+i)*8);
}
function bgSpace(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#01020c');g.addColorStop(1,'#14063f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const b of[[80,170,'60,200,255',.2,120],[240,330,'255,60,180',.18,130],[150,430,'150,80,255',.2,120]]){g=ctx.createRadialGradient(b[0],b[1],5,b[0],b[1],b[4]);g.addColorStop(0,'rgba('+b[2]+','+b[3]+')');g.addColorStop(1,'rgba('+b[2]+',0)');ctx.fillStyle=g;ctx.fillRect(b[0]-b[4],b[1]-b[4],b[4]*2,b[4]*2)}
  for(let i=0;i<70;i++){const y=((i*97)%480+t*(5+(i%3)*9))%480,x=(i*53)%320;ctx.fillStyle='rgba(255,255,255,'+(.25+.35*Math.abs(Math.sin(t*1.5+i)))+')';ctx.fillRect(x,y,i%4==0?2:1,i%4==0?2:1)}
  g=ctx.createRadialGradient(62,146,3,70,152,30);g.addColorStop(0,'#ffcc80');g.addColorStop(1,'#a0481c');ctx.globalAlpha*=.8;ctx.fillStyle=g;ctx.beginPath();ctx.arc(70,150,26,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,220,160,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(70,150,42,9,-.4,0,7);ctx.stroke();ctx.globalAlpha/=.8;
  const sp=(t%7)/1.2;if(sp<1){ctx.strokeStyle='rgba(255,255,255,'+(1-sp)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(300-sp*220,40+sp*120);ctx.lineTo(300-sp*220+30,40+sp*120-14);ctx.stroke()}
