<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Falcon - F-16</title>
<style>
:root{--bg:#05051a;--fg:#e6f0ff;--btn:#101a3c;--acc:#4aa8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05051a}}
:root[data-theme="dark"]{--bg:#05051a}
html,body{height:100%;margin:0}
body{background:#05051a;color:var(--fg);font-family:monospace;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
canvas{flex:1;min-height:0;width:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{display:none;justify-content:space-between;align-items:center;padding:6px 14px}
#cross{--d:78.2px;flex:1;min-width:0;display:grid;grid-template-columns:var(--d) 1fr var(--d);gap:0;justify-items:center;align-items:center;margin-left:min(7vw,28px);margin-right:5px}
#pad button{border:2px solid var(--acc);border-radius:12px;background:var(--btn);color:var(--fg);font:bold 20px monospace;touch-action:none}
#pad button.on,#pad button:active{background:var(--acc);color:#000}
#cross button{width:var(--d);height:var(--d);padding:0;border-radius:50%;font-size:33px}
#cross .u{grid-area:1/1/2/4;margin-bottom:calc(var(--d)*-.25)}#cross .l{grid-area:2/1;justify-self:start}#cross .r{grid-area:2/3;justify-self:end}#cross .d{grid-area:3/1/4/4;margin-top:calc(var(--d)*-.25)}
#bomb{width:78.2px;height:78.2px;padding:0;border-radius:50%!important;border-color:#ff4a6a!important;font-size:14px!important}
@media (pointer:coarse){#pad{display:flex}}
#foot{display:flex;justify-content:flex-end;padding:2px 8px 6px}
#foot a{font:bold 11px monospace;color:var(--fg);text-decoration:none;border:1px solid var(--acc);border-radius:8px;padding:4px 8px;background:var(--btn);opacity:.85}
</style>
</head>
<body>
<canvas id="c" width="320" height="480"></canvas>
<div id="pad">
  <div id="cross">
    <button class="u" data-k="u">▲</button><button class="l" data-k="l">◀</button>
    <button class="r" data-k="r">▶</button><button class="d" data-k="d">▼</button>
  </div>
  <button id="bomb">BOMBA</button>
</div>
<div id="foot"><a href="zgmjete.html">Mode E</a></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=320,H=480,SK='skyfalcon_best';
let best=0;try{best=parseInt(localStorage.getItem(SK))||0}catch(e){}
const saveBest=()=>{try{localStorage.setItem(SK,String(best))}catch(e){}};
const auto=matchMedia('(pointer:coarse)').matches,rnd=Math.random;
const k={l:0,r:0,u:0,d:0,f:0};
let st='title',score=0,lives=3,bombs=2,wave=1,waveT=0,spawnT=1,t=0,shake=0,flash=0,banner=0,bannerTxt='',newRec=false,boss=null,aud=null;
let th=0,prevTh=0,fade=1,seq=0,segT=0,tStart=0,pStart=0;
let P={x:W/2,y:H-60,r:6,inv:0,sh:0,w:1,cool:0},bl=[],eb=[],en=[],pu=[],pt=[];
const stars=Array.from({length:70},()=>({x:rnd()*W,y:rnd()*H,s:20+rnd()*110}));
function beep(f,d,ty,v){try{if(!aud)return;const n=aud.currentTime,o=aud.createOscillator(),g=aud.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.4),n+d);g.gain.setValueAtTime(v||.03,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(n+d)}catch(e){}}
const TY=[{hp:1,r:8,v:70,sc:100,c:'#c8483c'},{hp:2,r:9,v:60,sc:200,c:'#d09030'},{hp:5,r:13,v:35,sc:400,c:'#7a6aa8'},{hp:1,r:8,v:140,sc:150,c:'#3ab8c8'}];
function spawn(ty,x,y){const d=TY[ty];const e={ty,x,y:y||-20,hp:d.hp,r:d.r,v:d.v,sc:d.sc,c:d.c,t:rnd()*6,ft:1+rnd()*1.5,x0:x,hit:0,dir:rnd()<.5?-1:1,vx:0};if(ty==3)e.vx=(P.x-x)/(H/d.v);en.push(e)}
function spawnBoss(){const hp=50+wave*10;boss={ty:9,kind:Math.floor(wave/3)%2,x:W/2,y:-40,hp,max:hp,r:24,sc:5000,c:'#ff4a6a',t:0,ft:1,ft2:3,hit:0,vx:0};en.push(boss);banner=2;bannerTxt=boss.kind?'ATTENZIONE: BOMBARDIERE!':'ATTENZIONE: PORTAEREI!'}
function reset(){seq=0;segT=0;th=0;prevTh=0;fade=1;tStart=t;pStart=t;P={x:W/2,y:H-60,r:6,inv:2,sh:0,w:1,cool:0};bl=[];eb=[];en=[];pu=[];pt=[];score=0;lives=3;bombs=2;wave=1;waveT=0;spawnT=1;boss=null;banner=1.5;bannerTxt='ONDATA 1';newRec=false}
function start(){if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(aud&&aud.state=='suspended')aud.resume();reset();st='play'}
function ebul(x,y,vx,vy){eb.push({x,y,vx,vy})}
function aim(e,spd,off){const a=Math.atan2(P.y-e.y,P.x-e.x)+(off||0);ebul(e.x,e.y+e.r*.5,Math.cos(a)*spd,Math.sin(a)*spd)}
function boom(x,y,n,c){for(let i=0;i<n;i++){const a=rnd()*7,s=30+rnd()*150;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+rnd()*.5,max:.9,c,s:1+rnd()*2})}}
function drop(x,y,n){for(let i=0;i<n;i++){const r=rnd(),ty=r<.4?'w':r<.7?'s':r<.95?'b':'l';pu.push({t:ty,x:x+(i-n/2)*14,y})}}
function kill(e){if(e.dead)return;e.dead=true;score+=e.sc;if(e===boss){boom(e.x,e.y,90,'#ffd400');boom(e.x,e.y,50,'#ff4a6a');shake=16;flash=.4;drop(e.x,e.y,3);boss=null;wave++;waveT=0;banner=2;bannerTxt='ONDATA '+wave;beep(60,.9,'sawtooth',.1)}
  else{boom(e.x,e.y,e.ty==2?30:16,e.c);if(rnd()<.14)drop(e.x,e.y,1);beep(220,.2,'sawtooth',.04)}}
function hurt(){
  if(P.inv>0)return;
  if(P.sh>0){P.sh=0;P.inv=.8;boom(P.x,P.y,14,'#2de0ff');beep(200,.25,'sawtooth',.05);return}
  lives--;P.inv=2.2;P.w=Math.max(1,P.w-1);eb=[];boom(P.x,P.y,35,'#ffd400');shake=10;flash=.15;beep(110,.5,'sawtooth',.08);
  if(lives<=0){st='over';newRec=score>best;if(newRec){best=score;saveBest()}}
}
function bomb(){if(st!='play'||bombs<=0)return;bombs--;eb=[];en.forEach(e=>{e.hp-=8;e.hit=.2;if(e.hp<=0)kill(e)});flash=.5;shake=14;beep(80,.6,'sawtooth',.1)}
function shoot(){
  const y=P.y-10;
  if(P.w==1)bl.push({x:P.x,y,vx:0,vy:-440});
  else if(P.w==2){bl.push({x:P.x-5,y,vx:0,vy:-440},{x:P.x+5,y,vx:0,vy:-440})}
  else{bl.push({x:P.x,y,vx:0,vy:-450},{x:P.x-6,y,vx:-90,vy:-430},{x:P.x+6,y,vx:90,vy:-430})}
  beep(880,.05,'square',.015);
}
function update(dt){
  t+=dt;if(fade<1)fade=Math.min(1,fade+dt/FADE_T);syncTheme(dt);for(const s of stars){s.y+=s.s*dt*(st=='play'?1:.5);if(s.y>H){s.y=0;s.x=rnd()*W}}
  pt=pt.filter(p=>(p.life-=dt)>0);for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt}
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);banner=Math.max(0,banner-dt);
  if(st!='play')return;
  // giocatore
  let dx=k.r-k.l,dy=k.d-k.u;if(dx&&dy){dx*=.7071;dy*=.7071}
  P.x=Math.max(10,Math.min(W-10,P.x+dx*175*dt));P.y=Math.max(40,Math.min(H-24,P.y+dy*175*dt));
  P.inv-=dt;P.cool-=dt;if((k.f||auto)&&P.cool<=0){P.cool=P.w==3?.13:.15;shoot()}
  // ondate e spawn
  if(!boss){waveT+=dt;if(waveT>22){wave++;waveT=0;banner=1.8;bannerTxt='ONDATA '+wave;if(wave%3==0)spawnBoss()}}
  spawnT-=dt;
  if(spawnT<=0&&!boss){spawnT=Math.max(.45,1.3-wave*.08);const r=rnd();let ty=r<.45?0:r<.65?3:r<.85?1:2;if(wave<2&&ty==2)ty=0;
    if(ty==0&&rnd()<.4){for(let i=0;i<3;i++)spawn(0,W/2+(i-1)*50+(rnd()-.5)*60,-20-i*20)}else spawn(ty,24+rnd()*(W-48))}
  // nemici
  for(const e of en){
    e.t+=dt;e.hit=Math.max(0,e.hit-dt);
    if(e===boss){
      if(e.y<70)e.y+=40*dt;else{e.x=W/2+Math.sin(e.t*(e.hp<e.max/2?1.3:.8))*95}
      e.ft-=dt;e.ft2-=dt;const fast=e.hp<e.max/2?.7:1;
      if(e.ft<=0){e.ft=1.1*fast;for(let i=-2;i<=2;i++){const a=Math.PI/2+i*.28;ebul(e.x,e.y+20,Math.cos(a)*140,Math.sin(a)*140)}}
      if(e.ft2<=0){e.ft2=2.6*fast;for(let i=-1;i<=1;i++)aim(e,170,i*.12)}
      continue}
    if(e.ty==0){e.y+=e.v*dt;e.x=e.x0+Math.sin(e.t*2)*40}
    else if(e.ty==1){e.y+=e.v*dt;e.x+=e.dir*90*dt;if(e.x<20||e.x>W-20)e.dir*=-1}
    else if(e.ty==2){e.y+=(e.y<90?e.v*2:e.v*.3)*dt;e.x+=Math.sin(e.t)*20*dt}
    else{e.y+=e.v*dt;e.x+=e.vx*dt}
    e.ft-=dt;
    if(e.ft<=0&&e.y>0&&e.y<H*.65){
      if(e.ty==0){e.ft=3+rnd()*2;if(rnd()<.5)ebul(e.x,e.y+8,0,140)}
      else if(e.ty==1){e.ft=2;aim(e,150)}
      else if(e.ty==2){e.ft=1.8;aim(e,130,-.3);aim(e,130,0);aim(e,130,.3)}
      else e.ft=99}
    if(e.y>H+30)e.dead=true;
  }
  // proiettili
  for(const b of bl){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const b of bl)for(const e of en){if(!b.dead&&!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){b.dead=true;e.hp--;e.hit=.06;if(e.hp<=0)kill(e);else beep(500,.03,'square',.01)}}
  for(const b of eb)if(Math.hypot(b.x-P.x,b.y-P.y)<P.r+2.5){b.dead=true;hurt()}
  for(const e of en)if(!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+P.r-2){hurt();if(e!==boss){e.hp-=3;if(e.hp<=0)kill(e)}}
  for(const p of pu){p.y+=60*dt;if(Math.hypot(p.x-P.x,p.y-P.y)<14){p.dead=true;score+=50;beep(1000,.12,'triangle',.04);
    if(p.t=='w')P.w=Math.min(3,P.w+1);else if(p.t=='s')P.sh=1;else if(p.t=='b')bombs=Math.min(5,bombs+1);else lives=Math.min(5,lives+1)}}
  bl=bl.filter(b=>!b.dead&&b.y>-10&&b.x>-10&&b.x<W+10);
  eb=eb.filter(b=>!b.dead&&b.y>-10&&b.y<H+10&&b.x>-10&&b.x<W+10);
  en=en.filter(e=>!e.dead);pu=pu.filter(p=>!p.dead&&p.y<H+10);
}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function poly2(pts,c){poly(pts,c);ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;ctx.stroke()}
function jetShape(fl){
  if(fl){poly([[-2,10],[2,10],[0,15+Math.sin(t*50)*2+2]],'#ff9a30');poly([[-1,10],[1,10],[0,12.5]],'#fff0a0')}
  poly2([[0,-3],[-13,9],[-13,11],[-3,7],[3,7],[13,11],[13,9]],'#7a8fb0');
  poly2([[-3,7],[-8,13],[-8,14],[-1,11],[1,11],[8,14],[8,13],[3,7]],'#6a7fa0');
  poly2([[0,-15],[2.4,-8],[3,4],[2,11],[-2,11],[-3,4],[-2.4,-8]],'#c4d0e2');
  ctx.fillStyle='#d03a3a';ctx.fillRect(-14,6,2,5);ctx.fillRect(12,6,2,5);
  poly([[0,-9],[1.8,-5],[0,0],[-1.8,-5]],'#2a6aa0');poly([[0,-8],[.8,-5],[0,-3],[-.8,-5]],'#bfe4ff');
  ctx.fillStyle='#e6f0ff';ctx.fillRect(-9,7,1.5,1.5);ctx.fillRect(7.5,7,1.5,1.5)}
function drawShip(){
  ctx.save();ctx.translate(Math.round(P.x),Math.round(P.y));
  jetShape(true);
  if(P.sh){ctx.strokeStyle='rgba(45,224,255,'+(.5+.3*Math.sin(t*10))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.stroke()}
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));const h=e.hit>0,c=h?'#fff':e.c,d=h?'#fff':'#3a2a3a',fl=Math.sin(t*40+e.x)*2;
  if(e.ty==0){ // caccia a delta
    poly([[-1.5,-8],[1.5,-8],[0,-12-fl]],'#ffa030');
    poly2([[0,12],[-10,-5],[-10,-8],[-2,-5],[2,-5],[10,-8],[10,-5]],c);poly2([[0,12],[2,4],[2,-8],[-2,-8],[-2,4]],d);poly([[0,7],[1.4,3],[0,0],[-1.4,3]],'#101820')}
  else if(e.ty==1){ // caccia bimotore
    poly([[-4,-10],[-2,-10],[-3,-14-fl]],'#ffa030');poly([[2,-10],[4,-10],[3,-14-fl]],'#ffa030');
    poly2([[0,10],[-12,0],[-12,-4],[-4,-7],[4,-7],[12,-4],[12,0]],c);
    poly2([[-5,-10],[-1,-10],[-1,6],[-5,6]],d);poly2([[1,-10],[5,-10],[5,6],[1,6]],d);poly2([[0,13],[2.5,5],[-2.5,5]],c);
    poly([[0,8],[1.2,5],[0,2],[-1.2,5]],'#101820')}
  else if(e.ty==2){ // cacciabombardiere pesante
    poly([[-8,-9],[-4,-9],[-6,-14-fl]],'#ffa030');poly([[4,-9],[8,-9],[6,-14-fl]],'#ffa030');
    poly2([[0,11],[-14,-1],[-14,-8],[-4,-6],[4,-6],[14,-8],[14,-1]],c);
    poly2([[-4,-10],[4,-10],[4,10],[-4,10],[0,15]],d);poly2([[-9,-9],[-4,-9],[-4,2],[-9,2]],d);poly2([[4,-9],[9,-9],[9,2],[4,2]],d);
    ctx.fillStyle=c;ctx.fillRect(-12,2,3,5);ctx.fillRect(9,2,3,5);poly([[0,9],[1.8,4],[0,-1],[-1.8,4]],'#101820');dot('#ff4a6a',0,-6,1.4)}
  else if(e.ty==3){ // intercettore veloce
    poly([[-1.5,-9],[1.5,-9],[0,-14-fl]],'#ffa030');
    poly2([[0,13],[-2,2],[-9,-8],[-2,-6],[0,-9],[2,-6],[9,-8],[2,2]],c);poly([[0,10],[1,4],[-1,4]],d)}
  else if(e.kind){ // bombardiere stealth ad ala volante
    for(const x of[-16,-8,8,16]){poly([[x-2,-14],[x+2,-14],[x,-19-fl]],'#ffa030')}
    poly2([[0,26],[-30,-8],[-30,-16],[-17,-10],[-9,-20],[0,-14],[9,-20],[17,-10],[30,-16],[30,-8]],h?'#fff':'#3a4254');
    poly([[0,26],[-7,10],[7,10]],h?'#fff':'#4a5468');ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.moveTo(-22,-8);ctx.lineTo(22,-8);ctx.stroke();
    ctx.fillStyle='#101820';ctx.fillRect(-4,14,8,3);dot('#c03030',-21,-9,2.5);dot('#c03030',21,-9,2.5);
    ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(0,0,5+Math.sin(t*6)*1.5,0,7);ctx.fill()}
  else{ // portaerei volante
    poly2([[0,28],[-14,20],[-30,6],[-30,-18],[30,-18],[30,6],[14,20]],h?'#fff':'#5a6474');rc(-26,-14,52,18,h?'#fff':'#3e4654');
    ctx.strokeStyle='#e8d060';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(-24,-5);ctx.lineTo(24,-5);ctx.stroke();ctx.setLineDash([]);
    rc(14,-12,8,12,h?'#fff':'#2a3240');for(const x of[-20,-10,0])poly([[x,-11],[x-3,-3],[x+3,-3]],'#b8c0cc');
    const pu2=.6+.4*Math.sin(t*8);for(const q of[[-28,-16],[28,-16],[-28,4],[28,4]]){glow(q[0],q[1],10,'74,170,255',.7*pu2);dot('#bfe4ff',q[0],q[1],2)}
    ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(0,12,4+Math.sin(t*6)*1.2,0,7);ctx.fill()}
  ctx.restore();
}
function text(s,x,y,sz,al,col){ctx.font='bold '+sz+'px monospace';ctx.textAlign=al||'left';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#e6f0ff';ctx.fillText(s,x,y)}
const PC={w:['#ffd400','P'],s:['#2de0ff','S'],b:['#ff4a6a','B'],l:['#7dff7d','+']};
// ---------- temi di sfondo: sorvolo ravvicinato dei paesi del mondo (solo grafica: nessun effetto sulle dinamiche) ----------
// Ogni paese e' una mappa disegnata una sola volta su un tile (320 x TH) che poi scorre in modo continuo.
const TAU=Math.PI*2,SPD=34,TH=1280,DEN=.65;
let G,S=0,_s=1,OC=[],OB=[];const TC=new Map();
const hs=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const rr=()=>{_s=(_s+0x6D2B79F5)|0;let q=Math.imul(_s^_s>>>15,1|_s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296};
const rg=(a,b)=>a+rr()*(b-a),pick=a=>a[Math.floor(rr()*a.length)];
function shade(h,f){const n=parseInt(h.slice(1),16),c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return'rgb('+c(n>>16&255)+','+c(n>>8&255)+','+c(n&255)+')'}
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'};
// primitive su schermo (animazioni)
const dot=(c,x,y,r)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()};
const rc=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function ln(p,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
// primitive sul tile
const gdot=(c,x,y,r)=>{G.fillStyle=c;G.beginPath();G.arc(x,y,r,0,TAU);G.fill()};
const grc=(x,y,w,h,c)=>{G.fillStyle=c;G.fillRect(x,y,w,h)};
const gel=(x,y,rx,ry,c,rot)=>{G.fillStyle=c;G.beginPath();G.ellipse(x,y,rx,ry,rot||0,0,TAU);G.fill()};
function gpoly(p,c){G.fillStyle=c;G.beginPath();p.forEach((q,i)=>i?G.lineTo(q[0],q[1]):G.moveTo(q[0],q[1]));G.closePath();G.fill()}
function gln(p,c,w){G.strokeStyle=c;G.lineWidth=w;G.beginPath();p.forEach((q,i)=>i?G.lineTo(q[0],q[1]):G.moveTo(q[0],q[1]));G.stroke()}
function W2(y,r,fn){for(const o of[0,TH,-TH]){const yy=y+o;if(yy>-r&&yy<TH+r)fn(yy)}}
function rep(fn){for(const o of[-TH,0,TH]){G.save();G.translate(0,o);fn();G.restore()}}
function at(ty,r,fn){const y=(ty+S)%TH;for(const yy of[y,y-TH])if(yy>-r&&yy<H+r)fn(yy)}
// occupazione del suolo (per non sovrapporre case e alberi)
function occInit(){OC=new Array(40*160);OB=[]}
function occAdd(x,y,r){const yy=((y%TH)+TH)%TH;if(r>14){OB.push([x,yy,r]);return}const cx=Math.max(0,Math.min(39,x/8|0)),cy=(yy/8|0)%160,k=cy*40+cx;(OC[k]||(OC[k]=[])).push([x,yy,r])}
function occHit(x,y,r){const yy=((y%TH)+TH)%TH;for(const o of OB){let dy=Math.abs(o[1]-yy);if(dy>TH/2)dy=TH-dy;const dx=o[0]-x;if(dx*dx+dy*dy<(o[2]+r)*(o[2]+r))return true}
  const cx=Math.max(0,Math.min(39,x/8|0)),cy=yy/8|0,n=Math.ceil((r+14)/8);for(let a=-n;a<=n;a++)for(let b=-n;b<=n;b++){const X=cx+a;if(X<0||X>39)continue;const c=OC[(((cy+b)%160+160)%160)*40+X];if(c)for(const o of c){let dy=Math.abs(o[1]-yy);if(dy>TH/2)dy=TH-dy;const dx=o[0]-x;if(dx*dx+dy*dy<(o[2]+r)*(o[2]+r))return true}}return false}
function occLine(p,w){for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.ceil(L/5);for(let k=0;k<=n;k++)occAdd(a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,w/2+1.5)}}
function occRibbon(f,w){for(let y=0;y<TH;y+=6)for(let d=-w/2+4;d<=w/2-3;d+=8)occAdd(f(y)+d,y,7)}
function occRect(x,y,w,h){for(let a=x+6;a<x+w;a+=10)for(let b=y+6;b<y+h;b+=10)occAdd(a,b,8)}
function occEl(x,y,rx,ry){for(let a=-rx+6;a<rx;a+=10)for(let b=-ry+6;b<ry;b+=10)if((a*a)/(rx*rx)+(b*b)/(ry*ry)<1)occAdd(x+a,y+b,8)}
// funzioni periodiche (fiumi, coste)
function mkf(base,amp,k0,k1,sd){const ph=[];for(let k=k0;k<=k1;k++)ph[k]=hs(sd*7+k)*TAU;return y=>{let v=base;for(let k=k0;k<=k1;k++)v+=amp*Math.sin(TAU*k*y/TH+ph[k])/Math.pow(k-k0+1,.9);return v}}
const ff=(x,y,k)=>Math.sin(x*.011+k)*.9+Math.sin(TAU*3*y/TH+k*1.7)*.9;
// terreno
function base(c){G.fillStyle=c;G.fillRect(0,0,320,TH)}
function blotch(n,cols,r0,r1,a){for(let i=0;i<n;i++){const x=rg(-20,340),y=rg(0,TH),r=rg(r0,r1),c=pick(cols);W2(y,r,yy=>{const g=G.createRadialGradient(x,yy,0,x,yy,r);g.addColorStop(0,rgba(c,a||.5));g.addColorStop(1,rgba(c,0));G.fillStyle=g;G.fillRect(x-r,yy-r,2*r,2*r)})}}
function grain(n,cols,a,sz){G.globalAlpha=a||.25;for(let i=0;i<n*DEN;i++){G.fillStyle=pick(cols);G.fillRect(rr()*320,rr()*TH,sz||1.5,sz||1.5)}G.globalAlpha=1}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),L=[],U=[];for(const p of P){while(L.length>1&&cr(L[L.length-2],L[L.length-1],p)<=0)L.pop();L.push(p)}for(let i=P.length-1;i>=0;i--){const p=P[i];while(U.length>1&&cr(U[U.length-2],U[U.length-1],p)<=0)U.pop();U.push(p)}return L.slice(0,-1).concat(U.slice(0,-1))}
// edifici visti dall'alto: tetti a falde, piani, a padiglione, con ombra
function bld(x,y,w,h,ang,c,st,ht){ht=ht||1;const rd=Math.hypot(w,h)+14*ht;W2(y,rd,yy=>{const ca=Math.cos(ang),sa=Math.sin(ang),dx=3.2*ht,dy=4.2*ht,pts=[];for(const a of[-w/2,w/2])for(const b of[-h/2,h/2]){const px=x+a*ca-b*sa,py=yy+a*sa+b*ca;pts.push([px,py],[px+dx,py+dy])}gpoly(hull(pts),'rgba(0,0,0,.3)');
  G.save();G.translate(x,yy);G.rotate(ang);const a=-w/2,b=-h/2;
  if(st==2){gpoly([[a,b],[-a,b],[0,0]],shade(c,1.12));gpoly([[a,-b],[-a,-b],[0,0]],shade(c,.72));gpoly([[a,b],[a,-b],[0,0]],c);gpoly([[-a,b],[-a,-b],[0,0]],shade(c,.84))}
  else if(st==1){grc(a,b,w,h,shade(c,.88));grc(a+1,b+1,w-2,h-2,c);grc(a+2,b+2,w*.35,h*.3,shade(c,1.14));if(w>12)grc(a+w*.55,b+h*.5,w*.22,h*.25,shade(c,.78))}
  else{grc(a,b,w,h/2,shade(c,1.18));grc(a,0,w,h/2,shade(c,.78));grc(a,-.5,w,1,'rgba(0,0,0,.3)');if(w>14)grc(a+w*.3,b+h*.12,2,2,'#4a4a4a')}
  G.restore()})}
function tree(x,y,r,c){W2(y,r*2,yy=>{G.fillStyle='rgba(0,0,0,.27)';G.beginPath();G.ellipse(x+r*.5,yy+r*.6,r*.95,r*.75,.4,0,TAU);G.fill();gdot(shade(c,.78),x,yy,r);gdot(c,x-r*.12,yy-r*.15,r*.8);gdot(shade(c,1.22),x-r*.3,yy-r*.35,r*.42);if(r>4)gdot(shade(c,.7),x+r*.35,yy+r*.3,r*.3)})}
function cypress(x,y,h,c){W2(y,h+8,yy=>{G.fillStyle='rgba(0,0,0,.3)';G.beginPath();G.ellipse(x+h*.35,yy+h*.45,h*.22,h*.5,.5,0,TAU);G.fill();gel(x,yy,2.4,h*.5,shade(c,.8));gel(x-.5,yy-1,1.6,h*.42,c)})}
function scatter(x0,y0,x1,y1,n,cols,r0,r1,o){o=o||{};let k=0;for(let i=0;i<n*DEN;i++){const x=rg(x0,x1),y=rg(y0,y1),r=rg(r0,r1);if(o.inside&&!o.inside(x,y))continue;if(occHit(x,y,r+(o.pad||0)))continue;occAdd(x,y,r*.8);tree(x,y,r,pick(cols));k++}return k}
function field(x,y,w,h,ang,c){W2(y,Math.hypot(w,h),yy=>{G.save();G.translate(x,yy);G.rotate(ang);grc(-w/2,-h/2,w,h,c);G.fillStyle='rgba(0,0,0,.1)';for(let i=-h/2;i<h/2;i+=3)G.fillRect(-w/2,i,w,1);G.strokeStyle='rgba(30,50,20,.35)';G.lineWidth=1;G.strokeRect(-w/2,-h/2,w,h);G.restore()})}
function fieldPatch(x0,y0,x1,y1,cols,cell,o){o=o||{};const ba=o.ang||0;for(let y=y0;y<y1;y+=cell*.9)for(let x=x0;x<x1;x+=cell*.9){const cx=x+rg(-4,4),cy=y+rg(-4,4);if(o.inside&&!o.inside(cx,cy))continue;if(occHit(cx,cy,cell*.4))continue;const w=cell*rg(.7,1.05),h=cell*rg(.6,1);occAdd(cx,cy,Math.min(w,h)*.5);field(cx,cy,w,h,ba+rg(-.12,.12),pick(cols))}}
function road(p,w,c,o){o=o||{};rep(()=>{G.lineCap='round';G.lineJoin='round';const path=()=>{G.beginPath();G.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)G.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);const L=p[p.length-1];G.lineTo(L[0],L[1])};
  if(o.edge){G.strokeStyle=o.edge;G.lineWidth=w+2;path();G.stroke()}G.strokeStyle=c;G.lineWidth=w;path();G.stroke();if(o.dash){G.setLineDash([4,5]);G.strokeStyle=o.dash;G.lineWidth=.8;path();G.stroke();G.setLineDash([])}})}
function lanes(x0,y0,x1,y1,n,w,c,o){for(let i=0;i<n;i++){let x=rg(x0,x1),y=rg(y0,y1),a=rg(0,TAU);const p=[[x,y]];for(let k=0;k<5;k++){a+=rg(-.7,.7);x+=Math.cos(a)*rg(45,85);y+=Math.sin(a)*rg(45,85);p.push([x,y])}road(p,w,c,o);occLine(p,w+(o&&o.pad||0))}}
function river(f,w,o){const P=(d)=>{G.beginPath();for(let y=-30;y<=TH+30;y+=6){const x=f(y)+(d||0);y==-30?G.moveTo(x,y):G.lineTo(x,y)}};G.lineJoin='round';G.lineCap='butt';
  if(o.bank){G.strokeStyle=o.bank;G.lineWidth=w+(o.bw||12);P();G.stroke()}G.strokeStyle=o.edge||shade(o.water,.8);G.lineWidth=w+3;P();G.stroke();G.strokeStyle=o.water;G.lineWidth=w;P();G.stroke();G.strokeStyle=o.deep||shade(o.water,.85);G.lineWidth=w*.5;P();G.stroke();
  G.strokeStyle='rgba(255,255,255,.2)';G.lineWidth=1;G.setLineDash([10,14]);for(const d of[-.2,.22]){P(w*d);G.stroke()}G.setLineDash([])}
function coast(f,side,o){const P=(d)=>{G.beginPath();for(let y=-30;y<=TH+30;y+=6){const x=f(y)+(d||0);y==-30?G.moveTo(x,y):G.lineTo(x,y)}};
  for(const b of[[44,.1],[28,.12],[16,.16],[8,.2]]){G.strokeStyle=rgba(o.sh||'#7fe0d8',b[1]);G.lineWidth=b[0];P();G.stroke()}
  P();const E=side=='L'?-10:330;G.lineTo(E,TH+30);G.lineTo(E,-30);G.closePath();G.fillStyle=o.land;G.fill();
  G.strokeStyle=o.sand||'#e8d8a8';G.lineWidth=o.bw||7;G.lineJoin='round';P(side=='L'?-3.5:3.5);G.stroke();G.strokeStyle='rgba(255,255,255,.82)';G.lineWidth=2;P(side=='L'?3:-3);G.stroke();G.strokeStyle='rgba(255,255,255,.35)';G.lineWidth=1.5;P(side=='L'?7:-7);G.stroke()}
function blobPts(cx,cy,rx,ry,sd,rough){const P=[];for(let i=0;i<72;i++){const a=i/72*TAU;let k=1;for(let m=2;m<=6;m++)k+=Math.sin(a*m+hs(sd+m)*TAU)*.47/m;for(let m=9;m<=13;m++)k+=Math.sin(a*m+hs(sd+m*3)*TAU)*(rough==null?.03:rough);P.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return P}
function gpath(P){G.beginPath();P.forEach((q,i)=>i?G.lineTo(q[0],q[1]):G.moveTo(q[0],q[1]));G.closePath()}
const scl=(P,cx,cy,s)=>P.map(q=>[cx+(q[0]-cx)*s,cy+(q[1]-cy)*s]);
function inPoly(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i][1]>y)!=(P[j][1]>y)&&x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])c=!c}return c}
function island(cx,cy,rx,ry,sd,o){const s0=_s,run=yy=>{_s=s0;const P=blobPts(cx,yy,rx,ry,sd,o.rough);
  for(const b of[[1.5,.12],[1.32,.18],[1.17,.26],[1.07,.36]]){gpath(scl(P,cx,yy,b[0]));G.fillStyle=rgba(o.sh||'#6fe0d8',b[1]);G.fill()}
  gpath(P);G.fillStyle=o.sand||'#e6d6a6';G.fill();G.strokeStyle='rgba(255,255,255,.85)';G.lineWidth=2.4;G.stroke();
  const L=scl(P,cx,yy,.9);gpath(L);G.fillStyle=o.land;G.fill();G.save();gpath(L);G.clip();const g=G.createLinearGradient(cx-rx,yy-ry,cx+rx,yy+ry);g.addColorStop(0,'rgba(255,255,220,.2)');g.addColorStop(1,'rgba(0,0,30,.28)');G.fillStyle=g;G.fillRect(cx-rx*1.6,yy-ry*1.6,rx*3.2,ry*3.2);G.restore();
  if(o.fn)o.fn(L,yy)};run(cy);if(cy<ry*1.8)run(cy+TH);if(cy>TH-ry*1.8)run(cy-TH)}
// quartieri organici: case di forma e orientamento vari, allineate a un campo di flusso
function org(x0,y0,x1,y1,o){for(let i=0;i<(o.n||400)*DEN;i++){const x=rg(x0,x1),y=rg(y0,y1);if(o.inside&&!o.inside(x,y))continue;let w=rg(o.w0,o.w1),h=w*rg(.5,.95);if(h>w){const q=w;w=h;h=q}const ang=ff(x,y,o.k||0)*(o.fl==null?1:o.fl)+rg(-.25,.25)+(o.base||0),r=Math.hypot(w,h)*.4+(o.gap||2.5);if(occHit(x,y,r))continue;occAdd(x,y,r);bld(x,y,w,h,ang,pick(o.pal),pick(o.st||[0,0,1,2]),o.ht||1)}}
// isolati regolari divisi in lotti di altezze diverse
function gridD(x0,y0,x1,y1,o){const A=o.ang||0,ca=Math.cos(A),sa=Math.sin(A),cx=(x0+x1)/2,cy=(y0+y1)/2,P=(lx,ly)=>[cx+lx*ca-ly*sa,cy+lx*sa+ly*ca];
  const lot=(lx,ly,w,h,d)=>{if(d<=0||w<o.minw*1.6&&h<o.minw*1.6||rr()<.12*(3-d)){const g=o.gap==null?1.2:o.gap,p=P(lx+w/2,ly+h/2);if(o.inside&&!o.inside(p[0],p[1]))return;if(occHit(p[0],p[1],Math.min(w,h)*.4))return;occAdd(p[0],p[1],Math.min(w,h)*.45);bld(p[0],p[1],w-g*2,h-g*2,A,pick(o.pal),pick(o.st||[1]),o.ht?rg(o.ht[0],o.ht[1]):1);return}
    if(w>h){const k=rg(.38,.62)*w;lot(lx,ly,k,h,d-1);lot(lx+k,ly,w-k,h,d-1)}else{const k=rg(.38,.62)*h;lot(lx,ly,w,k,d-1);lot(lx,ly+k,w,h-k,d-1)}};
  const W0=x1-x0,H0=y1-y0;for(let by=-H0/2;by<H0/2;by+=o.bh+o.sw)for(let bx=-W0/2;bx<W0/2;bx+=o.bw+o.sw)lot(bx,by,o.bw,o.bh,o.depth||3)}
function park(x,y,rx,ry,c,o){o=o||{};W2(y,Math.max(rx,ry)+10,yy=>{gel(x,yy,rx+3,ry+3,'rgba(0,0,0,.18)');gel(x,yy,rx,ry,c);gel(x-rx*.15,yy-ry*.15,rx*.8,ry*.75,shade(c,1.1))});
  occEl(x,y,rx,ry);if(o.lake){W2(y,40,yy=>{gel(x+rx*.1,yy+ry*.1,rx*.3,ry*.25,'#5a8a9a');gel(x+rx*.1,yy+ry*.1,rx*.26,ry*.21,'#6a9aaa')})}
  scatter(x-rx,y-ry,x+rx,y+ry,o.n||Math.round(rx*ry/60),o.cols||['#3a6a32','#2f5a2a','#4a7a3a','#5a8a40'],3,6.5,{inside:(a,b)=>((a-x)*(a-x))/(rx*rx)+((b-y)*(b-y))/(ry*ry)<.92})}

// ---- gestione tile, animazioni e utilita' comuni ----
const DYN={},GEN=[];
function getTile(i){let T=TC.get(i);if(!T){const c=document.createElement('canvas');c.width=320;c.height=TH;G=c.getContext('2d');_s=1000+i*77;occInit();GEN[i]();T=c;TC.set(i,c);if(TC.size>5)for(const k of TC.keys())if(k!==th&&k!==prevTh&&k!==i){TC.delete(k);break}}return T}
function glow(x,y,r,rgb,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function spark(n,test,al){ctx.fillStyle='rgba(255,255,255,'+(al||.8)+')';for(let i=0;i<n;i++){const ty=hs(i*3+1)*TH,x=hs(i*3+2)*320;if(test&&!test(x,ty))continue;if(Math.sin(t*3+i*2.1)<.3)continue;at(ty,4,y=>ctx.fillRect(x,y,2,1))}}
function boat(x,y,ang,L,Wd,c,wake){ctx.save();ctx.translate(x,y);ctx.rotate(ang);if(wake){ctx.fillStyle='rgba(255,255,255,.33)';ctx.beginPath();ctx.moveTo(-L*.45,0);ctx.lineTo(-L*1.9,-Wd*1.1);ctx.lineTo(-L*1.9,Wd*1.1);ctx.closePath();ctx.fill()}ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-L/2+1.5,-Wd/2+2,L,Wd);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(L/2,0);ctx.lineTo(L/4,-Wd/2);ctx.lineTo(-L/2,-Wd/2);ctx.lineTo(-L/2,Wd/2);ctx.lineTo(L/4,Wd/2);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(-L/4,-Wd/4,L/4,Wd/2);ctx.restore()}
function flock(n,y0,col,sp){ctx.fillStyle=col;for(let i=0;i<n;i++){const x=((t*(sp||16)+i*47+hs(i)*60)%420)-50,y=y0+hs(i+60)*90+Math.sin(t*.9+i)*8,f=Math.sin(t*9+i*2)*2;ctx.fillRect(x,y,2,1);ctx.fillRect(x-2,y-f,2,1);ctx.fillRect(x+2,y-f,2,1)}}
function drawBg(i,a){ctx.save();ctx.globalAlpha=a;const lt=t-(i==th?tStart:pStart);S=(lt*SPD+(i<NLOC?(TH-START[i])%TH:0))%TH;const T=getTile(i);ctx.drawImage(T,0,S);ctx.drawImage(T,0,S-TH);if(DYN[i])DYN[i]();ctx.fillStyle='rgba(5,8,28,.12)';ctx.fillRect(0,0,W,H);ctx.restore();if(i==th&&fade>=1){const n=themeFor(seq+1);if(!TC.has(n)&&GEN[n])getTile(n)}}
function themeFor(n){return n%2==0?(n/2)%NLOC:NLOC+(((n-1)/2)%MIDN)}
function syncTheme(dt){if(st!='play')return;segT+=dt;const d=th<NLOC?LOC_T:MID_T;if(segT>=d){segT-=d;seq++;prevTh=th;pStart=tStart;th=themeFor(seq);tStart=t;fade=0}}
function gpeak(x,y,r,n,lit,mid,dark,sd){W2(y,r*1.4,yy=>{G.fillStyle='rgba(0,0,0,.22)';G.beginPath();G.ellipse(x+r*.3,yy+r*.35,r*.95,r*.8,.3,0,TAU);G.fill();const N=Math.max(n,16),O=[],I=[];
  for(let q=0;q<N;q++){const a=q/N*TAU+hs(sd)*2+(hs(sd*5+q)-.5)*.25,ro=r*(.55+.45*hs(sd*3+q)),ri=ro*(.3+.3*hs(sd*7+q));O.push([x+Math.cos(a)*ro,yy+Math.sin(a)*ro,a]);I.push([x+Math.cos(a+.1)*ri,yy+Math.sin(a+.1)*ri])}
  for(let q=0;q<N;q++){const q2=(q+1)%N,am=(O[q][2]+O[q2][2]+(q==N-1?TAU:0))/2,l=Math.cos(am-3.93)+(hs(sd+q*3)-.5)*.5;G.fillStyle=l>.35?lit:l>-.35?mid:dark;G.beginPath();G.moveTo(O[q][0],O[q][1]);G.lineTo(O[q2][0],O[q2][1]);G.lineTo(I[q2][0],I[q2][1]);G.lineTo(I[q][0],I[q][1]);G.closePath();G.fill();
    G.fillStyle=l>0?shade(lit,1.08):shade(mid,.88);G.beginPath();G.moveTo(x,yy);G.lineTo(I[q][0],I[q][1]);G.lineTo(I[q2][0],I[q2][1]);G.closePath();G.fill()}
  G.strokeStyle='rgba(0,0,0,.18)';G.lineWidth=.8;for(let q=0;q<N;q+=2){G.beginPath();G.moveTo(O[q][0],O[q][1]);G.lineTo(I[q][0],I[q][1]);G.stroke()}})}
function domeTop(x,y,r,c,ribs){W2(y,r*1.6,yy=>{G.fillStyle='rgba(0,0,0,.3)';G.beginPath();G.ellipse(x+r*.4,yy+r*.5,r,r*.9,.4,0,TAU);G.fill();const g=G.createRadialGradient(x-r*.35,yy-r*.35,r*.1,x,yy,r);g.addColorStop(0,shade(c,1.35));g.addColorStop(.6,c);g.addColorStop(1,shade(c,.62));G.fillStyle=g;G.beginPath();G.arc(x,yy,r,0,TAU);G.fill();
  if(ribs){G.strokeStyle='rgba(0,0,0,.22)';G.lineWidth=.8;for(let k=0;k<ribs;k++){const a=k/ribs*TAU;G.beginPath();G.moveTo(x,yy);G.lineTo(x+Math.cos(a)*r,yy+Math.sin(a)*r);G.stroke()}}gdot(shade(c,1.3),x-r*.08,yy-r*.08,Math.max(1.5,r*.16))})}
function sbox(x,y,w,h,ht,c,ang){bld(x,y,w,h,ang||0,c,1,ht)}

// ===== 1 ITALIA (Roma) =====
function colosseo(x,y,rot){W2(y,70,yy=>{G.save();G.translate(x,yy);G.rotate(rot);G.fillStyle='rgba(0,0,0,.3)';G.beginPath();G.ellipse(8,10,52,39,0,0,TAU);G.fill();gel(0,0,51,38,'#cdb68c');

  for(let k=0;k<6;k++){const x=rg(0,320),y=my(),s=rg(.9,1.7);W2(y,90,yy=>{for(const p of[[0,0,1],[-.7,.15,.7],[.75,.2,.65],[.2,-.3,.6]]){const r=s*40*p[2],cx=x+p[0]*s*40,cy=yy+p[1]*s*40,g=G.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');G.fillStyle=g;G.fillRect(cx-r,cy-r,2*r,2*r)}})}}
DYN[25]=()=>{clouds(4,17,.5)};
GEN[25]=genCielo;
// 26 PRATI
function genPrati(){base('#5f9c42');blotch(34,['#4f8a38','#74ae4e','#86b858','#6aa646'],45,105,.5);grain(1200,['#3f7a2e','#9ccc66'],.18,1.6);
  for(let k=0;k<3;k++){const cx=rg(40,280),cy=my();scatter(cx-34,cy-24,cx+34,cy+24,16,['#2f6a2c','#3a7a34','#2a5e28'],4,6.5,{pad:.5})}
  for(let k=0;k<2;k++){const y=my(),x=rg(0,100);rowTrees([[x,y],[x+85,y+14],[x+170,y-6],[x+250,y+16]],8,3,'#3a7030')}
  grain(70,['#f4e86a','#f4f4f0','#f08aa8'],.85,2)}
DYN[26]=()=>{clouds(3,29,.5)};
GEN[26]=genPrati;
// 27 NEVE
function genNeve(){base('#e6eef6');blotch(26,['#d4e2ee','#f6fafe','#c4d6e8','#ffffff'],45,110,.55);grain(800,['#ffffff','#b8cce0'],.3,1.6);
  for(let k=0;k<3;k++){const x=rg(60,260),y=my(),rx=rg(34,56),ry=rg(20,34);pond(x,y,rx,ry);occEl(x,y,rx*1.2,ry*1.2)}
  const C=['#c8d8d0','#9cb8a8','#3f6a52'];scatter(0,0,320,480,18,C,3,5,{pad:6});scatter(0,906,320,1280,12,C,3,5,{pad:6})}
DYN[27]=()=>{spark(18,()=>true,.5)};
GEN[27]=genNeve;
// 28 DESERTO
function genDeserto(){base('#dcbc7c');blotch(30,['#cca464','#ecd196','#c29a58','#e0c084'],45,105,.5);grain(1000,['#a8803e','#f4dca4'],.2,1.6);dunes(9,'rgba(255,234,176,.22)','rgba(140,92,34,.16)',3);
  for(let g=0;g<3;g++){const cx=rg(50,270),cy=my(),n=2+(rr()*2|0);W2(cy,24,yy=>{gel(cx,yy,15,9,'#8aa860');gel(cx,yy,11,6,'#4f9aa6')});for(let k=0;k<n;k++)palmT(cx+rg(-24,24),cy+rg(-20,20),rg(6.5,8.5))}}
DYN[28]=()=>{ctx.fillStyle='rgba(255,236,190,.18)';for(let i=0;i<14;i++){const x=(hs(i)*340+t*30)%340-10,y=(hs(i+7)*H+Math.sin(t+i)*6);ctx.fillRect(x,y,8,1)}};
GEN[28]=genDeserto;

const THN=['ITALIA','CAGLIARI','FIRENZE','VENEZIA','SVIZZERA','FRANCIA','GERMANIA','INGHILTERRA','RUSSIA','GRECIA','EGITTO','IRAQ','ARABIA','GIAPPONE','CINA','TOKYO','DUBAI','POLO SUD','STATI UNITI','AUSTRALIA','BRASILE','MESSICO','HAWAII','AFRICA'];

function render(){
  if(fade<1){drawBg(prevTh,1);drawBg(th,fade)}else drawBg(th,1);
  for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(.07+s.s/650)+')';ctx.beginPath();ctx.ellipse(Math.round(s.x),Math.round(s.y),6+s.s*.1,2+s.s*.03,0,0,TAU);ctx.fill()}
  ctx.save();if(shake)ctx.translate((rnd()-.5)*shake,(rnd()-.5)*shake);
  for(const p of pu){ctx.fillStyle=PC[p.t][0];ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();text(PC[p.t][1],p.x,p.y+4,11,'center','#000')}
  for(const e of en)drawEnemy(e);
  ctx.fillStyle='#ffe27a';for(const b of bl)ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-5,3,9);
  ctx.fillStyle='#ff7a3a';for(const b of eb){ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()}ctx.fillStyle='#fff0c0';for(const b of eb){ctx.beginPath();ctx.arc(b.x,b.y,1.2,0,7);ctx.fill()}
  if(st!='over'&&(P.inv<=0||Math.floor(t*20)%2))drawShip();
  for(const p of pt){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;
  ctx.restore();
  if(flash){ctx.fillStyle='rgba(255,255,255,'+Math.min(.6,flash)+')';ctx.fillRect(0,0,W,H)}
  // HUD
  text('PUNTI',8,14,10,'left','#8ab');text(score+'',8,28,14,'left','#fff');
  text('RECORD',W-8,14,10,'right','#8ab');text(best+'',W-8,28,14,'right','#fff');
  if(st!='title'){
    for(let i=0;i<lives;i++){ctx.save();ctx.translate(14+i*16,H-14);ctx.scale(.6,.6);jetShape(false);ctx.restore()}
    text('BOMBE '+bombs,W-8,H-8,11,'right','#ff6a8a');text('ONDA '+wave,W/2,H-8,11,'center','#8ab');
    if(boss){ctx.fillStyle='#401020';ctx.fillRect(60,36,200,6);ctx.fillStyle='#ff4a6a';ctx.fillRect(60,36,200*Math.max(0,boss.hp/boss.max),6)}
  }
  if(banner>0&&st=='play')text(bannerTxt,W/2,H/2-60,16,'center','#ffe27a');
  if(st=='play'){let ti=-1,al=1;if(th<NLOC)ti=th;else if(fade<1&&prevTh<NLOC){ti=prevTh;al=1-fade}
    if(ti>=0){ctx.globalAlpha=al;text('SORVOLANDO',W/2,70,10,'center','#8ab');text(THN[ti],W/2,86,14,'center','#7df');ctx.globalAlpha=1}}
  if(st=='title'||st=='over'){
    ctx.fillStyle='rgba(2,2,20,.6)';ctx.fillRect(0,H/2-110,W,200);
    if(st=='title'){text('SKY',W/2,H/2-60,34,'center','#4aa8ff');text('FALCON',W/2,H/2-26,34,'center','#ffd400');text('CACCIA F-16 - GIRO DEL MONDO',W/2,H/2-88,10,'center','#8ab');
      text('RECORD: '+best,W/2,H/2+10,14,'center','#7df');text('P = potenzia  S = scudo  B = bomba',W/2,H/2+36,10,'center','#aab');
      text('Frecce/WASD  Spazio=fuoco  B=bomba',W/2,H/2+52,10,'center','#aab')}
    else{text('GAME OVER',W/2,H/2-50,28,'center','#ff4a6a');text('Punti: '+score+'   Record: '+best,W/2,H/2-18,13,'center','#fff');
      if(newRec)text('NUOVO RECORD!',W/2,H/2+6,15,'center','#ffd400')}
    if(Math.floor(performance.now()/500)%2)text('INVIO / TOCCA PER GIOCARE',W/2,H/2+76,12,'center','#fff');
  }
}
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',' ':'f',z:'f',Z:'f'};
addEventListener('keydown',e=>{
  if(KM[e.key]){k[KM[e.key]]=1;e.preventDefault()}
  if(e.key=='b'||e.key=='B'||e.key=='x'||e.key=='X')bomb();
  if((e.key=='Enter'||e.key==' ')&&st!='play'){start();e.preventDefault()}
});
addEventListener('keyup',e=>{if(KM[e.key])k[KM[e.key]]=0});
document.querySelectorAll('#cross button').forEach(b=>{const key=b.dataset.k,on=e=>{e.preventDefault();k[key]=1;b.classList.add('on')},off=e=>{e.preventDefault();k[key]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
document.getElementById('bomb').addEventListener('pointerdown',e=>{e.preventDefault();bomb()});
cv.addEventListener('pointerdown',()=>{if(st!='play')start()});
addEventListener('pagehide',()=>{if(score>best){best=score;saveBest()}});
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
