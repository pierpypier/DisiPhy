<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - by Pier Paolo Mannoni</title>

  <meta name="theme-color" content="#1e88e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="rimage/dspimage192.png">
  <link rel="icon" href="rimage/dspimage192.png">

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --accent:#1e88e5;
      --muted:#6b7280;
      --shadow:0 6px 18px rgba(20,30,50,0.06);
      --radius:12px;
      --max-width:980px;
    }
    *{box-sizing:border-box}
    html, body{
      overflow-x: hidden; /* nessuno scroll orizzontale, come richiesto */
      max-width: 100%;
    }
    body{
      margin:0;
      font-family:Inter,Arial;
      background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 100%);
      padding:20px;
      display:flex;
      justify-content:center;
    }
    .container{
      width:100%;
      max-width:var(--max-width);
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      background: #ffffff;
      border-radius: 10px;
    }
    .page-title{
      font-size:20px;
      font-weight:700;
      color:var(--accent);
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 5px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #000;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }
    .nav-item img {
      width: 84px;
      height: 84px;
      margin-bottom: 1px;
      transition: transform 0.2s ease;
    }
    .nav-item:hover img { transform: scale(1.05); }
    .nav-item:hover { opacity: 0.85; }

    @media (max-width: 600px) {
      .nav { gap: 10px; }
      .nav-item img { width: 60px; height: 60px; }
      .nav-item span { font-size: 12px; }
    }

    /* ============================================================
       CARD Accordion: header sempre visibile, corpo con iframe
       montato/smontato dinamicamente in base allo stato aperto/chiuso.
       ============================================================ */
    .pages-wrap{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:18px;
    }
    .page-card{
      width:100%;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .page-card-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      min-height:56px; /* touch target generoso */
    }
    .page-card-title{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:16px;
      font-weight:700;
      color:#222;
    }
    .page-card-chevron{
      font-size:20px;
      color:var(--accent);
      transition: transform 0.2s ease;
      width:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }
    .page-card.open .page-card-chevron{ transform: rotate(90deg); }

    .page-card-status{
      font-size:12px;
      color:var(--muted);
      padding:3px 9px;
      border-radius:20px;
      background:#eef1f5;
      white-space:nowrap;
    }
    .page-card.open .page-card-status{
      background:#dff0e2;
      color:#2f7a3d;
    }

    .page-card-body{
      max-height:0;
      overflow:hidden;
      transition: max-height 0.25s ease;
    }
    .page-card.open .page-card-body{
      max-height:80vh; /* abbastanza alto da rendere l'iframe realmente usabile */
    }

    .page-iframe-wrap{
      padding:0 10px 10px;
    }
    .page-card iframe{
      width:100%;
      height:70vh;
      border:1px solid #e6e9ef;
      border-radius:8px;
      display:block;
      background:#fafbfd;
    }
  </style>
</head>
<body>
  <div class="container">

    <nav class="nav">
      <a href="organizer4.html" class="nav-item">
        <img src="rimage/orga4x.png" alt="Organizer">
        <span> NOTE </span>
      </a>
      <a href="caldsp.html" class="nav-item">
        <img src="rimage/calicon.png" alt="Calendario dsp">
        <span> DATE </span>
      </a>
      <a href="check01.html" class="nav-item">
        <img src="rimage/check02.png" alt="Checklist">
        <span>LISTE</span>
      </a>
      <a href="strweb.html" class="nav-item">
        <img src="rimage/webicon.png" alt="Strumenti web" loading="lazy" decoding="async" width="84" height="84">
        <span> WEB </span>
      </a>
      <a href="dashconsolle.html" class="nav-item">
        <img src="rimage/opzioni.png" alt="Opzioni">
        <span> ADD </span>
      </a>
    </nav>

    <div class="title-bar">
      <div class="page-title">📊 DASHBOARD</div>
    </div>

    <div id="pagesWrap" class="pages-wrap"></div>

  </div>

<script>
/* ============================================================
   DASHBOARD — elenco pagine facilmente modificabile.

   Per aggiungere, rimuovere o rinominare una pagina, basta
   modificare questo array: il rendering delle card si genera
   automaticamente da qui, in ordine.
   ============================================================ */
const pages = [
  { title: "Calendario",        url: "caldsp.html" },
  { title: "Organizer",         url: "organizer4.html" },
  { title: "Checklist",         url: "check01.html" },
  { title: "Planner",           url: "planner2.html" },
  { title: "Strumenti Web",     url: "strweb.html" },
  { title: "Lavagna Pro",       url: "orgcanv4.html" },
  { title: "Consolle / Opzioni",url: "dashconsolle.html" },
  { title: "Workflow Manager",  url: "flussi.html" }
];

/* ============================================================
   GESTIONE MEMORIA — il cuore del modulo.

   Ogni card nasce con l'iframe SENZA src (nessuna pagina caricata
   all'avvio, come richiesto: "non caricare tutti gli iframe
   all'avvio"). loading="lazy" è impostato per buona pratica anche
   se qui il controllo reale è manuale via JS, non tramite scroll.

   - Espandere una card  → iframe.src = url della pagina (la carica
     in quel momento, non prima).
   - Comprimere una card → iframe.src = "" (il browser scarica
     immediatamente il documento e la sua memoria associata: è
     esattamente il meccanismo che libera la RAM).

   APERTURA LIBERA: ogni card è indipendente dalle altre. Possono
   restare aperte contemporaneamente tutte, alcune, o una sola, a
   scelta dell'utente — nessun vincolo imposto dal codice. La
   gestione della RAM resta comunque attiva per-card: solo le pagine
   effettivamente espanse in quel momento occupano memoria.
   ============================================================ */

function buildCard(page, index) {
  const card = document.createElement('div');
  card.className = 'page-card';
  card.dataset.index = index;

  card.innerHTML = `
    <div class="page-card-header">
      <div class="page-card-title">
        <span>${page.title}</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="page-card-status">Chiusa</span>
        <span class="page-card-chevron">▶</span>
      </div>
    </div>
    <div class="page-card-body">
      <div class="page-iframe-wrap">
        <iframe src="" loading="lazy" title="${page.title}"></iframe>
      </div>
    </div>
  `;

  card.querySelector('.page-card-header').addEventListener('click', () => toggleCard(index));

  return card;
}

function renderDashboard() {
  const wrap = document.getElementById('pagesWrap');
  wrap.innerHTML = '';
  pages.forEach((page, index) => {
    wrap.appendChild(buildCard(page, index));
  });
}

function getCardElement(index) {
  return document.querySelector(`.page-card[data-index="${index}"]`);
}

function setCardOpenState(index, isOpen) {
  const card = getCardElement(index);
  if (!card) return;
  const iframe = card.querySelector('iframe');
  const statusEl = card.querySelector('.page-card-status');

  if (isOpen) {
    card.classList.add('open');
    iframe.src = pages[index].url; // carica la pagina solo ora
    statusEl.textContent = 'Aperta';
  } else {
    card.classList.remove('open');
    iframe.src = ''; // libera subito la RAM occupata dal contenuto caricato
    statusEl.textContent = 'Chiusa';
  }
}

// Ogni card si apre/chiude in modo del tutto indipendente dalle altre:
// possono restare aperte tutte insieme, a scelta, senza limiti imposti
// dal codice. Questo aumenta il possibile consumo di RAM se si aprono
// molte card pesanti insieme: è una scelta esplicita a favore della
// flessibilità d'uso rispetto al risparmio massimo di memoria.
function toggleCard(index) {
  const card = getCardElement(index);
  const isOpen = card.classList.contains('open');
  setCardOpenState(index, !isOpen);
}

window.addEventListener('load', renderDashboard);
</script>
</body>
</html>
