<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>La mia bolla</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05000f;overflow:hidden;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:480px;height:870px;flex:none;overflow:hidden;background:#05000f;box-shadow:0 0 60px rgba(122,44,255,.35)}
canvas{position:absolute;left:0;top:0;width:480px;height:520px;display:block}
#mu{position:absolute;right:10px;top:8px;width:34px;height:28px;z-index:15;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(10,0,30,.6);color:#fff;font-size:14px;cursor:pointer}
#vc{position:absolute;right:50px;top:8px;height:28px;padding:0 10px;z-index:15;border-radius:999px;border:1px solid rgba(110,231,255,.65);background:rgba(10,0,30,.72);color:#e8e0ff;font:700 11px "Trebuchet MS",sans-serif;cursor:pointer;white-space:nowrap}
#vc:active{background:rgba(110,231,255,.35)}
#tb{position:absolute;left:0;top:520px;width:480px;height:240px;padding:10px 14px;background:linear-gradient(180deg,#140a30,#0a0420);border-top:2px solid rgba(110,231,255,.55);box-shadow:0 -6px 24px rgba(122,44,255,.3);overflow:hidden}
#who{font:800 italic 14px "Trebuchet MS",sans-serif;letter-spacing:.08em;color:#ffe27a;height:18px;text-transform:uppercase}
#tx{font-size:14.5px;line-height:1.36;color:#ece8ff;margin:4px 0 8px;min-height:44px;max-height:128px;overflow:hidden}
#op{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch{font:700 13px "Trebuchet MS",sans-serif;color:#e8e0ff;text-align:left;background:rgba(30,10,70,.8);border:1px solid rgba(110,231,255,.6);border-radius:10px;padding:7px 9px;cursor:pointer;line-height:1.2}
.ch:active{background:rgba(110,231,255,.35)}
.ch:last-child:nth-child(odd){grid-column:span 2}
#pc{position:absolute;left:0;top:760px;width:480px;height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(180deg,#14072e,#07021a);border-top:2px solid rgba(110,231,255,.35)}
.bt{width:88px;height:88px;border-radius:50%;font-size:40px;font-weight:900;color:#fff;cursor:pointer;background:rgba(20,0,50,.7);border:2px solid rgba(110,231,255,.75);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.bt.on{background:rgba(110,231,255,.4);transform:scale(.95)}
#ac{width:150px;height:76px;border-radius:38px;border:2px solid #fff;font:800 15px "Trebuchet MS",sans-serif;color:#fff;background:rgba(60,40,110,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.15;text-align:center}
#ac span{font-size:26px}
#ac.hot{background:linear-gradient(135deg,#00e5ff,#7a2cff);box-shadow:0 0 20px rgba(0,229,255,.7)}
#ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(20,5,50,.7),rgba(5,0,15,.95))}
#ov.hide{display:none}
h1{font-size:68px;line-height:.95;font-style:italic;font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#ffe27a 10%,#ff7ab0 55%,#7a8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(160,100,255,.7))}
h1 small{display:block;font-size:.22em;letter-spacing:.3em;color:#6ee7ff;-webkit-text-fill-color:#6ee7ff;margin-top:10px}
#sub{margin:18px 30px 16px;font-size:15px;line-height:1.5;color:#dcd4ff}
#wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 20px 20px}
.lb{font:700 13px "Trebuchet MS",sans-serif;color:#dcd4ff;background:rgba(20,0,50,.7);border:1px solid rgba(110,231,255,.6);border-radius:999px;padding:6px 12px;cursor:pointer}
.lb.on{background:linear-gradient(135deg,#00e5ff,#7a2cff);color:#fff;border-color:#fff}
#go{font:inherit;font-weight:900;font-style:italic;letter-spacing:.12em;font-size:22px;color:#fff;cursor:pointer;padding:12px 40px;border-radius:999px;border:2px solid #fff;background:linear-gradient(135deg,#ff7ab0,#7a2cff);box-shadow:0 0 24px rgba(160,100,255,.7)}
</style></head><body>
<div id="stage"><canvas id="c" width="480" height="520"></canvas>
<button id="vc" type="button" title="Cambia voce">🎙️ Voce</button>
<button id="mu">🔊</button>
<div id="tb"><div id="who"></div><div id="tx"></div><div id="op"></div></div>
<div id="pc"><div class="bt" id="bl">◀</div><div id="ac"></div><div class="bt" id="br">▶</div></div>
<div id="ov"><div><h1>TIME<br>MACHINE<small>ERE E CIVILTÀ</small></h1>
<p id="sub">Cammina ◀ ▶, esplora, osserva, parla con chi incontri, scegli cosa dire. Attraversa un varco verso un altra epoca.</p>
<div id="wl"></div><button id="go">ENTRA</button></div></div></div>
<!-- Carica prima il nucleo, poi i mondi (l'ordine qui = ordine nel menu), infine il motore.
     Per aggiungere un mondo: crea mondi/nuovo.js e aggiungi una riga <script> prima di motore.js -->
<script src="nucleo/disegno.js"></script>
<script src="nucleo/elementi.js"></script>
<script src="nucleo/mondi.js"></script>
<script src="mondi/grecia.js"></script>
<script src="mondi/dinosauri.js"></script>
<script src="mondi/ominidi.js"></script> 
<script src="mondi/preistoria.js"></script>      
<script src="mondi/mesopotamia.js"></script>   
<script src="mondi/egitto.js"></script>   
<script src="mondi/fenici.js"></script>     
<script src="mondi/greci.js"></script>   
<script src="mondi/persiani.js"></script>     
<script src="mondi/maya.js"></script>    
<script src="mondi/alessandro.js"></script> 
<script src="mondi/romani.js"></script> 
<script src="mondi/barbari.js"></script>     
<script src="mondi/medioevo.js"></script>    
<script src="mondi/colombo.js"></script> 
<script src="mondi/rinascimento.js"></script> 
<script src="mondi/seicento.js"></script>    
<script src="mondi/francese.js"></script> 
<script src="mondi/settecento.js"></script>    
<script src="mondi/indipendenza.js"></script>
<script src="mondi/ottocento.js"></script>    
<script src="mondi/napoleone.js"></script>  
<script src="mondi/secessione.js"></script>      
<script src="mondi/industriale.js"></script> 
<script src="mondi/unita.js"></script>
<script src="mondi/novecento.js"></script>
<script src="mondi/mondiale1.js"></script>     
<script src="mondi/mondiale2.js"></script>   
<script src="mondi/luna.js"></script>     
<script src="mondi/duemila.js"></script>          
<script src="nucleo/motore.js"></script>
<script>
(function () {
  const testoDialogo = document.getElementById('tx');
  const controlli = document.getElementById('op');
  const btnVoce = document.getElementById('vc');
  if (!testoDialogo) return;

  testoDialogo.style.cursor = 'pointer';
  testoDialogo.title = 'Tocca per ascoltare il dialogo';

  let vociDisponibili = [];
  let indiceVoce = 0;
  let toastTimer = null;

  function punteggioVoce(v) {
    let p = 0;
    const nome = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();

    if (lang === 'it-it') p += 30;
    else if (lang.startsWith('it')) p += 15;

    if (!v.localService) p += 10;
    if (nome.includes('natural') || nome.includes('neural') || nome.includes('enhanced') || nome.includes('premium')) {
      p += 15;
    }
    if (nome.includes('google')) p += 5;
    return p;
  }

  function aggiornaEtichettaBottone() {
    if (!btnVoce) return;
    const v = vociDisponibili[indiceVoce];
    if (!v) {
      btnVoce.textContent = '🎙️ Voce';
      btnVoce.title = 'Nessuna voce rilevata';
      return;
    }
    const nomeBreve = (v.name || 'Voce').replace(/^Google\s+/i, '').slice(0, 14);
    btnVoce.textContent = `🎙️ ${indiceVoce + 1}/${vociDisponibili.length}`;
    btnVoce.title = `Voce: ${v.name} (${v.lang}) — Tocca per cambiare`;
  }

  function mostraNomeVoce(v) {
    if (!v || !btnVoce) return;
    const vecchioBadge = document.getElementById('vc-info');
    if (vecchioBadge) vecchioBadge.remove();

    const badge = document.createElement('div');
    badge.id = 'vc-info';
    badge.textContent = `${v.name} (${v.lang})`;
    badge.style.cssText = 'position:absolute;right:10px;top:42px;z-index:16;max-width:260px;padding:4px 8px;border-radius:8px;background:rgba(15,5,40,.92);border:1px solid rgba(110,231,255,.7);color:#ffe27a;font:700 11px "Trebuchet MS",sans-serif;pointer-events:none;text-align:right';
    document.getElementById('stage').appendChild(badge);

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      if (badge.parentNode) badge.remove();
    }, 2200);
  }

  function aggiornaVoci() {
    if (!('speechSynthesis' in window)) return;
    const precedente = vociDisponibili[indiceVoce];
    const tutte = window.speechSynthesis.getVoices() || [];
    if (!tutte.length) return;

    const italiane = tutte
      .filter(v => (v.lang || '').toLowerCase().startsWith('it'))
      .sort((a, b) => punteggioVoce(b) - punteggioVoce(a));

    vociDisponibili = italiane.length ? italiane : tutte;

    if (precedente) {
      const idxTrovato = vociDisponibili.findIndex(v => v.name === precedente.name && v.lang === precedente.lang);
      indiceVoce = idxTrovato >= 0 ? idxTrovato : 0;
    } else {
      indiceVoce = 0;
    }
    aggiornaEtichettaBottone();
  }

  function spezzaInFrasi(testo) {
    const parti = testo.match(/[^.!?…]+[.!?…]*|[^.!?…]+$/g);
    return parti ? parti.map(s => s.trim()).filter(Boolean) : [testo];
  }

  function leggiTesto(testo) {
    if (!('speechSynthesis' in window)) {
      alert('La sintesi vocale non è supportata da questo browser.');
      return;
    }

    aggiornaVoci();
    window.speechSynthesis.cancel();

    const voceSelezionata = vociDisponibili[indiceVoce] || null;
    const frasi = spezzaInFrasi(testo);
    frasi.forEach((frase) => {
      const u = new SpeechSynthesisUtterance(frase);
      u.lang = voceSelezionata ? voceSelezionata.lang : 'it-IT';
      u.rate = 1;
      u.pitch = 1;
      if (voceSelezionata) {
        u.voice = voceSelezionata;
      }
      window.speechSynthesis.speak(u);
    });
  }

  if (btnVoce) {
    btnVoce.addEventListener('click', function () {
      aggiornaVoci();
      if (!vociDisponibili.length) return;
      indiceVoce = (indiceVoce + 1) % vociDisponibili.length;
      aggiornaEtichettaBottone();
      const voceCorrente = vociDisponibili[indiceVoce];
      mostraNomeVoce(voceCorrente);

      const testo = testoDialogo.innerText.trim();
      if (testo) {
        leggiTesto(testo);
      }
    });
  }

  testoDialogo.addEventListener('click', function () {
    const testo = this.innerText.trim();
    if (!testo) return;
    leggiTesto(testo);
  });

  if (controlli) {
    controlli.addEventListener('click', function () {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });
  }

  aggiornaVoci();
  if ('speechSynthesis' in window && 'onvoiceschanged' in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = aggiornaVoci;
  }
})();
</script>     
</body></html>
