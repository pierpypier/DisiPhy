    --card:#ffffff;
    --accent:#1e88e5;
    --cal-accent:#2b6cb0;
    --muted:#6b7280;

    --radius:12px;
    --max-width:820px;
    --ok:#2f7a3d;

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 100%);

    display:flex;
    justify-content:center;

  .container{ width:100%; max-width:var(--max-width); }

  .nav {
    display: flex; justify-content: center; gap: 10px;
    padding: 5px 0; margin-bottom: 10px; flex-wrap: wrap;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: #000; font-size: 14px; transition: opacity 0.2s ease;
  }
  .nav-item img { width: 84px; height: 84px; margin-bottom: 1px; transition: transform 0.2s ease; }
  .nav-item:hover img { transform: scale(1.05); }
  .nav-item:hover { opacity: 0.85; }
  @media (max-width: 600px) {
    .nav { gap: 10px; }
    .nav-item img { width: 60px; height: 60px; }
    .nav-item span { font-size: 12px; }
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:18px;
  }
  .section-title{ font-size:18px; font-weight:800; color:var(--accent); margin:0 0 6px 0; }
  .hint{ font-size:12px; color:var(--muted); margin-bottom:14px; }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:10px;
    margin-bottom:16px;
  }
  .stat-box{
    background:#f7f9fc;
    border:1px solid #e6e9ef;
    border-radius:10px;
    padding:12px 14px;
  }
  .stat-box .stat-label{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .stat-box .stat-value{ font-size:19px; font-weight:800; color:#111827; }
  .stat-box.ok .stat-value{ color:var(--ok); }

  .mov-form{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:10px;
    background:#f7f9fc;
    border:1px solid #e6e9ef;
    border-radius:10px;
    padding:14px;
    margin-bottom:16px;
    align-items:end;
  }
  .mov-form label{ display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .mov-form input{
    width:100%; padding:9px 10px; border-radius:8px;
    border:1px solid #e6e9ef; font-size:14px; font-family:inherit;
  }
  .btn{
    border:none; border-radius:8px; padding:10px 18px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:#e5e7eb; color:#374151; }
  .btn:hover{ filter:brightness(0.96); }
  .form-actions{ display:flex; gap:10px; margin-bottom:14px; }

  table.mov-table{ width:100%; border-collapse:collapse; font-size:14px; }
  table.mov-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); border-bottom:2px solid #e6e9ef; padding:6px 8px;
    cursor:pointer; user-select:none;
  }
  table.mov-table th:hover{ color:var(--accent); }
  table.mov-table td{ padding:9px 8px; border-bottom:1px solid #f0f2f5; }
  table.mov-table tr:hover td{ background:#f9fbfd; }
  .row-actions button{ background:none; border:none; cursor:pointer; font-size:14px; padding:2px 4px; }
  .row-actions button:hover{ opacity:.7; }
  .empty-msg{ color:var(--muted); font-size:14px; font-style:italic; padding:10px 2px; }

  /* ============================================================
     BARRA DI NAVIGAZIONE SECONDARIA — moduli del gestionale conti
     ============================================================ */
  .banca-nav-divider{
    border: none;
    border-top: 1px solid #e6e9ef;
    margin: 24px 0 14px 0;
  }
  .banca-nav{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .banca-nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-decoration:none;
    color:#374151;
    font-size:11px;
    font-weight:700;
  }
  .banca-nav-item .icon{
    width:46px;
    height:46px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:transform 0.15s ease, background 0.15s ease;

  .banca-nav-item:hover .icon{ transform:scale(1.06); }
  .banca-nav-item.active .icon{ background:var(--accent); }
  .banca-nav-item.active span.lbl{ color:var(--accent); }

</style>

    <a href="organizer4.html" class="nav-item">

    <a href="caldsp.html" class="nav-item">

      <span> DATE </span>

    <a href="check01.html" class="nav-item">
      <img src="rimage/check02.png" alt="Checklist">

    <a href="strweb.html" class="nav-item">
      <img src="rimage/webicon.png" alt="Strumenti web" loading="lazy" decoding="async" width="84" height="84">

    </a>
    <a href="dashconsolle.html" class="nav-item">
      <img src="rimage/opzioni.png" alt="Opzioni">
      <span> ADD </span>
    </a>
  </nav>

  <div class="card">
    <div class="section-title">📜 Storico Entrate</div>
    <div class="hint">Cronologia di stipendi, tredicesime e quattordicesime. Modulo di sola consultazione: non influisce sui calcoli degli altri moduli.</div>

    <div class="form-actions">
      <button class="btn btn-secondary" id="btnImportaIniziali">📥 Importa storico dal file Excel</button>
    </div>

    <div class="stat-grid" id="statTotali"></div>

    <div class="mov-form">
      <div><label>Descrizione</label><input type="text" id="fDesc" placeholder="Es. stipendio agosto 26"></div>
      <div><label>Data</label><input type="date" id="fData"></div>
      <div><label>Importo (€)</label><input type="number" step="0.01" id="fImporto"></div>

    </div>

    <table class="mov-table">
      <thead>
        <tr>
          <th data-sort="descrizione">Descrizione</th>
          <th data-sort="data">Data ▾</th>
          <th data-sort="importo">Importo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbodyStorico"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">Nessuna voce nello storico.</div>
  </div>



  <!-- ============================================================
       BARRA DI NAVIGAZIONE SECONDARIA — moduli del gestionale conti
       ============================================================ -->
  <hr class="banca-nav-divider">
  <nav class="banca-nav">
    <a href="bancaconsolle.html" class="banca-nav-item">
      <span class="icon">🏦</span>
      <span class="lbl">Consolle</span>
    </a>
    <a href="bancaconti.html" class="banca-nav-item">

    </a>
    <a href="bancaacquisti.html" class="banca-nav-item">
      <span class="icon">🛒</span>
      <span class="lbl">Acquisti</span>
    </a>
    <a href="bancacontanti.html" class="banca-nav-item">
      <span class="icon">💵</span>
      <span class="lbl">Contanti</span>
    </a>
    <a href="bancadiletta.html" class="banca-nav-item">
      <span class="icon">🎒</span>
      <span class="lbl">Diletta</span>
    </a>
    <a href="bancastorico.html" class="banca-nav-item active">
      <span class="icon">📜</span>
      <span class="lbl">Storico</span>
    </a>
  </nav>

</div>

<script>
/* ================================================================
   CHIAVE localStorage — modulo indipendente, non letto da altri
   ================================================================ */
const LS_STORICO = 'banca_storico_v1';

let storico = [];
let ordinamento = { campo: 'data', direzione: 'desc' };

function loadStorico(){
  try{
    const raw = localStorage.getItem(LS_STORICO);
    if(raw) storico = JSON.parse(raw);
  }catch(e){ console.warn('Errore lettura banca_storico_v1', e); }
}
function saveStorico(){
  try{ localStorage.setItem(LS_STORICO, JSON.stringify(storico)); }
  catch(e){ console.warn('Errore salvataggio banca_storico_v1', e); }
}

function eur(n){
  if(typeof n !== 'number' || isNaN(n)) n = 0;
  return n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function dataIt(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('it-IT');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ================================================================
   RENDER
   ================================================================ */
function renderStat(){
  const totale = storico.reduce((s,x) => s + (Number(x.importo)||0), 0);
  const media = storico.length > 0 ? totale / storico.length : 0;
  document.getElementById('statTotali').innerHTML = `
    <div class="stat-box"><div class="stat-label">Numero voci</div><div class="stat-value">${storico.length}</div></div>
    <div class="stat-box ok"><div class="stat-label">Totale storico</div><div class="stat-value">${eur(totale)}</div></div>
    <div class="stat-box"><div class="stat-label">Importo medio</div><div class="stat-value">${eur(media)}</div></div>
  `;
}

function renderTabella(){
  const tbody = document.getElementById('tbodyStorico');
  tbody.innerHTML = '';
  document.getElementById('emptyMsg').style.display = storico.length === 0 ? 'block' : 'none';

  const lista = [...storico].sort((a,b) => {
    let va = a[ordinamento.campo], vb = b[ordinamento.campo];
    if(ordinamento.campo === 'importo'){ va = Number(va)||0; vb = Number(vb)||0; }
    if(va < vb) return ordinamento.direzione === 'asc' ? -1 : 1;
    if(va > vb) return ordinamento.direzione === 'asc' ? 1 : -1;
    return 0;
  });

  lista.forEach(x => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(x.descrizione)}</td>
      <td>${dataIt(x.data)}</td>
      <td>${eur(Number(x.importo)||0)}</td>
      <td class="row-actions"><button title="Elimina" data-del="${x.id}">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      storico = storico.filter(x => x.id !== btn.dataset.del);
      saveStorico();
      renderAll();
    });
  });
}

function renderAll(){
  renderStat();
  renderTabella();
}

/* ================================================================
   ORDINAMENTO CLICCABILE SULLE INTESTAZIONI
   ================================================================ */
function initSorting(){
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const campo = th.dataset.sort;
      if(ordinamento.campo === campo){
        ordinamento.direzione = ordinamento.direzione === 'asc' ? 'desc' : 'asc';
      } else {
        ordinamento.campo = campo;
        ordinamento.direzione = 'asc';
      }
      renderTabella();
    });
  });
}

/* ================================================================
   AGGIUNTA VOCE
   ================================================================ */
function aggiungiVoce(){
  const descrizione = document.getElementById('fDesc').value.trim();
  const data = document.getElementById('fData').value;
  const importo = parseFloat(document.getElementById('fImporto').value);
  if(!descrizione){ alert('Inserisci una descrizione.'); return; }
  if(isNaN(importo) || importo <= 0){ alert('Inserisci un importo valido maggiore di zero.'); return; }

  storico.push({ id: 'h_' + Date.now(), descrizione, data: data || null, importo });
  saveStorico();

  document.getElementById('fDesc').value = '';
  document.getElementById('fData').value = '';
  document.getElementById('fImporto').value = '';
  document.getElementById('fDesc').focus();

  renderAll();
}

/* ================================================================
   IMPORTAZIONE DATI INIZIALI (dal file Excel originale)
   ================================================================ */
const IMPORT_STORICO = [
  { descrizione:'Quattordicesima Pier 2021', data:'2021-07-30', importo:89 },
  { descrizione:'Tredicesima Pier 2021', data:'2021-12-21', importo:614 },
  { descrizione:'Quattordicesima Pier 2022', data:'2022-08-05', importo:1047 },
  { descrizione:'Tredicesima Pier 2022', data:'2022-12-27', importo:1052 },
  { descrizione:'Quattordicesima Pier 2023', data:'2023-07-26', importo:1069 },
  { descrizione:'Tredicesima Pier 2023', data:'2023-12-21', importo:1068 },
  { descrizione:'Quattordicesima Pier 2024', data:'2024-07-19', importo:1116 },
  { descrizione:'Tredicesima Pier 2024', data:'2024-12-19', importo:1129 },
  { descrizione:'Stipendio Giugno 25', data:'2025-07-17', importo:1500 },
  { descrizione:'Quattordicesima Pier 2025', data:'2025-08-01', importo:1148 },
  { descrizione:'stipendio luglio 25', data:'2025-08-13', importo:1864 },
  { descrizione:'stipendio agosto 25', data:'2025-09-17', importo:1524 },
  { descrizione:'stipendio settembre 25', data:'2025-10-16', importo:1516 },
  { descrizione:'stipendio ottobre 25', data:'2025-11-18', importo:1575 },
  { descrizione:'stipendio novembre 25', data:'2025-12-16', importo:1745 },
  { descrizione:'Tredicesima Pier 2025', data:'2025-12-17', importo:1170 },
  { descrizione:'stipendio dicembre 25', data:'2026-01-20', importo:1549 },
  { descrizione:'stipendio gennaio 26', data:'2026-02-17', importo:1554 },
  { descrizione:'stipendio febbraio 26', data:'2026-03-17', importo:1540 },
  { descrizione:'stipendio marzo 26', data:'2026-04-20', importo:1557 },
  { descrizione:'stipendio aprile 26 (istant.)', data:'2026-05-18', importo:1540 },
  { descrizione:'stipendio maggio 26', data:'2026-06-17', importo:1550 },
  { descrizione:'stipendio giugno 26', data:'2026-07-16', importo:1540 },
  { descrizione:'Quattordicesima Pier 2026', data:'2026-08-07', importo:1190 }
];

function eseguiImportazioneIniziale(){
  if(storico.length > 0){
    const continua = confirm(
      `Sono già presenti ${storico.length} voci nello storico.\n` +
      `Importando di nuovo, le 24 voci del file Excel verranno AGGIUNTE a quelle esistenti (non sostituite).\n\n` +
      `Vuoi continuare comunque?`
    );
    if(!continua) return;
  } else {
    const conferma = confirm('Verranno importate le 24 voci di storico (stipendi, tredicesime, quattordicesime) presenti nel file Excel originale. Continuare?');
    if(!conferma) return;
  }

  IMPORT_STORICO.forEach((x,i) => storico.push(Object.assign({ id:'h_import_'+Date.now()+'_'+i }, x)));
  saveStorico();
  renderAll();
  alert('Importazione completata: 24 voci caricate.');
}

/* ================================================================
   AVVIO
   ================================================================ */
window.addEventListener('DOMContentLoaded', () => {
  loadStorico();
  initSorting();
  renderAll();

  document.getElementById('btnAggiungi').addEventListener('click', aggiungiVoce);
  document.getElementById('btnImportaIniziali').addEventListener('click', eseguiImportazioneIniziale);

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){ loadStorico(); renderAll(); }
  });
});
</script>
</body>
