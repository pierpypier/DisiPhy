<script>
/* Menu a domande con le serie sfogliabili (sostituisce topicsD di mondi.js; deve stare subito dopo) */
topicsD=function(greet,T){
 const n=T.length,serie=Math.ceil(n/4),fatte=new Set();let pag=0;
 const gruppo=p=>[0,1,2,3].map(k=>p*4+k).filter(i=>i<n);
 const finita=p=>gruppo(p).every(i=>fatte.has(i));
 const scelte=()=>{
  if(!n)return[];
  if(fatte.size>=n){fatte.clear();pag=0}
  while(finita(pag))pag=(pag+1)%serie;     // serie esaurita: passa da sola alla successiva
  return gruppo(pag).filter(i=>!fatte.has(i)).map(i=>[T[i][0],'t'+i]);
 };
 const d={a:{t:greet,o:scelte}};
 T.forEach((x,i)=>{d['t'+i]={t:x[1],m:i%3==2?'n'+i:undefined,o:()=>{fatte.add(i);return scelte()}}});
 Object.defineProperty(d,'_serie',{value:{
  totale:serie,
  attuale:()=>pag+1,
  avanti(){pag=(pag+1)%serie;if(finita(pag))gruppo(pag).forEach(i=>fatte.delete(i));return scelte()},
  azzera(){fatte.clear();pag=0}
 }});
 return d;
};
</script>

<script>
const testoDialogo = document.getElementById('tx');
const opzioniDialogo = document.getElementById('op');
testoDialogo.style.cursor = 'pointer';
testoDialogo.title = 'Tocca per ascoltare il dialogo';
let voci = [];
const caricaVoci = () => {
    voci = speechSynthesis.getVoices().filter(v =>
        v.lang.toLowerCase().replace('_', '-').startsWith('it')
    );
};
if ('speechSynthesis' in window) {
    caricaVoci();
    speechSynthesis.onvoiceschanged = caricaVoci;
}
const punti = v => {
    const n = (v.name + ' ' + v.voiceURI).toLowerCase();
    let p = 0;
    if (/neural|natural|premium|enhanced|wavenet|online/.test(n)) p += 4;
    if (/google/.test(n)) p += 3;
    if (!v.localService) p += 2;
    if (v.lang.toLowerCase().replace('_', '-') == 'it-it') p += 1;
    return p;
};
// Funzione comune per leggere qualsiasi testo
function leggiTesto(testo) {
    testo = testo.trim();
    if (!testo) return;
    if (!('speechSynthesis' in window)) {
        alert('La sintesi vocale non è supportata da questo browser.');
        return;
    }
    speechSynthesis.cancel();
    const voce = voci.slice().sort((a, b) => punti(b) - punti(a))[0];
    (testo.match(/[^.!?…]+[.!?…]*/g) || [testo]).forEach(fr => {
        const u = new SpeechSynthesisUtterance(fr.trim());
        u.lang = 'it-IT';
        u.rate = 1;
        u.pitch = 1;
        if (voce) u.voice = voce;
        speechSynthesis.speak(u);
    });
}
// Lettura dei dialoghi e delle descrizioni
// (legge il testo completo del dialogo, anche se la scrittura è ancora in corso)
testoDialogo.addEventListener('click', function() {
    leggiTesto(dl && dl.text ? dl.text : this.innerText);
});
// Lettura delle domande e delle opzioni
opzioniDialogo.addEventListener('click', function(e) {
    const pulsante = e.target.closest('.ch');
    if (pulsante) {
        let testo = pulsante.innerText;
        // Rimuove il numero iniziale della domanda
        testo = testo.replace(/^\s*\d+[\s.)\-:]+/, '');
        // Rimuove emoji e simboli pittografici
        testo = testo.replace(/\p{Extended_Pictographic}/gu, '');
        // Elimina spazi superflui
        testo = testo.trim();
        leggiTesto(testo);
    }
}, true);
</script>

<script>
/* ===== Scorrimento del testo: pulsanti ▲▼, dito, tastiera ===== */
(function(){
 const box=document.getElementById('tx'),sc=document.getElementById('sc'),
       up=document.getElementById('su'),dn=document.getElementById('sd');
 let prev='';
 function stato(){
  const max=box.scrollHeight-box.clientHeight,y=box.scrollTop,over=max>2;
  sc.classList.toggle('off',!over);
  up.disabled=!over||y<=1;
  dn.disabled=!over||y>=max-1;
  dn.classList.toggle('more',over&&y<max-1);
  box.classList.toggle('mt',over&&y>1);
  box.classList.toggle('mb',over&&y<max-1);
 }
 // nuovo testo (non è la continuazione di quello di prima) => torna in cima
 new MutationObserver(()=>{const s=box.textContent;if(!s.startsWith(prev))box.scrollTop=0;prev=s;stato()})
  .observe(box,{childList:true,characterData:true,subtree:true});
 box.addEventListener('scroll',stato,{passive:true});
 new ResizeObserver(stato).observe(box);

 // tocco breve = una "pagina" (80%), tenuto premuto = scorrimento continuo
 function lega(btn,d){
  let down=false,cont=false,timer=0,raf=0,last=0;
  const run=n=>{if(!cont)return;box.scrollTop+=d*320*Math.min(.05,(n-last)/1000);last=n;raf=requestAnimationFrame(run)};
  const fine=tap=>{if(!down)return;down=false;clearTimeout(timer);cancelAnimationFrame(raf);
   if(tap&&!cont)box.scrollBy({top:d*box.clientHeight*.8,behavior:'smooth'});cont=false};
  btn.addEventListener('pointerdown',e=>{e.stopPropagation();down=true;cont=false;
   timer=setTimeout(()=>{cont=true;last=performance.now();raf=requestAnimationFrame(run)},220)});
  btn.addEventListener('pointerup',()=>fine(true));
  ['pointerleave','pointercancel'].forEach(n=>btn.addEventListener(n,()=>fine(false)));
 }
 lega(up,-1);lega(dn,1);

 addEventListener('keydown',e=>{if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();
  box.scrollBy({top:(e.key=='ArrowDown'?1:-1)*box.clientHeight*.8,behavior:'smooth'})}});
})();
</script>

<script>
/* ===== PULSANTE "ALTRE DOMANDE" (solo fuori dal tour) ===== */
(function(){
 const b=document.getElementById('ns'),num=b.querySelector('span'),giro=document.getElementById('tour');
 const attuale=()=>{const s=dl&&dl.npc.d._serie;return s&&s.totale>1&&!giro.classList.contains('on')?s:null};
 function aggiorna(){
  const s=attuale();
  b.style.display=s?'flex':'none';
  if(s)num.textContent=s.attuale()+'/'+s.totale;
  requestAnimationFrame(aggiorna);
 }
 b.addEventListener('pointerdown',e=>e.stopPropagation());
 b.addEventListener('click',e=>{
  e.stopPropagation();b.blur();
  const s=attuale();if(!s||fd)return;
  dl.o=s.avanti();showOpts();
  if(!dl.done)dl.n=dl.text.length;        // completa il testo, così le domande si vedono subito
  tick(600,.05);
 });
 aggiorna();
})();

<script>
/* ===== TOUR AUTOMATICO: cammina, osserva le tappe, parla con i personaggi, legge tutto ===== */
(function(){
 const DOMANDE=20;     // massimo di domande per ogni personaggio (99 = tutte; metti 3 per un tour breve)
 const PAUSA=1800;     // millisecondi in cui il personaggio osserva prima di parlare

 const btn=document.getElementById('tour'),tb=document.getElementById('tb'),
       voceOk='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
 let giro=0,attivo=false,frase=null,blocco=null;   // "frase" resta referenziata: evita che Chrome perda l'evento di fine
 const STOP={};                                     // segnale di tour interrotto

 const controlla=id=>{if(id!==giro)throw STOP};
 const attendi=(ms,id)=>new Promise(r=>setTimeout(r,ms)).then(()=>controlla(id));
 // aspetta che una condizione sia vera, controllando a ogni fotogramma
 const finche=(cond,id)=>new Promise((ok,ko)=>{const f=()=>{if(id!==giro)return ko(STOP);if(cond())return ok();requestAnimationFrame(f)};f()});

 const pulisci=s=>s.replace(/[\p{Extended_Pictographic}\uFE0F\u200D✦]/gu,'').replace(/\s+/g,' ').trim();
 // divide in frasi brevi (le frasi troppo lunghe a volte bloccano la sintesi vocale)
 function pezzi(testo){
  const out=[];
  (testo.match(/(?:[^.!?…]|\.(?=\d))+[.!?…]*["”»’)]*/g)||[testo]).forEach(fr=>{
   let r=fr.trim();
   while(r.length>180){
    const z=r.slice(0,180);
    let i=Math.max(z.lastIndexOf(', '),z.lastIndexOf('; '),z.lastIndexOf(': '));
    if(i<60)i=z.lastIndexOf(' ');
    if(i<1)i=179;
    out.push(r.slice(0,i+1).trim());r=r.slice(i+1).trim();
   }
   if(/[\p{L}\p{N}]/u.test(r))out.push(r);
  });
  return out;
 }
 // legge un pezzo e si risolve solo quando la lettura è finita
 function pronuncia(s,tono,id){
  const lettura=1000+s.length*65;                   // durata indicativa se la voce non c'è
  if(!voceOk)return attendi(lettura,id);
  return new Promise(ok=>{
   const u=frase=new SpeechSynthesisUtterance(s),inizio=Date.now();
   const voce=voci.slice().sort((a,b)=>punti(b)-punti(a))[0];
   u.lang='it-IT';u.rate=1;u.pitch=tono;if(voce)u.voice=voce;
   let chiuso=false,muto=0,orologio=0;
   const fine=errore=>{if(chiuso)return;chiuso=true;clearInterval(orologio);
    // se la voce fallisce subito, lascia comunque il tempo di leggere a schermo
    setTimeout(ok,errore?Math.max(0,lettura-(Date.now()-inizio)):120)};
   u.onend=()=>fine(false);u.onerror=()=>fine(true);
   // sicurezza: alcuni browser a volte non segnalano la fine della frase
   orologio=setInterval(()=>{
    if(id!==giro)return fine(false);
    muto=speechSynthesis.speaking||speechSynthesis.pending?0:muto+1;
    const durata=Date.now()-inizio;
    if((muto>=4&&durata>2500)||durata>8000+s.length*160){speechSynthesis.cancel();fine(durata<lettura)}
   },300);
   speechSynthesis.speak(u);
  }).then(()=>controlla(id));
 }
 // legge un testo intero; se "scorri" è vero fa scorrere il riquadro insieme alla voce
 async function leggi(testo,id,tono,scorri){
  const box=document.getElementById('tx'),lista=pezzi(pulisci(testo)),
        tot=lista.reduce((a,s)=>a+s.length,0);
  let fatti=0;
  for(const s of lista){
   if(scorri&&dl&&dl.done){
    const max=box.scrollHeight-box.clientHeight;
    if(max>2)box.scrollTo({top:Math.max(0,box.scrollHeight*fatti/tot-box.clientHeight*.35),behavior:'smooth'});
   }
   await pronuncia(s,tono,id);fatti+=s.length;
  }
  if(scorri)box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
 }

 async function cammina(x,id){
  await finche(()=>!fd&&!dl,id);
  x=cl(x,40,wd.width-40);
  const verso=x>px?1:-1;
  if(Math.abs(x-px)>6){
   hold.l=verso<0?1:0;hold.r=verso>0?1:0;
   await finche(()=>(x-px)*verso<=4,id);
   hold.l=hold.r=0;
  }
 }
 // elenco delle soste (tappe da osservare + personaggi), in ordine da sinistra a destra
 function soste(){
  let da=0;
  const a=wd.look.map(l=>{
   const fino=Math.min(l[0],wd.width-80),x=cl((da+fino)/2,40,wd.width-40);da=fino;
   return{x,testo:l[1]};
  });
  wd.npcs.forEach(n=>a.push({x:n.x,npc:n}));
  return a.sort((p,q)=>p.x-q.x);
 }
 async function osserva(s,id){
  await cammina(s.x,id);
  dir=1;await attendi(PAUSA/2,id);
  dir=-1;await attendi(PAUSA/2,id);     // si guarda intorno
  dir=1;narrate(s.testo);
  await leggi(s.testo,id,1,true);
  await attendi(900,id);
  endDl();
 }
 // vero se passando da "nodo" si arriva ancora a una risposta non sentita (anche tornando al menu)
 function portaANuovo(d,nodo,visti,passati=new Set()){
  if(!d[nodo])return false;
  if(!visti.has(nodo))return true;
  if(passati.has(nodo)||!Array.isArray(d[nodo].o))return false;
  passati.add(nodo);
  return d[nodo].o.some(o=>o[1]&&!o[2]&&portaANuovo(d,o[1],visti,passati));
 }
 async function chiacchiera(n,id){
  const lato=px<=n.x?-1:1;
  await cammina(n.x+lato*48,id);
  dir=-lato;await attendi(700,id);
  if(n.d._serie)n.d._serie.azzera();    // il tour parte sempre dalla prima serie
  startDl(n);
  const visti=new Set(['a']);
  let fatte=0;
  while(dl&&dl.npc===n){
   await leggi(dl.text,id,1,true);
   await finche(()=>dl&&dl.done,id);
   await attendi(600,id);
   // prossima domanda: porta a una risposta nuova e non fa azioni speciali
   let i=-1;
   if(fatte<DOMANDE){
    i=dl.o.findIndex(o=>o[1]&&!o[2]&&n.d[o[1]]&&!visti.has(o[1]));
    if(i<0)i=dl.o.findIndex(o=>o[1]&&!o[2]&&portaANuovo(n.d,o[1],visti));
   }
   if(i<0)break;
   const scelta=dl.o[i],b=document.querySelectorAll('#op .ch')[i];
   if(b)b.classList.add('scelta');
   await leggi(scelta[0],id,1.2,false);   // la domanda ha un tono un po' diverso
   if(!visti.has(scelta[1]))fatte++;
   visti.add(scelta[1]);
   choose(i);
  }
  await attendi(500,id);
  farewell();
 }

 async function schermoAcceso(){
  try{if(navigator.wakeLock&&!blocco){const w=await navigator.wakeLock.request('screen');
   if(attivo&&!blocco){blocco=w;w.addEventListener('release',()=>{if(blocco===w)blocco=null})}else w.release()}}catch(e){}
 }
 function ferma(messaggio){
  if(!attivo)return;
  attivo=false;giro++;hold.l=hold.r=0;
  btn.classList.remove('on');btn.textContent='▶ tour';
  if(voceOk)speechSynthesis.cancel();
  if(blocco){blocco.release();blocco=null}
  if(messaggio)toast(messaggio);
 }
 async function parti(){
  if(!started||fd)return;
  attivo=true;const id=++giro,mondo=wi;
  btn.classList.add('on');btn.textContent='■ stop';
  aud();schermoAcceso();
  if(dl)endDl();
  hold.l=hold.r=0;
  if(voceOk)speechSynthesis.cancel();
  // parte da dove ti trovi; se sei già in fondo ricomincia dall'inizio
  const tutte=soste();
  let giroSoste=tutte.filter(s=>s.x>=px-150);
  if(!giroSoste.length||px>wd.width-400)giroSoste=tutte;
  try{
   // la prima frase parte subito al tocco: su iPhone serve per sbloccare la voce
   await leggi('Inizia il tour.',id,1,false);
   for(const s of giroSoste){
    if(wi!==mondo)throw STOP;
    if(s.npc)await chiacchiera(s.npc,id);else await osserva(s,id);
   }
   await cammina(wd.width-190,id);
   ferma('✦ Tour terminato');
  }catch(e){
   if(e!==STOP){console.error(e);ferma('Tour interrotto')}
  }
 }

 btn.addEventListener('click',e=>{e.stopPropagation();btn.blur();attivo?ferma('Tour fermato'):parti()});

 // se prendi tu i comandi, il tour si ferma e lascia tutto com'è
 ['pc','op'].forEach(i=>document.getElementById(i).addEventListener('pointerdown',()=>ferma('Tour fermato'),true));
 addEventListener('keydown',e=>{
  if(attivo&&['arrowleft','arrowright','a','d','e',' ','enter','escape','1','2','3','4'].includes(e.key.toLowerCase()))ferma('Tour fermato');
 },true);
 // durante il tour un tocco sul testo non deve far ripartire la lettura
 tb.addEventListener('click',e=>{if(attivo&&e.target.closest('#tx'))e.stopPropagation()},true);
 // tornando sulla pagina, richiede di nuovo lo schermo acceso
 document.addEventListener('visibilitychange',()=>{if(attivo&&!document.hidden)schermoAcceso()});
 addEventListener('pagehide',()=>ferma());
})();
</script>
