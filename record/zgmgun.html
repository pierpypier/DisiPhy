<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Strike</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05000f;overflow:hidden;color:#fff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{--u:1px;position:relative;width:100vw;background:#05000f;
    box-shadow:0 0 60px rgba(255,42,109,.35);overflow:hidden}
  #stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}
  canvas{width:100%;height:100%;display:block}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px)}

  #hud{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*10);display:flex;gap:calc(var(--u)*8);pointer-events:none}
  .box{background:rgba(10,0,30,.6);border:1px solid rgba(110,231,255,.45);border-radius:calc(var(--u)*8);
    padding:calc(var(--u)*4) calc(var(--u)*10);min-width:calc(var(--u)*76);text-align:center;
    box-shadow:0 0 12px rgba(110,231,255,.2) inset}
  .box b{display:block;font-size:calc(var(--u)*10);letter-spacing:.18em;color:#6ee7ff;font-weight:700}
  .box span{display:block;font-size:calc(var(--u)*23);font-weight:800;font-style:italic;
    text-shadow:0 0 10px rgba(255,42,109,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
  #weapon.spread{color:#ff8aff}

  #dash{position:absolute;right:calc(var(--u)*14);top:calc(var(--u)*14);z-index:30;
    display:inline-flex;align-items:center;gap:calc(var(--u)*8);text-decoration:none;color:#fff;
    font-weight:800;letter-spacing:.08em;font-size:calc(var(--u)*15);
    padding:calc(var(--u)*9) calc(var(--u)*18);border-radius:999px;
    background:linear-gradient(135deg,#ff2a6d,#7a2cff);border:2px solid rgba(255,255,255,.7);
    box-shadow:0 0 18px rgba(255,42,109,.7);transition:transform .15s,box-shadow .15s}
  #dash:hover,#dash:focus-visible{transform:scale(1.07);box-shadow:0 0 30px rgba(110,231,255,.9);outline:none}

  #msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;
    font-size:calc(var(--u)*40);font-weight:900;font-style:italic;letter-spacing:.06em;
    color:#ffe27a;text-shadow:0 0 18px #ff2a6d,0 0 40px #ff2a6d;opacity:0}
  #msg.bad{color:#ff6b6b}
  #msg.show{animation:pop 1.4s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(calc(var(--u)*-30))}}

  #overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(10,0,30,.55),rgba(5,0,15,.9))}
  #overlay.hide{display:none}
  .card{text-align:center;padding:calc(var(--u)*20)}
  h1{font-size:calc(var(--u)*80);line-height:1;font-style:italic;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(180deg,#ffe27a 10%,#ff2a6d 55%,#7a2cff 100%);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 18px rgba(255,42,109,.7))}
  h1 small{display:block;font-size:.34em;letter-spacing:.42em;color:#6ee7ff;-webkit-text-fill-color:#6ee7ff;margin-top:calc(var(--u)*6)}
  #sub{margin:calc(var(--u)*16) 0 calc(var(--u)*20);font-size:calc(var(--u)*18);line-height:1.5;color:#dcd4ff}
  #go{font:inherit;font-weight:900;font-style:italic;letter-spacing:.12em;font-size:calc(var(--u)*24);color:#fff;cursor:pointer;
    padding:calc(var(--u)*12) calc(var(--u)*44);border-radius:999px;border:2px solid #fff;
    background:linear-gradient(135deg,#00e5ff,#7a2cff);box-shadow:0 0 24px rgba(0,229,255,.7);transition:transform .15s}
  #go:hover{transform:scale(1.06)}
  .keys{margin-top:calc(var(--u)*18);font-size:calc(var(--u)*14);color:#9a90c9;line-height:1.7}
  .keys kbd{display:inline-block;padding:0 calc(var(--u)*7);border:1px solid #6ee7ff;border-radius:calc(var(--u)*5);color:#6ee7ff;margin:0 2px}

  #pad{display:flex;align-items:center;justify-content:space-between;
    height:calc(var(--u)*108);padding:0 calc(var(--u)*14);
    background:linear-gradient(180deg,#14072e,#07021a);border-top:2px solid rgba(110,231,255,.55);
    box-shadow:0 -6px 24px rgba(122,44,255,.35)}
  .grp{display:flex;gap:calc(var(--u)*12)}
  .tb{width:calc(var(--u)*118);height:calc(var(--u)*80);border-radius:calc(var(--u)*22);
    font-size:calc(var(--u)*34);font-weight:900;color:#fff;cursor:pointer;
    background:rgba(20,0,50,.7);border:2px solid rgba(110,231,255,.75);box-shadow:0 0 14px rgba(110,231,255,.25) inset;
    display:flex;align-items:center;justify-content:center;touch-action:none;text-align:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .tb.mid{width:calc(var(--u)*130);font-size:calc(var(--u)*17);letter-spacing:.08em;border-color:rgba(255,226,122,.8);box-shadow:0 0 14px rgba(255,226,122,.2) inset}
  .tb.act{width:calc(var(--u)*170);font-size:calc(var(--u)*22);letter-spacing:.12em}
  .tb.jump{border-color:rgba(0,229,255,.9)}
  .tb.fire{width:calc(var(--u)*210);border-color:rgba(255,77,109,.9);box-shadow:0 0 14px rgba(255,77,109,.3) inset}
  .tb.on{background:rgba(255,42,109,.65);transform:scale(.96)}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="hud">
    <div class="box"><b>PUNTI</b><span id="score">0</span></div>
    <div class="box"><b>ENERGIA</b><span id="hp">♥♥♥</span></div>
    <div class="box"><b>VITE</b><span id="lives">3</span></div>
    <div class="box"><b>ARMA</b><span id="weapon">BASE</span></div>
    <div class="box"><b>RECORD</b><span id="best">0</span></div>
  </div>

  <a id="dash" href="dashconsolle.html">🎛 DASHBOARD</a>
  <div id="msg"></div>

  <div id="overlay">
    <div class="card">
      <h1>NEON<br>STRIKE<small>CORRI · SALTA · SPARA</small></h1>
      <p id="sub">La città è invasa dai robot!<br>Attraversa il livello, distruggi i nemici e sconfiggi il boss finale.</p>
      <button id="go">GIOCA</button>
      <div class="keys">
        <kbd>←</kbd><kbd>→</kbd> muovi &nbsp; <kbd>↑</kbd> mira in alto &nbsp; <kbd>SPAZIO</kbd> salta &nbsp; <kbd>X</kbd> spara &nbsp; <kbd>M</kbd> audio
      </div>
    </div>
  </div>
</div>

<div id="pad">
  <div class="grp">
    <div class="tb" data-k="left">◀</div>
    <div class="tb" data-k="right">▶</div>
  </div>
  <div class="grp">
    <div class="tb mid" data-k="up">▲<br>MIRA</div>
  </div>
  <div class="grp">
    <div class="tb act jump" data-k="jump">SALTA</div>
    <div class="tb act fire" data-k="fire">SPARA</div>
  </div>
</div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = 960, H = 540, $ = id => document.getElementById(id), wrap = $('wrap');

  function resize() {
    const w = Math.max(320, Math.min(innerWidth, innerHeight / 0.675));
    wrap.style.width = w + 'px';
    wrap.style.setProperty('--u', (w / 960) + 'px');
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- costanti ---------- */
  const LEN = 6200, GY = 450, ARENA = LEN - W;
  const G = 1500, RUN = 190, JUMPV = 560;

  /* ---------- stato ---------- */
  let state = 'menu', lives = 3, level = 1, score = 0, T = 0, camX = 0, shake = 0, flash = 0;
  let segs = [], plats = [], spawns = [], si = 0;
  let enemies = [], pbul = [], ebul = [], caps = [], parts = [], floats = [];
  let boss = null, bossActive = false, cpX = 60, deadT = 0, clearT = 0, jumpBuf = 0;
  const keys = { left: false, right: false, up: false, fire: false, jump: false };
  const p = { x: 60, y: GY, vx: 0, vy: 0, ground: true, surf: null, dir: 1, hp: 3, inv: 0, fireCD: 0,
    weapon: 0, weaponT: 0, coy: 0, anim: 0, flashT: 0 };

  let best = 0, scores = [], committed = true;
  try { best = +localStorage.getItem('neonstrike_best') || 0; } catch (e) {}
  try { scores = JSON.parse(localStorage.getItem('neonstrike_scores') || '[]').filter(n => typeof n === 'number'); } catch (e) { scores = []; }
  function commitScore() {
    if (committed) return false;
    committed = true;
    const s = Math.floor(score);
    if (s <= 0) return false;
    const record = s > best;
    if (record) best = s;
    scores.push(s); scores.sort((a, b) => b - a); scores = scores.slice(0, 5);
    try {
      localStorage.setItem('neonstrike_best', String(best));
      localStorage.setItem('neonstrike_last', String(s));
      localStorage.setItem('neonstrike_scores', JSON.stringify(scores));
    } catch (e) {}
    return record;
  }

  /* ---------- audio ---------- */
  let ac = null, master, muted = false;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function beep(f, d, type, v, slide, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d);
  }
  function noise(d, v) {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = v;
    s.connect(g); g.connect(master); s.start();
  }
  const sfx = {
    shoot: () => beep(900, 0.07, 'square', 0.035, -600),
    jump: () => beep(320, 0.16, 'square', 0.06, 340),
    hit: () => beep(500, 0.05, 'square', 0.04, -200),
    boom: () => { noise(0.3, 0.3); beep(160, 0.2, 'sawtooth', 0.1, -110); },
    hurt: () => { beep(220, 0.4, 'sawtooth', 0.14, -160); noise(0.2, 0.2); },
    pick: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.09, 'square', 0.08, 0, i * 0.06)),
    eshoot: () => beep(260, 0.12, 'sawtooth', 0.04, -120),
    win: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => beep(f, 0.16, 'square', 0.09, 0, i * 0.1)),
    boss: () => { beep(90, 0.8, 'sawtooth', 0.16, -30); beep(130, 0.8, 'square', 0.08, -40, 0.1); }
  };
  function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; }

  function say(t, cls) {
    const m = $('msg'); m.textContent = t; m.className = ''; void m.offsetWidth; m.className = 'show ' + (cls || '');
  }
  function burst(x, y, n, cols, spd, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * spd;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, l: 0, max: (life || 0.4) + Math.random() * 0.5,
        c: cols[Math.floor(Math.random() * cols.length)], s: 2 + Math.random() * 3 });
    }
  }
  function floater(x, y, txt, c) { floats.push({ x, y, txt, c: c || '#ffe27a', t: 0 }); }

  /* ---------- generazione livello ---------- */
  function buildLevel() {
    segs = []; plats = []; spawns = []; si = 0;
    let x = 0;
    segs.push({ x1: 0, x2: 900, y: GY, main: true }); x = 900;
    while (x < ARENA - 600) {
      x += 70 + Math.random() * 25;
      const l = 520 + Math.random() * 420;
      segs.push({ x1: x, x2: x + l, y: GY, main: true }); x += l;
    }
    const last = segs[segs.length - 1];
    last.x2 = Math.min(last.x2, ARENA - 200);
    segs.push({ x1: last.x2 + 95, x2: LEN, y: GY, main: true });

    for (const s of segs) {
      const w = s.x2 - s.x1;
      if (s.x1 >= ARENA - 100) continue;
      if (w > 560) {
        const n = w > 760 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          const pw = 130 + Math.random() * 80, px = s.x1 + 120 + Math.random() * (w - pw - 240);
          const high = Math.random() < 0.5 ? 80 : 130;
          plats.push({ x1: px, x2: px + pw, y: GY - high });
          if (Math.random() < 0.4) plats.push({ x1: px + pw + 50, x2: px + pw + 50 + 110, y: GY - high - 60 });
        }
      }
      const density = Math.max(230, 340 - level * 18);
      for (let ex = Math.max(s.x1 + 80, 640); ex < s.x2 - 60; ex += density * (0.8 + Math.random() * 0.5)) {
        const r = Math.random();
        if (r < 0.42) spawns.push({ t: 'walk', x: ex });
        else if (r < 0.62) spawns.push({ t: 'turret', x: ex });
        else spawns.push({ t: 'fly', x: ex, y: 140 + Math.random() * 190 });
      }
    }
    spawns.sort((a, b) => a.x - b.x);
  }
  const surfaces = () => segs.concat(plats);
  const segAt = x => segs.find(s => x >= s.x1 && x <= s.x2);

  function resetWorld() {
    enemies = []; pbul = []; ebul = []; caps = []; floats = [];
    boss = null; bossActive = false; si = 0; camX = 0; cpX = 60;
  }
  function placePlayer(x) {
    p.x = x; const s = segAt(x) || segs[0]; p.y = GY; p.surf = s; p.ground = true;
    p.vx = 0; p.vy = 0; p.coy = 0.1;
  }

  /* ---------- flusso ---------- */
  function startGame() {
    initAudio();
    lives = 3; level = 1; score = 0; committed = false;
    p.hp = 3; p.weapon = 0; p.weaponT = 0; p.inv = 0; p.dir = 1; p.fireCD = 0;
    buildLevel(); resetWorld(); placePlayer(60);
    state = 'play'; $('overlay').classList.add('hide');
    say('LIVELLO 1'); beep(660, 0.2, 'square', 0.08);
  }
  function nextLevel() {
    level++; p.hp = 3; buildLevel(); resetWorld(); placePlayer(60); p.inv = 1.5;
    state = 'play'; say('LIVELLO ' + level);
  }
  function gameOver() {
    state = 'over';
    const record = commitScore(), s = Math.floor(score);
    $('overlay').classList.remove('hide');
    $('overlay').querySelector('h1').innerHTML = 'GAME<br>OVER<small>LA CITTÀ È CADUTA</small>';
    $('sub').innerHTML = 'Punteggio: <b>' + s + '</b> · Livello: <b>' + level + '</b>' +
      (record ? '<br>🏆 Nuovo record!' : '<br>Record: ' + best) +
      '<br><small style="font-size:.75em;color:#9a90c9">Classifica: ' + scores.map((n, i) => (i + 1) + '. ' + n).join(' · ') + '</small>';
    $('go').textContent = 'RIGIOCA';
  }
  function die() {
    if (state !== 'play') return;
    state = 'dead'; deadT = 0; lives--; p.hp = 0;
    p.vy = -420; p.ground = false; p.surf = null; shake = 0.8;
    burst(p.x, p.y - 18, 34, ['#00e5ff', '#ffe27a', '#ff2a6d', '#fff'], 280, 0.6);
    sfx.boom();
  }
  function respawn() {
    if (lives <= 0) { gameOver(); return; }
    p.hp = 3; p.inv = 2.2; p.weapon = 0; p.weaponT = 0; ebul = [];
    if (bossActive) { camX = ARENA; placePlayer(ARENA + 120); }
    else { camX = Math.max(0, Math.min(ARENA, cpX - 250)); placePlayer(cpX); }
    enemies = enemies.filter(e => Math.abs(e.x - p.x) > 450);
    state = 'play'; say('RIPROVA!');
  }
  function hurt(fromX) {
    if (p.inv > 0 || state !== 'play') return;
    p.hp--; p.inv = 1.5; shake = 0.5; flash = 0.4; sfx.hurt();
    p.vx = 0; if (!p.ground) p.vy = Math.min(p.vy, -150);
    if (p.hp <= 0) die();
  }

  /* ---------- nemici ---------- */
  function spawnEnemy(s) {
    const hpBonus = level > 2 ? 1 : 0;
    if (s.t === 'walk') {
      const seg = segAt(s.x); if (!seg) return;
      enemies.push({ t: 'walk', x: s.x, y: GY, w: 30, h: 22, hp: 1 + hpBonus, seg, spd: 62 + level * 8, anim: Math.random() * 6 });
    } else if (s.t === 'turret') {
      if (!segAt(s.x)) return;
      enemies.push({ t: 'turret', x: s.x, y: GY, w: 36, h: 34, hp: 4 + hpBonus, cd: 1 + Math.random(), aim: 0 });
    } else {
      enemies.push({ t: 'fly', x: camX + W + 50, y: s.y, y0: s.y, w: 38, h: 20, hp: 1, cd: 1 + Math.random() * 1.5,
        ph: Math.random() * 6, spd: 95 + level * 8 });
    }
  }
  function box(e) {
    if (e.t === 'fly') return [e.x - e.w / 2, e.y - e.h / 2, e.x + e.w / 2, e.y + e.h / 2];
    return [e.x - e.w / 2, e.y - e.h, e.x + e.w / 2, e.y];
  }
  function enemyShoot(e, ox, oy, spd, spread) {
    const tx = p.x, ty = p.y - 20;
    let a = Math.atan2(ty - oy, tx - ox);
    for (const d of spread || [0]) ebul.push({ x: ox, y: oy, vx: Math.cos(a + d) * spd, vy: Math.sin(a + d) * spd });
    sfx.eshoot();
  }
  function killEnemy(e) {
    const pts = { walk: 100, turret: 200, fly: 150 }[e.t];
    score += pts; floater(e.x, e.y - 30, '+' + pts);
    burst(e.x, e.t === 'fly' ? e.y : e.y - e.h / 2, 18, ['#ffe27a', '#ff8a3d', '#ff2a6d', '#fff'], 220);
    sfx.boom();
    if (Math.random() < 0.16) caps.push({ x: e.x, y: e.t === 'fly' ? e.y : e.y - 20, vy: 0, t: Math.random() < 0.5 ? 'S' : 'H' });
  }

  function updateEnemies(dt) {
    while (si < spawns.length && spawns[si].x < camX + W + 60) spawnEnemy(spawns[si++]);
    for (const e of enemies) {
      if (e.t === 'walk') {
        const d = Math.sign(p.x - e.x) || 1;
        const nx = e.x + d * e.spd * dt;
        if (nx > e.seg.x1 + 14 && nx < e.seg.x2 - 14) e.x = nx;
        e.anim += dt * 10;
      } else if (e.t === 'turret') {
        e.aim = Math.atan2(p.y - 24 - (e.y - 26), p.x - e.x);
        e.cd -= dt;
        if (e.cd <= 0 && e.x > camX + 20 && e.x < camX + W - 20) {
          e.cd = Math.max(1.1, 2.3 - level * 0.12) + Math.random() * 0.5;
          enemyShoot(e, e.x + Math.cos(e.aim) * 22, e.y - 26 + Math.sin(e.aim) * 22, 215 + level * 8);
        }
      } else {
        e.x -= e.spd * dt; e.ph += dt * 2.4; e.y = e.y0 + Math.sin(e.ph) * 38;
        e.cd -= dt;
        if (e.cd <= 0 && e.x < camX + W - 30 && e.x > camX + 40) {
          e.cd = 2.2 + Math.random(); enemyShoot(e, e.x, e.y + 8, 200 + level * 8);
        }
      }
    }
    enemies = enemies.filter(e => e.x > camX - 120 && e.hp > 0);
  }

  /* ---------- boss ---------- */
  function startBoss() {
    const hp = 40 + 12 * (level - 1);
    boss = { x: ARENA + W - 170, y: 280, hp, max: hp, t: 0, fireCD: 2.2, sumCD: 5, hitT: 0 };
    bossActive = true; flash = 0.3; sfx.boss(); say('ATTENZIONE: BOSS!', 'bad');
  }
  function updateBoss(dt) {
    if (!boss || state !== 'play') return;
    boss.t += dt; boss.hitT = Math.max(0, boss.hitT - dt);
    boss.y = 250 + Math.sin(boss.t * 1.2) * 90; boss.x = ARENA + W - 170 + Math.sin(boss.t * 0.7) * 50;
    boss.fireCD -= dt; boss.sumCD -= dt;
    if (boss.fireCD <= 0) {
      boss.fireCD = Math.max(1.0, 1.9 - level * 0.12);
      enemyShoot(boss, boss.x - 70, boss.y, 235 + level * 8, [-0.3, 0, 0.3]);
    }
    if (boss.sumCD <= 0) {
      boss.sumCD = 6.5;
      for (let i = 0; i < 2; i++) enemies.push({ t: 'fly', x: camX + W + 30 + i * 70, y: 160 + i * 120, y0: 160 + i * 120,

    if (state === 'play' && !bossActive) {
      const bw = 200, bx = W - 14 - bw, by = 66, pr = Math.min(1, p.x / ARENA);
      ctx.fillStyle = 'rgba(10,0,30,.6)'; ctx.fillRect(bx, by, bw, 6);
      ctx.fillStyle = '#6ee7ff'; ctx.fillRect(bx, by, bw * pr, 6);
      ctx.fillStyle = '#ff2a6d'; ctx.fillRect(bx + bw - 3, by - 3, 3, 12);
    }

    $('score').textContent = Math.floor(score);
    $('hp').textContent = '♥'.repeat(Math.max(0, p.hp)) + '♡'.repeat(Math.max(0, 3 - p.hp));
    $('lives').textContent = '×' + Math.max(0, lives);
    const wp = $('weapon'); wp.textContent = p.weapon ? 'SPREAD ' + Math.ceil(p.weaponT) : 'BASE'; wp.classList.toggle('spread', !!p.weapon);
    $('best').textContent = Math.max(best, Math.floor(score));
  }

  /* ---------- input ---------- */
  const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
    KeyX: 'fire', KeyJ: 'fire', KeyF: 'fire', KeyK: 'jump' };
  window.addEventListener('keydown', e => {
    if (ac && ac.state === 'suspended') ac.resume();
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'play') { if (!e.repeat) jumpBuf = 0.13; keys.jump = true; }
      else if (state === 'menu' || state === 'over') startGame();
      return;
    }
    const k = keyMap[e.code];
    if (k) {
      e.preventDefault(); keys[k] = true;
      if (k === 'jump' && state === 'play' && !e.repeat) jumpBuf = 0.13;
    }
    if (e.code === 'Enter' && (state === 'menu' || state === 'over')) { e.preventDefault(); startGame(); }
    if (e.code === 'KeyM') setMuted(!muted);
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') { keys.jump = false; return; }
    const k = keyMap[e.code]; if (k) keys[k] = false;
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); initAudio(); b.classList.add('on'); keys[k] = true;
      if (k === 'jump' && state === 'play') jumpBuf = 0.15;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, () => { keys[k] = false; b.classList.remove('on'); }));
  });
  $('go').addEventListener('click', startGame);
  window.addEventListener('pagehide', () => { if (state !== 'menu') commitScore(); });
  $('dash').addEventListener('click', () => { if (state !== 'menu') commitScore(); });

  window.__ns = {
    p, get state() { return state; }, get lives() { return lives; }, get level() { return level; },
    get score() { return score; }, get camX() { return camX; }, get enemies() { return enemies; },
    get boss() { return boss; }, get segs() { return segs; }, get ebul() { return ebul; }, ARENA, LEN, GY,
    tele(x) { camX = Math.max(0, Math.min(ARENA, x - 320)); placePlayer(x); while (si < spawns.length && spawns[si].x < camX + W + 60) si++; },
    setCam(x) { camX = x; }
  };

  buildLevel(); resetWorld(); placePlayer(60);
  const step = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= step) { update(step); acc -= step; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
