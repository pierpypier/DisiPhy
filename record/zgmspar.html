  const x=o.x-cam,by=GY-2+Math.sin(t*3+o.x)*1.2;
  if(o.type=='lance'){glow(x,GY-8,14,'#ffe9a0',.55);ctx.save();ctx.translate(x,GY-7+Math.sin(t*3+o.x)*1.2);ctx.rotate(-.5);Ln('#6a4420',-10,0,8,0,1.4);Pg('#e8e8f0',8,0,5,-2,13,0,5,2);Ln('#c9a24a',-10,0,-6,0,1.8);ctx.restore()}
  else if(o.type=='vino'){glow(x,GY-9,14,'#ff8a8a',.4);E('#b8582a',x,by-6,4.4,6);R('#b8582a',x-1.8,by-14,3.6,3.4);R('#8a3a1a',x-2.6,by-15,5.2,1.4);Ln('#8a3a1a',x-5,by-9,x-5.4,by-4,1.1);Ln('#8a3a1a',x+5,by-9,x+5.4,by-4,1.1);R('rgba(255,255,255,.3)',x-2.6,by-9,1.2,5);R('rgba(0,0,0,.3)',x-3.6,by-7,7.2,1)}
  else{glow(x,GY-7,10,'#ffd84a',.5);const w=Math.abs(Math.cos(t*4+o.x))*3.4+.6;E('#b8860b',x,by-6,w+.8,5.4);E('#ffc107',x,by-6,w,4.8);E('#ffe566',x,by-6,Math.max(w-1.2,.2),3.6)}
}
function pip(x,y,full){ctx.fillStyle=full?'#e03030':'rgba(0,0,0,.5)';ctx.beginPath();ctx.moveTo(x+3.4,y+6.4);ctx.bezierCurveTo(x-2.4,y+2,x,y-1.6,x+3.4,y+1.4);ctx.bezierCurveTo(x+6.8,y-1.6,x+9,y+2,x+3.4,y+6.4);ctx.fill();if(full)E('rgba(255,255,255,.5)',x+2,y+1.6,.9,.7)}
function drawHUD(){
  const g=ctx.createLinearGradient(0,0,0,28);g.addColorStop(0,'rgba(10,6,18,.78)');g.addColorStop(1,'rgba(10,6,18,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,28);
  for(let i=0;i<h.mhp;i++)pip(4+i*8,4,i<h.hp);
  for(let i=0;i<h.spears;i++){ctx.save();ctx.translate(6+i*7,18);ctx.rotate(-.9);Ln('#8a6a3a',-4,0,4,0,1);Pg('#e8e8f0',4,0,2.4,-1.2,7,0,2.4,1.2);ctx.restore()}
  text(String(score).padStart(6,'0'),W-4,10,9,'right','#ffe9a0');text('ATTO '+roman(stage)+'   ♥ x'+lives,W-4,20,6.4,'right','#fff');
  if(boss&&!boss.dead&&bossSp){const bw=120,bx=(W-bw)/2;text(ST[stage-1].bn,W/2,34,5.6,'center','#ffd0a0');R('rgba(0,0,0,.65)',bx-1,36,bw+2,5);R('#5a1010',bx,37,bw,3);R('#e03030',bx,37,bw*Math.max(0,boss.hp)/boss.mhp,3);R('rgba(255,255,255,.35)',bx,37,bw*Math.max(0,boss.hp)/boss.mhp,1)}
  if(st=='play'&&!bossSp&&!en.some(e=>!e.dead&&e.x>cam-10&&e.x<cam+W+10)&&Math.floor(t*2)%2)text('AVANTI ▶',W-8,GY-60,9,'right','#ffe9a0')
}
function drawBanner(){
  if(!banner||banner.t<=0)return;const a=Math.min(1,banner.t*2,(2.8-banner.t)*4+.01),al=Math.max(0,Math.min(1,a));
  ctx.save();ctx.globalAlpha=al;const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(10,6,18,0)');g.addColorStop(.15,'rgba(10,6,18,.78)');g.addColorStop(.85,'rgba(10,6,18,.78)');g.addColorStop(1,'rgba(10,6,18,0)');ctx.fillStyle=g;ctx.fillRect(0,86,W,64);
  R('rgba(232,184,74,.8)',20,88,W-40,.8);R('rgba(232,184,74,.8)',20,148,W-40,.8);
  text(banner.a,W/2,104,8,'center','#e8b84a');text(banner.b,W/2,122,Math.min(13,172/(banner.b.length*.62)),'center','#fff');if(banner.c)text(banner.c,W/2,138,7.4,'center','#ffd0a0');ctx.restore()
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);
  if(shake>0){ctx.translate((Math.random()-.5)*shake*8,(Math.random()-.5)*shake*8)}
  BGS[stage-1]();ground();
  if(st!='title'){
    for(const o of it)drawItem(o);
    for(const e of en)if(!e.boss||true)drawEn(e);
    drawHero();
    for(const p of pj)drawProj(p);for(const b of bolts)drawBolt(b);
    for(const p of pa){ctx.globalAlpha=Math.max(0,p.t/p.mt);R(p.col,p.x-cam,p.y,p.sz,p.sz);ctx.globalAlpha=1}
    drawHUD();drawBanner();
  }
  if(st=='clear'){text('VITTORIA!',W/2,112,16,'center','#ffe9a0');text('+'+(1000*stage+h.hp*100)+' punti',W/2,128,8,'center','#fff')}
  if(st=='title'||st=='over'||st=='win'){
    ctx.fillStyle='rgba(8,6,20,.62)';ctx.fillRect(0,48,W,170);R('rgba(232,184,74,.9)',14,52,W-28,.8);R('rgba(232,184,74,.9)',14,214,W-28,.8);
    if(st=='title'){
      text("L'EROE",W/2,84,22,'center','#e8b84a');text('DI SPARTA',W/2,106,22,'center','#e8b84a');
      human(W/2,150,1,1.2,HERO,{mv:0,seed:0,sh:0});
      text('Nove imprese nel mito greco',W/2,166,7.4,'center','#ffd0a0');text('RECORD: '+best,W/2,178,7,'center','#9adcff');
      text('◀▶ muovi  ·  Spazio salta  ·  J spada',W/2,192,5.6,'center','#cde');text('K scudo (tieni premuto)  ·  L lancia',W/2,200,5.6,'center','#cde')
    }else if(st=='over'){text('SEI CADUTO',W/2,100,18,'center','#ff6a5a');text('Punti: '+score,W/2,124,9,'center','#fff');text('Record: '+best,W/2,138,9,'center','#fff');if(newRec)text('NUOVO RECORD!',W/2,160,10,'center','#ffd400')}
    else{text('GLORIA ETERNA!',W/2,92,15,'center','#e8b84a');text("Hai sconfitto Tifone e",W/2,114,8,'center','#fff');text("salvato l'Olimpo.",W/2,126,8,'center','#fff');text('Punti: '+score,W/2,148,10,'center','#ffe9a0');text('Record: '+best,W/2,162,8,'center','#fff');if(newRec)text('NUOVO RECORD!',W/2,178,10,'center','#ffd400')}
    if(Math.floor(performance.now()/500)%2)text('INVIO / TOCCA PER GIOCARE',W/2,208,7,'center','#fff')
  }
}
// ---------- input ----------
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j',j:'a',J:'a',z:'a',Z:'a',k:'sh',K:'sh',x:'sh',X:'sh',ArrowDown:'sh',s:'sh',S:'sh',l:'sp',L:'sp',c:'sp',C:'sp'};
addEventListener('keydown',e=>{
  if(KM[e.key]){k[KM[e.key]]=1;e.preventDefault()}
  if((e.key=='Enter'||e.key==' '||e.key=='j'||e.key=='J')&&(st=='title'||st=='over'||st=='win')){newGame();e.preventDefault()}
});
addEventListener('keyup',e=>{if(KM[e.key])k[KM[e.key]]=0});
document.querySelectorAll('#pad button').forEach(b=>{const key=b.dataset.k,on=e=>{e.preventDefault();k[key]=1;b.classList.add('on')},off=e=>{e.preventDefault();k[key]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
cv.addEventListener('pointerdown',()=>{if(st=='title'||st=='over'||st=='win')newGame()});
addEventListener('pagehide',()=>{if(score>best){best=score;saveBest()}});
h=newHero();
// scorciatoia di prova: #s3 apre l'atto 3, #s3b direttamente il boss
(function(){const m=/^#s([1-9])(b?)$/.exec(location.hash);if(m){newGame();setupStage(+m[1],!!m[2]);st='play';banner=null}})();
window.__g={get st(){return st},get h(){return h},get en(){return en},setup:setupStage,get boss(){return boss}};
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();for(const q in k)pk[q]=k[q];requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
