<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Organizer — Acquisti Online</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e88e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="rimage/dspimage192.png">
<link rel="icon" href="rimage/dspimage192.png">

<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --accent:#1e88e5;
    --cal-accent:#2b6cb0;
    --muted:#6b7280;
    --shadow:0 6px 18px rgba(20,30,50,0.06);
    --radius:12px;
    --max-width:720px;
    --ok:#2f7a3d;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 100%);
    padding:20px;
    display:flex;
    justify-content:center;
    color:#0f172a;
  }
  .container{ width:100%; max-width:var(--max-width); }

  .nav {
    display: flex; justify-content: center; gap: 10px;
    padding: 5px 0; margin-bottom: 10px; flex-wrap: wrap;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: #000; font-size: 14px; transition: opacity 0.2s ease;
  }
  .nav-item img { width: 84px; height: 84px; margin-bottom: 1px; transition: transform 0.2s ease; }
  .nav-item:hover img { transform: scale(1.05); }
  .nav-item:hover { opacity: 0.85; }
  @media (max-width: 600px) {
    .nav { gap: 10px; }
    .nav-item img { width: 60px; height: 60px; }
    .nav-item span { font-size: 12px; }
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:18px;
  }
  .section-title{ font-size:18px; font-weight:800; color:var(--accent); margin:0 0 6px 0; }
  .hint{ font-size:12px; color:var(--muted); margin-bottom:14px; }

  .total-box{
    background:#eaf6ec;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .total-box .label{ font-size:13px; font-weight:700; color:var(--muted); }
  .total-box .value{ font-size:22px; font-weight:800; color:var(--ok); }

  .acquisto-form{
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:10px;
    background:#f7f9fc;
    border:1px solid #e6e9ef;
    border-radius:10px;
    padding:14px;
    margin-bottom:16px;
    align-items:end;
  }
  .acquisto-form label{ display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .acquisto-form input{
    width:100%; padding:9px 10px; border-radius:8px;
    border:1px solid #e6e9ef; font-size:14px; font-family:inherit;
  }
  .btn{
    border:none; border-radius:8px; padding:10px 18px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn:hover{ filter:brightness(0.96); }

  table.acquisti-table{ width:100%; border-collapse:collapse; font-size:14px; }
  table.acquisti-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); border-bottom:2px solid #e6e9ef; padding:6px 8px;
  }
  table.acquisti-table td{ padding:9px 8px; border-bottom:1px solid #f0f2f5; }
  table.acquisti-table tr:hover td{ background:#f9fbfd; }
  .row-actions button{ background:none; border:none; cursor:pointer; font-size:14px; padding:2px 4px; }
  .row-actions button:hover{ opacity:.7; }
  .empty-msg{ color:var(--muted); font-size:14px; font-style:italic; padding:10px 2px; }

  /* ============================================================
     BARRA DI NAVIGAZIONE SECONDARIA — moduli del gestionale conti
     ============================================================ */
  .banca-nav-divider{
    border: none;
    border-top: 1px solid #e6e9ef;
    margin: 24px 0 14px 0;
  }
  .banca-nav{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .banca-nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-decoration:none;
    color:#374151;
    font-size:11px;
    font-weight:700;
  }
  .banca-nav-item .icon{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#eef2f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .banca-nav-item:hover .icon{ transform:scale(1.06); }
  .banca-nav-item.active .icon{ background:var(--accent); }
  .banca-nav-item.active span.lbl{ color:var(--accent); }

</style>
</head>
<body>

<div class="container">

  <nav class="nav">
    <a href="organizer4.html" class="nav-item">
      <img src="rimage/orga4.png" alt="Organizer">
      <span> NOTE </span>
    </a>
    <a href="caldsp.html" class="nav-item">
      <img src="rimage/calicon.png" alt="Calendario dsp">
      <span> DATE </span>
    </a>
    <a href="check01.html" class="nav-item">
      <img src="rimage/check02.png" alt="Checklist">
      <span>LISTE</span>
    </a>
    <a href="strweb.html" class="nav-item">
      <img src="rimage/webicon.png" alt="Strumenti web" loading="lazy" decoding="async" width="84" height="84">
      <span> WEB </span>
    </a>
    <a href="dashconsolle.html" class="nav-item">
      <img src="rimage/opzioni.png" alt="Opzioni">
      <span> ADD </span>
    </a>
  </nav>

  <div class="card">
    <div class="section-title">🛒 Acquisti Online</div>
    <div class="hint">Il totale qui sotto viene sottratto automaticamente dal budget "Acquisti vari on-line" nel modulo Conti e Spese.</div>

    <div class="total-box">
      <span class="label">Totale acquisti tracciati</span>
      <span class="value" id="totaleAcquisti">0,00 €</span>
    </div>

    <div class="acquisto-form">
      <div>
        <label>Descrizione</label>
        <input type="text" id="fDescrizione" placeholder="Es. Shein">
      </div>
      <div>
        <label>Importo (€)</label>
        <input type="number" step="0.01" id="fImporto" placeholder="0.00">
      </div>
      <button class="btn btn-primary" id="btnAggiungi">Aggiungi</button>
    </div>

    <table class="acquisti-table">
      <thead>
        <tr><th>Descrizione</th><th>Importo</th><th></th></tr>
      </thead>
      <tbody id="acquistiTableBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">Nessun acquisto registrato.</div>
  </div>



  <!-- ============================================================
       BARRA DI NAVIGAZIONE SECONDARIA — moduli del gestionale conti
       ============================================================ -->
  <hr class="banca-nav-divider">
  <nav class="banca-nav">
    <a href="bancaconsolle.html" class="banca-nav-item">
      <span class="icon">🏦</span>
      <span class="lbl">Consolle</span>
    </a>
    <a href="bancaconti.html" class="banca-nav-item">
      <span class="icon">💶</span>
      <span class="lbl">Spese</span>
    </a>
    <a href="bancaacquisti.html" class="banca-nav-item active">
      <span class="icon">🛒</span>
      <span class="lbl">Acquisti</span>
    </a>
    <a href="bancacontanti.html" class="banca-nav-item">
      <span class="icon">💵</span>
      <span class="lbl">Contanti</span>
    </a>
    <a href="bancadiletta.html" class="banca-nav-item">
      <span class="icon">🎒</span>
      <span class="lbl" data-nome="figlio">Diletta</span>
    </a>
    <a href="bancastorico.html" class="banca-nav-item">
      <span class="icon">📜</span>
      <span class="lbl">Storico</span>
    </a>
  </nav>

</div>

<script>
/* ================================================================
   CHIAVE localStorage — la stessa letta da bancaconti.html
   ================================================================ */
const LS_ACQUISTI = 'banca_acquisti_v1';
const LS_BANCA_CONFIG = 'banca_config_v1';       // nomi personalizzabili (conti e persona), gestiti da bancaconsolle.html

function applicaNomiConfig(){
  const defaults = { conto1: 'Intesa', conto2: 'Findomestic', figlio: 'Diletta' };
  let cfg = defaults;
  try{
    const raw = localStorage.getItem(LS_BANCA_CONFIG);
    if(raw) cfg = Object.assign(defaults, JSON.parse(raw));
  }catch(e){ console.warn('Errore lettura banca_config_v1', e); }
  document.querySelectorAll('[data-nome="conto1"]').forEach(el => el.textContent = cfg.conto1);
  document.querySelectorAll('[data-nome="conto2"]').forEach(el => el.textContent = cfg.conto2);
  document.querySelectorAll('[data-nome="figlio"]').forEach(el => el.textContent = cfg.figlio);
  return cfg;
}


let acquisti = [];

function loadAcquisti(){
  try{
    const raw = localStorage.getItem(LS_ACQUISTI);
    if(raw) acquisti = JSON.parse(raw);
  }catch(e){ console.warn('Errore lettura banca_acquisti_v1', e); }
}
function saveAcquisti(){
  try{ localStorage.setItem(LS_ACQUISTI, JSON.stringify(acquisti)); }
  catch(e){ console.warn('Errore salvataggio banca_acquisti_v1', e); }
}

function eur(n){
  if(typeof n !== 'number' || isNaN(n)) n = 0;
  return n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  const tbody = document.getElementById('acquistiTableBody');
  tbody.innerHTML = '';
  document.getElementById('emptyMsg').style.display = acquisti.length === 0 ? 'block' : 'none';

  let totale = 0;
  acquisti.forEach(a => {
    totale += Number(a.importo) || 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(a.descrizione)}</td>
      <td>${eur(Number(a.importo) || 0)}</td>
      <td class="row-actions"><button title="Elimina" data-del="${a.id}">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('totaleAcquisti').textContent = eur(totale);

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      acquisti = acquisti.filter(x => x.id !== btn.dataset.del);
      saveAcquisti();
      renderAll();
    });
  });
}

function aggiungiAcquisto(){
  const descrizione = document.getElementById('fDescrizione').value.trim();
  const importo = parseFloat(document.getElementById('fImporto').value);
  if(!descrizione){ alert('Inserisci una descrizione.'); return; }
  if(isNaN(importo)){ alert('Inserisci un importo valido.'); return; }

  acquisti.push({ id: 'a_' + Date.now(), descrizione, importo });
  saveAcquisti();

  document.getElementById('fDescrizione').value = '';
  document.getElementById('fImporto').value = '';
  document.getElementById('fDescrizione').focus();

  renderAll();
}

window.addEventListener('DOMContentLoaded', () => {
  applicaNomiConfig();
  loadAcquisti();
  renderAll();
  document.getElementById('btnAggiungi').addEventListener('click', aggiungiAcquisto);

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){ applicaNomiConfig(); loadAcquisti(); renderAll(); }
  });
});
</script>
</body>
</html>
