<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>City Fury</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05000f;overflow:hidden;color:#fff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{--u:1px;position:relative;width:100vw;background:#05000f;
    box-shadow:0 0 60px rgba(255,42,109,.35);overflow:hidden}
  #stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}
  canvas{width:100%;height:100%;display:block}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px)}

  #hud{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*10);display:flex;gap:calc(var(--u)*8);pointer-events:none}
  .box{background:rgba(10,0,30,.6);border:1px solid rgba(110,231,255,.45);border-radius:calc(var(--u)*8);
    padding:calc(var(--u)*4) calc(var(--u)*10);min-width:calc(var(--u)*76);text-align:center;
    box-shadow:0 0 12px rgba(110,231,255,.2) inset}
  .box b{display:block;font-size:calc(var(--u)*10);letter-spacing:.18em;color:#6ee7ff;font-weight:700}
  .box span{display:block;font-size:calc(var(--u)*23);font-weight:800;font-style:italic;
    text-shadow:0 0 10px rgba(255,42,109,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{width:calc(var(--u)*118);height:calc(var(--u)*14);margin-top:calc(var(--u)*7);border-radius:99px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2a6d,#ffe27a);transition:width .12s}
  .bar.sp i{background:linear-gradient(90deg,#00e5ff,#b967ff)}
  .bar.sp.ready{box-shadow:0 0 10px #00e5ff}

  #dash{position:absolute;right:calc(var(--u)*14);top:calc(var(--u)*14);z-index:30;
    display:inline-flex;align-items:center;gap:calc(var(--u)*8);text-decoration:none;color:#fff;
    font-weight:800;letter-spacing:.08em;font-size:calc(var(--u)*15);
    padding:calc(var(--u)*9) calc(var(--u)*18);border-radius:999px;
    background:linear-gradient(135deg,#ff2a6d,#7a2cff);border:2px solid rgba(255,255,255,.7);
    box-shadow:0 0 18px rgba(255,42,109,.7);transition:transform .15s,box-shadow .15s}
  #dash:hover,#dash:focus-visible{transform:scale(1.07);box-shadow:0 0 30px rgba(110,231,255,.9);outline:none}

  #msg{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;
    font-size:calc(var(--u)*44);font-weight:900;font-style:italic;letter-spacing:.06em;
    color:#ffe27a;text-shadow:0 0 18px #ff2a6d,0 0 40px #ff2a6d;opacity:0}
  #msg.bad{color:#ff6b6b}
  #msg.show{animation:pop 1.5s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(calc(var(--u)*-30))}}

  #overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(10,0,30,.55),rgba(5,0,15,.9))}
  #overlay.hide{display:none}
  .card{text-align:center;padding:calc(var(--u)*20)}
  h1{font-size:calc(var(--u)*80);line-height:1;font-style:italic;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(180deg,#ffe27a 10%,#ff2a6d 55%,#7a2cff 100%);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 18px rgba(255,42,109,.7))}
  h1 small{display:block;font-size:.34em;letter-spacing:.42em;color:#6ee7ff;-webkit-text-fill-color:#6ee7ff;margin-top:calc(var(--u)*6)}
  #sub{margin:calc(var(--u)*16) 0 calc(var(--u)*20);font-size:calc(var(--u)*18);line-height:1.5;color:#dcd4ff}
  #go{font:inherit;font-weight:900;font-style:italic;letter-spacing:.12em;font-size:calc(var(--u)*24);color:#fff;cursor:pointer;
    padding:calc(var(--u)*12) calc(var(--u)*44);border-radius:999px;border:2px solid #fff;
    background:linear-gradient(135deg,#00e5ff,#7a2cff);box-shadow:0 0 24px rgba(0,229,255,.7);transition:transform .15s}
  #go:hover{transform:scale(1.06)}
  .keys{margin-top:calc(var(--u)*18);font-size:calc(var(--u)*14);color:#9a90c9;line-height:1.7}
  .keys kbd{display:inline-block;padding:0 calc(var(--u)*7);border:1px solid #6ee7ff;border-radius:calc(var(--u)*5);color:#6ee7ff;margin:0 2px}

  #pad{display:flex;align-items:center;justify-content:space-between;
    height:var(--padh,calc(var(--u)*298));padding:0 calc(var(--u)*18);
    background:linear-gradient(180deg,#14072e,#07021a);border-top:2px solid rgba(110,231,255,.55);
    box-shadow:0 -6px 24px rgba(122,44,255,.35)}
  .grp{display:grid;grid-template-columns:auto auto;gap:0 calc(var(--ds,calc(var(--u)*112))*.5);justify-items:center;align-items:center;flex:none}
  .grp .jump{grid-column:1 / span 2;margin-bottom:calc(var(--ds,calc(var(--u)*112))*-.25)}
  .dpad{display:grid;grid-template-columns:auto auto;gap:0 calc(var(--ds,calc(var(--u)*112))*.5);justify-items:center;align-items:center;flex:none}
  .dpad .up,.dpad .down{grid-column:1 / span 2}
  .dpad .tb{width:var(--ds,calc(var(--u)*112));height:var(--ds,calc(var(--u)*112));border-radius:50%;font-size:calc(var(--ds,calc(var(--u)*112))*.42)}
  .dpad .up{margin-bottom:calc(var(--ds,calc(var(--u)*112))*-.25)}
  .dpad .down{margin-top:calc(var(--ds,calc(var(--u)*112))*-.25)}
  .tb{width:calc(var(--u)*140);height:calc(var(--u)*86);border-radius:calc(var(--u)*22);
    font-size:calc(var(--u)*36);font-weight:900;color:#fff;cursor:pointer;
    background:rgba(20,0,50,.7);border:2px solid rgba(110,231,255,.75);box-shadow:0 0 14px rgba(110,231,255,.25) inset;
    display:flex;align-items:center;justify-content:center;touch-action:none;text-align:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .tb.act{height:var(--ds,calc(var(--u)*112));font-size:calc(var(--ds,calc(var(--u)*112))*.15);letter-spacing:.03em;width:var(--ds,calc(var(--u)*112));border-radius:50%}
  .tb.jump{border-color:rgba(0,229,255,.9)}
  .tb.punch{border-color:rgba(255,77,109,.9);box-shadow:0 0 14px rgba(255,77,109,.3) inset}
  .tb.spec{border-color:rgba(255,226,122,.9);box-shadow:0 0 14px rgba(255,226,122,.25) inset}
  .tb.on{background:rgba(255,42,109,.65);transform:scale(.96)}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="hud">
    <div class="box"><b>PUNTI</b><span id="score">0</span></div>
    <div class="box"><b>ENERGIA</b><div class="bar"><i id="hpbar"></i></div></div>
    <div class="box"><b>SPECIALE</b><div class="bar sp" id="spwrap"><i id="spbar"></i></div></div>
    <div class="box"><b>VITE</b><span id="lives">3</span></div>
    <div class="box"><b>RECORD</b><span id="best">0</span></div>
  </div>

  <a id="dash" href="dashconsolle.html">🎛 DASHBOARD</a>
  <div id="msg"></div>

  <div id="overlay">
    <div class="card">
      <h1>CITY<br>FURY<small>PICCHIA DURO</small></h1>
      <p id="sub">La banda del Boss Viper ha invaso le strade!<br>Fatti largo a pugni e calci fino in fondo alla via.</p>
      <button id="go">GIOCA</button>
      <div class="keys">
        <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> muovi &nbsp; <kbd>X</kbd> pugno (x3 = combo) &nbsp; <kbd>SPAZIO</kbd> salta &nbsp; <kbd>C</kbd> speciale &nbsp; <kbd>M</kbd> audio
      </div>
    </div>
  </div>
</div>

<div id="pad">
  <div class="dpad">
    <div class="tb up" data-k="up">▲</div>
    <div class="tb" data-k="left">◀</div>
    <div class="tb" data-k="right">▶</div>
    <div class="tb down" data-k="down">▼</div>
  </div>
  <div class="grp">
    <div class="tb act jump" data-k="jump">SALTA</div>
    <div class="tb act spec" data-k="special">SPECIALE</div>
    <div class="tb act punch" data-k="punch">PUGNO</div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = 960, H = 540, $ = id => document.getElementById(id), wrap = $('wrap');

  function resize() {
    const PADU = 298; // altezza barra comandi in unità --u
    const w = Math.max(320, Math.min(innerWidth, innerHeight / (0.5625 + PADU / 960)));
    wrap.style.width = w + 'px';
    const u = w / 960;
    wrap.style.setProperty('--u', u + 'px');
    // direzionali ingranditi (stessa disposizione di Tetris): usa lo spazio libero sotto lo schermo
    const free = Math.max(0, innerHeight - 0.5625 * w - PADU * u);
    const padH = PADU * u + Math.min(free, 120);
    const byH = (padH - 12) / 2.5;                      // croce alta 2.5 pulsanti
    const byW = (w - 36 * u - 10) / 5;                // croce + triangolo azioni affiancati
    const ds = Math.max(112 * u, Math.min(68, byH, byW));
    wrap.style.setProperty('--ds', ds + 'px');
    wrap.style.setProperty('--padh', padH + 'px');
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- costanti ---------- */
  const LEN = 4900, LANE_MIN = 392, LANE_MAX = 512, G = 1250;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const tri = (u, a, m, b) => u <= a || u >= b ? 0 : u < m ? (u - a) / (m - a) : 1 - (u - m) / (b - m);
  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const sgn = v => v >= 0 ? 1 : -1;

  /* ---------- definizioni ---------- */
  const CFG = {
    hero:   { skin: '#e8a46c', hair: '#1a1a2e', style: 'short', band: '#ff2a6d', shirt: '#f4f4ff', sleeves: false, pants: '#2a4fb8', shoes: '#ff8a3d', belt: '#14072e' },
    punk:   { skin: '#d9a07a', hair: '#38e86b', style: 'mohawk', shirt: '#2a2a3a', vest: '#7a2cff', sleeves: false, pants: '#3a3a52', shoes: '#111', spikes: true },
    kicker: { skin: '#c98a62', hair: '#f2f2f2', style: 'cap', cap: '#ffe27a', shirt: '#ffbf00', sleeves: true, pants: '#1b6fd1', shoes: '#fff' },
    brute:  { skin: '#b87850', hair: null, style: 'bald', shirt: '#ff3d3d', sleeves: false, pants: '#4a5a2a', shoes: '#222', belt: '#111' },
    boss:   { skin: '#e0b090', hair: '#0a0a14', style: 'slick', shades: true, shirt: '#14072e', coat: '#5a1fc0', trim: '#00e5ff', sleeves: true, pants: '#14072e', shoes: '#ffe27a' }
  };
  const ET = {
    punk:   { name: 'TEPPISTA', hp: 32, spd: 92,  scale: 1.0,  atk: 'ejab',   windup: 0.40, range: 62, cool: [1.0, 2.2], pts: 300 },
    kicker: { name: 'GIUBBOTTO', hp: 26, spd: 132, scale: 1.0,  atk: 'ekick',  windup: 0.22, range: 74, cool: [0.8, 1.7], pts: 300 },
    brute:  { name: 'GORILLA', hp: 90, spd: 66,  scale: 1.3,  atk: 'esmash', windup: 0.55, range: 86, cool: [1.4, 2.6], pts: 700, armor: true },
    boss:   { name: 'BOSS VIPER', hp: 280, spd: 108, scale: 1.18, atk: 'bjab',   windup: 0.26, range: 70, cool: [0.9, 1.7], pts: 5000, armor: true, boss: true }
  };
  // reach = lunghezza davanti, lane = tolleranza di profondità, hs/he = finestra attiva (s)
  const ATK = {
    p1:   { dur: 0.30, hs: 0.08, he: 0.17, reach: 66, lane: 20, dmg: 8,  kb: 70,  pose: 'jab' },
    p2:   { dur: 0.32, hs: 0.08, he: 0.18, reach: 68, lane: 20, dmg: 9,  kb: 80,  pose: 'cross' },
    p3:   { dur: 0.46, hs: 0.15, he: 0.27, reach: 80, lane: 22, dmg: 14, kb: 130, pose: 'kick', kd: true },
    jatk: { dur: 9,    hs: 0.06, he: 9,    reach: 62, lane: 22, dmg: 12, kb: 120, pose: 'jatk', kd: true },
    pipe: { dur: 0.46, hs: 0.14, he: 0.26, reach: 104, lane: 24, dmg: 16, kb: 110, pose: 'pipe' },
    special: { dur: 0.75, hs: 0.05, he: 0.7, reach: 118, lane: 40, dmg: 12, kb: 160, pose: 'spin', radial: true, kd: true, inv: true },
    ejab:   { dur: 0.34, hs: 0.1, he: 0.2,  reach: 64, lane: 18, dmg: 7,  kb: 70,  pose: 'jab' },
    ekick:  { dur: 0.34, hs: 0.1, he: 0.22, reach: 78, lane: 18, dmg: 8,  kb: 90,  pose: 'kick' },
    esmash: { dur: 0.7,  hs: 0.3, he: 0.46, reach: 92, lane: 24, dmg: 16, kb: 150, pose: 'smash', kd: true },
    bjab:   { dur: 0.32, hs: 0.09, he: 0.19, reach: 74, lane: 20, dmg: 9,  kb: 80,  pose: 'jab' },
    bkick:  { dur: 0.42, hs: 0.14, he: 0.28, reach: 90, lane: 22, dmg: 13, kb: 150, pose: 'kick', kd: true },
    bcharge:{ dur: 0.75, hs: 0.05, he: 0.55, reach: 70, lane: 24, dmg: 14, kb: 190, pose: 'charge', kd: true, dash: 430 }
  };

  /* ---------- stato ---------- */
  let state = 'menu', lives = 3, level = 1, score = 0, T = 0, camX = 0, shake = 0, flash = 0, hitstop = 0;
  let enemies = [], items = [], parts = [], floats = [], waves = [], waveIdx = 0;
  let camLock = false, goArrow = 0, clearT = 0, deadT = 0, lastEnemy = null, lastEnemyT = 0;
  const keys = { left: false, right: false, up: false, down: false, punch: false, jump: false, special: false };
  let punchBuf = 0, jumpBuf = 0, spBuf = 0;
  let best = 0, scores = [], committed = true;
  try { best = +localStorage.getItem('cityfury_best') || 0; } catch (e) {}
  try { scores = JSON.parse(localStorage.getItem('cityfury_scores') || '[]').filter(n => typeof n === 'number'); } catch (e) { scores = []; }
  function commitScore() {
    if (committed) return false;
    committed = true;
    const s = Math.floor(score);
    if (s <= 0) return false;
    const record = s > best;
    if (record) best = s;
    scores.push(s); scores.sort((a, b) => b - a); scores = scores.slice(0, 5);
    try {
      localStorage.setItem('cityfury_best', String(best));
      localStorage.setItem('cityfury_last', String(s));
      localStorage.setItem('cityfury_scores', JSON.stringify(scores));
    } catch (e) {}
    return record;
  }

  function mkFighter(kind, type, x, y) {
    const base = kind === 'hero' ? { hp: 100, scale: 1.0 } : ET[type];
    const mult = kind === 'hero' ? 1 : 1 + 0.18 * (level - 1);
    const hp = Math.round(base.hp * mult);
    return { isPlayer: kind === 'hero', type, cfg: CFG[kind === 'hero' ? 'hero' : type], x, y, z: 0, vx: 0, vy: 0, vz: 0,
      hp, max: hp, scale: base.scale, dir: 1, state: 'idle', st: 0, dur: 0, atk: null, hitDone: new Set(), tickT: 0,
      combo: 0, queued: false, comboT: 0, inv: 0, flash: 0, walkPh: 0, seed: Math.random() * 6,
      think: 0, cool: 0.5 + Math.random(), token: false, side: Math.random() < 0.5 ? -1 : 1, laneOff: (Math.random() - .5) * 60,
      dead: false, fadeT: 0, armorHits: 0, queue: [], weapon: 0, sp: 50, air: false, lie: 0 };
  }
  const p = mkFighter('hero', 'hero', 200, 450);

  /* ---------- audio ---------- */
  let ac = null, master, muted = false;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function beep(f, d, type, v, slide, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d);
  }
  function noise(d, v) {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = v;
    s.connect(g); g.connect(master); s.start();
  }
  const sfx = {
    swing: () => beep(500, 0.09, 'sawtooth', 0.025, -300),
    hit: () => { noise(0.1, 0.28); beep(180, 0.08, 'square', 0.08, -90); },
    heavy: () => { noise(0.25, 0.4); beep(110, 0.22, 'sawtooth', 0.12, -60); },
    jump: () => beep(300, 0.14, 'square', 0.05, 280),
    pick: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.09, 'square', 0.07, 0, i * 0.06)),
    special: () => { noise(0.5, 0.2); beep(220, 0.5, 'sawtooth', 0.09, 500); },
    ko: () => { noise(0.35, 0.3); beep(160, 0.3, 'sawtooth', 0.1, -110); },
    boss: () => { beep(90, 0.9, 'sawtooth', 0.16, -30); beep(130, 0.9, 'square', 0.08, -40, 0.1); },
    win: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => beep(f, 0.16, 'square', 0.09, 0, i * 0.1)),
    hurt: () => { beep(240, 0.3, 'sawtooth', 0.12, -140); noise(0.15, 0.25); }
  };
  function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; }

  function say(t, cls) {
    const m = $('msg'); m.textContent = t; m.className = ''; void m.offsetWidth; m.className = 'show ' + (cls || '');
  }
  function spark(x, y, big) { parts.push({ k: 'spark', x, y, t: 0, big: !!big }); }
  function burst(x, y, n, cols, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * spd;
      parts.push({ k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, t: 0, max: 0.35 + Math.random() * 0.4,
        c: cols[Math.floor(Math.random() * cols.length)], s: 2 + Math.random() * 3 });
    }
  }
  function floater(x, y, txt, c) { floats.push({ x, y, txt, c: c || '#ffe27a', t: 0 }); }

  /* ---------- stage e ondate ---------- */
  function buildStage() {
    const extra = Math.min(3, level - 1);
    const ex = n => new Array(extra).fill('punk').slice(0, n);
    waves = [
      { x: 620,  en: ['punk', 'punk'].concat(ex(1)) },
      { x: 1450, en: ['punk', 'kicker', 'punk'].concat(ex(1)) },
      { x: 2300, en: ['brute', 'punk', 'kicker'].concat(ex(2)) },
      { x: 3200, en: ['kicker', 'kicker', 'punk', 'brute'].concat(ex(2)) },
      { x: 4100, en: ['boss', 'punk', 'punk'].concat(ex(1)), boss: true }
    ];
    waveIdx = 0; camLock = false; items = [];
    items.push({ x: 430, y: 470, type: 'pipe' }, { x: 1900, y: 440, type: 'apple' }, { x: 3000, y: 480, type: 'chicken' }, { x: 3700, y: 450, type: 'apple' });
  }
  function resetWorld() { enemies = []; parts = []; floats = []; camX = 0; camLock = false; goArrow = 0; lastEnemy = null; }

  function placePlayer(x) {
    p.x = x; p.y = 450; p.z = 0; p.vx = p.vy = p.vz = 0; p.state = 'idle'; p.air = false; p.atk = null;
    p.hp = p.max; p.inv = 2; p.combo = 0; p.queued = false; p.dead = false; p.weapon = 0; p.sp = 50; p.dir = 1;
  }
  function startGame() {
    initAudio();
    lives = 3; level = 1; score = 0; committed = false;
    resetWorld(); buildStage(); placePlayer(180);
    state = 'play'; $('overlay').classList.add('hide');
    say('LIVELLO 1 · VIA!'); beep(660, 0.2, 'square', 0.08);
  }
  function nextStage() {
    level++; resetWorld(); buildStage();
    const hp = p.hp; placePlayer(180); p.hp = Math.min(p.max, hp + 40); p.inv = 1.5;
    state = 'play'; say('LIVELLO ' + level);
  }
  function gameOver() {
    state = 'over';
    const record = commitScore(), s = Math.floor(score);
    $('overlay').classList.remove('hide');

    ctx.scale(f.dir * sc * (P.spinx || 1), sc);
    if (P.rot) { ctx.translate(0, -14); ctx.rotate(P.rot); ctx.translate(0, 14); }
    const Hh = { x: P.by * 0, y: -50 + P.by }, S = { x: P.lean * 38, y: -84 + P.by };
    const hd = { x: S.x + P.hx + 2, y: S.y - 17 + P.hy };
    const armW = 13, legW = 17, skin = col(c.skin), armCol = c.sleeves ? col(c.shirt) : skin;

    // braccio posteriore
    limb([S.x - 8, S.y + 4], P.hB, [-5, 12], armW, armCol);
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(P.hB[0], P.hB[1], 7, 0, 7); ctx.fill();
    // gamba posteriore
    limb([Hh.x - 7, Hh.y], P.fB, [8, 0], legW, col(c.pants));
    ctx.fillStyle = col(c.shoes); ctx.beginPath(); ctx.ellipse(P.fB[0] + 5, P.fB[1] - 3, 13, 6, 0, 0, 7); ctx.fill();
    // cappotto (boss) dietro al busto
    if (c.coat) {
      const sw = Math.sin(T * 4 + f.seed) * 3 + (f.state === 'walk' ? Math.sin(f.walkPh) * 8 : 0);
      ctx.fillStyle = col(c.coat); ctx.beginPath(); ctx.moveTo(S.x - 15, S.y); ctx.lineTo(S.x + 15, S.y);
      ctx.lineTo(Hh.x + 20 + sw, -14); ctx.lineTo(Hh.x - 24 - sw, -14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = col(c.trim); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Hh.x + 20 + sw, -14); ctx.lineTo(Hh.x - 24 - sw, -14); ctx.stroke();
    }
    // busto
    ctx.fillStyle = col(c.coat ? c.shirt : c.shirt);
    ctx.beginPath(); ctx.moveTo(S.x - 14, S.y); ctx.lineTo(S.x + 14, S.y); ctx.lineTo(Hh.x + 12, Hh.y + 5); ctx.lineTo(Hh.x - 12, Hh.y + 5); ctx.closePath(); ctx.fill();
    if (c.vest) { ctx.fillStyle = col(c.vest); ctx.beginPath(); ctx.moveTo(S.x - 14, S.y); ctx.lineTo(S.x - 3, S.y); ctx.lineTo(Hh.x - 1, Hh.y + 5); ctx.lineTo(Hh.x - 12, Hh.y + 5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(S.x + 14, S.y); ctx.lineTo(S.x + 3, S.y); ctx.lineTo(Hh.x + 1, Hh.y + 5); ctx.lineTo(Hh.x + 12, Hh.y + 5); ctx.closePath(); ctx.fill(); }
    if (c.belt) { ctx.fillStyle = col(c.belt); ctx.fillRect(Hh.x - 12, Hh.y + 2, 24, 6); ctx.fillStyle = '#ffe27a'; ctx.fillRect(Hh.x - 3, Hh.y + 3, 6, 4); }
    if (c.coat) { ctx.fillStyle = col(c.coat); ctx.beginPath(); ctx.moveTo(S.x - 15, S.y); ctx.lineTo(S.x - 4, S.y); ctx.lineTo(Hh.x - 8, -14); ctx.lineTo(Hh.x - 24, -14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(S.x + 15, S.y); ctx.lineTo(S.x + 4, S.y); ctx.lineTo(Hh.x + 8, -14); ctx.lineTo(Hh.x + 20, -14); ctx.closePath(); ctx.fill(); }
    if (c.spikes) { ctx.fillStyle = col('#c0c0d8'); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(S.x - 14, S.y + 1 + i * 0); ctx.lineTo(S.x - 20 + i * 4, S.y - 8); ctx.lineTo(S.x - 8 + i * 3, S.y); ctx.fill(); } }
    // gamba anteriore
    limb([Hh.x + 7, Hh.y], P.fF, [9, 0], legW, col(c.pants));
    ctx.fillStyle = col(c.shoes); ctx.beginPath(); ctx.ellipse(P.fF[0] + 5, P.fF[1] - 3, 14, 6.5, 0, 0, 7); ctx.fill();
    // collo + testa
    ctx.fillStyle = skin; ctx.fillRect(S.x - 4 + P.hx * 0.4, S.y - 8, 9, 9);
    ctx.beginPath(); ctx.arc(hd.x, hd.y, 13.5, 0, 7); ctx.fill();
    // capelli e accessori
    ctx.fillStyle = col(c.hair || '#000');
    if (c.style === 'short') { ctx.beginPath(); ctx.arc(hd.x - 1, hd.y - 2, 14, Math.PI * 0.95, Math.PI * 2.05); ctx.fill(); ctx.fillRect(hd.x - 15, hd.y - 4, 8, 9); }
    else if (c.style === 'mohawk') { for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(hd.x - 9 + i * 4.5, hd.y - 10); ctx.lineTo(hd.x - 7 + i * 4.5, hd.y - 28 - (i === 2 ? 5 : 0)); ctx.lineTo(hd.x - 3 + i * 4.5, hd.y - 11); ctx.fill(); } }
    else if (c.style === 'cap') { ctx.fillStyle = col(c.cap); ctx.beginPath(); ctx.arc(hd.x, hd.y - 3, 14.5, Math.PI, 0); ctx.fill(); ctx.fillRect(hd.x + 2, hd.y - 5, 18, 5); }
    else if (c.style === 'slick') { ctx.beginPath(); ctx.arc(hd.x - 1, hd.y - 3, 14.5, Math.PI * 0.98, Math.PI * 2.02); ctx.fill(); ctx.fillRect(hd.x - 16, hd.y - 6, 7, 13); }
    else if (c.style === 'bald') { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(hd.x + 3, hd.y - 8, 5, 2.5, -0.3, 0, 7); ctx.fill(); }
    if (c.band) { ctx.fillStyle = col(c.band); ctx.fillRect(hd.x - 14, hd.y - 8, 28, 5); ctx.beginPath(); ctx.moveTo(hd.x - 14, hd.y - 8); ctx.lineTo(hd.x - 26, hd.y - 2 + Math.sin(T * 6) * 3); ctx.lineTo(hd.x - 14, hd.y - 3); ctx.fill(); }
    // viso
    if (c.shades) { ctx.fillStyle = '#0a0a14'; ctx.fillRect(hd.x - 1, hd.y - 5, 15, 6); ctx.fillStyle = '#00e5ff'; ctx.fillRect(hd.x + 8, hd.y - 4, 4, 1.5); }
    else { ctx.fillStyle = '#14072e'; ctx.fillRect(hd.x + 5, hd.y - 3, 3, 4); ctx.fillRect(hd.x + 10, hd.y - 3, 3, 4); }
    ctx.strokeStyle = 'rgba(40,10,10,.7)'; ctx.lineWidth = 1.6; ctx.beginPath();
    if (f.state === 'hurt' || f.state === 'down') { ctx.arc(hd.x + 8, hd.y + 6, 3, 0, 7); } else { ctx.moveTo(hd.x + 4, hd.y + 6); ctx.lineTo(hd.x + 11, hd.y + 6); }
    ctx.stroke();
    // braccio anteriore + arma
    limb([S.x + 8, S.y + 4], P.hF, [-4, 12], armW, armCol);
    if (c.spikes) { ctx.strokeStyle = col('#c0c0d8'); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(P.hF[0] - 10, P.hF[1] + 2); ctx.lineTo(P.hF[0] - 2, P.hF[1] + 2); ctx.stroke(); }
    if (f.weapon > 0 && f.isPlayer) {
      ctx.save(); ctx.translate(P.hF[0], P.hF[1]); ctx.rotate(P.pipeAng);
      ctx.strokeStyle = col('#c8c8e8'); ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(52, 0); ctx.stroke();
      ctx.strokeStyle = col('#7a7aa8'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(52, 0); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(P.hF[0], P.hF[1], 8, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawItem(it) {
    const sx = it.x - camX; if (sx < -40 || sx > W + 40) return;
    ctx.save(); ctx.translate(sx, it.y);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 5, 0, 0, 7); ctx.fill();
    const bob = Math.sin(T * 4 + it.x) * 2; ctx.translate(0, bob - 12);
    ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 12;
    if (it.type === 'apple') { ctx.fillStyle = '#ff3d3d'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill(); ctx.fillStyle = '#38e86b'; ctx.fillRect(-1, -15, 3, 6); ctx.fillRect(1, -14, 8, 4); }
    else if (it.type === 'chicken') { ctx.fillStyle = '#e8792b'; ctx.beginPath(); ctx.ellipse(0, 0, 17, 11, 0.3, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(12, -10, 12, 5); ctx.beginPath(); ctx.arc(25, -10, 4, 0, 7); ctx.arc(25, -5, 4, 0, 7); ctx.fill(); }
    else if (it.type === 'money') { ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill(); ctx.fillStyle = '#8a6a00'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('$', 0, 6); }
    else { ctx.rotate(-0.5); ctx.strokeStyle = '#c8c8e8'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.stroke(); }
    ctx.restore();
  }

  /* ---------- scenario ---------- */
  function layer(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; }
  const skyC = layer(W, H, g => {
    const gr = g.createLinearGradient(0, 0, 0, 340); gr.addColorStop(0, '#05011a'); gr.addColorStop(.6, '#2b0b63'); gr.addColorStop(1, '#8a2a86');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.2 + Math.random() * 0.6) + ')'; g.fillRect(Math.random() * W, Math.random() * 150, Math.random() < .15 ? 2 : 1, 1); }
    g.fillStyle = 'rgba(255,226,122,.9)'; g.beginPath(); g.arc(780, 90, 34, 0, 7); g.fill();
    g.fillStyle = 'rgba(5,1,26,.4)'; g.beginPath(); g.arc(792, 84, 32, 0, 7); g.fill();
  });
  const farC = layer(1920, 260, g => {
    let x = 0;
    while (x < 1920) { const w = 40 + Math.random() * 70, h = 60 + Math.random() * 170; g.fillStyle = '#25094f'; g.fillRect(x, 260 - h, w, h); x += w + 2; }
  });
  const midC = layer(1920, 240, g => {
    let x = 0;
    while (x < 1920) {
      const w = 50 + Math.random() * 70, h = 70 + Math.random() * 150;
      g.fillStyle = '#17063a'; g.fillRect(x, 240 - h, w, h);
      for (let wy = 240 - h + 8; wy < 230; wy += 12) for (let wx = x + 5; wx < x + w - 5; wx += 11) if (Math.random() < .25) { g.fillStyle = Math.random() < .5 ? 'rgba(255,42,109,.55)' : 'rgba(0,229,255,.55)'; g.fillRect(wx, wy, 4, 6); }
      x += w + 3;
    }
  });
  function tileLayer(img, f, y) { const o = -((camX * f) % 1920); ctx.drawImage(img, o, y); ctx.drawImage(img, o + 1920, y); }
  const SIGNS = ['BAR', 'PIZZA', 'HOTEL', '24H', 'NOODLE', 'CLUB', 'ARCADE', 'GYM', 'TATTOO', 'CAFE'];
  const NEON = ['#ff2a6d', '#00e5ff', '#ffe27a', '#b967ff', '#38e86b'];
  const BCOL = ['#1a0b3d', '#220f4a', '#15082f', '#1c1046'];

  function drawScenery() {
    ctx.drawImage(skyC, 0, 0);
    tileLayer(farC, 0.1, 330 - 260 + 20); tileLayer(midC, 0.3, 330 - 240 + 30);
    // facciate
    const FW = 380, i0 = Math.floor(camX / FW) - 1;
    for (let i = i0; i < i0 + 5; i++) {
      const x = i * FW - camX, top = 96 + rnd(i, 1) * 50, sc = NEON[Math.floor(rnd(i, 2) * NEON.length)], sign = SIGNS[Math.floor(rnd(i, 3) * SIGNS.length)];
      ctx.fillStyle = BCOL[Math.floor(rnd(i, 4) * BCOL.length)]; ctx.fillRect(x, top, FW - 6, 330 - top);
      ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(x, top, FW - 6, 6);
      for (let wy = top + 18; wy < 236; wy += 34) for (let wx = x + 16; wx < x + FW - 40; wx += 44) {
        const lit = rnd(i * 31 + wx, wy) < 0.45;
        ctx.fillStyle = lit ? (rnd(wx, wy) < 0.5 ? '#ffd27a' : '#6ee7ff') : '#0b0420'; ctx.globalAlpha = lit ? 0.75 : 1; ctx.fillRect(wx, wy, 26, 20); ctx.globalAlpha = 1;
      }
      // negozio
      ctx.fillStyle = '#0b0420'; ctx.fillRect(x + 20, 262, FW - 46, 68);
      const gl = ctx.createLinearGradient(0, 262, 0, 330); gl.addColorStop(0, sc + '55'); gl.addColorStop(1, sc + '11');
      ctx.fillStyle = gl; ctx.fillRect(x + 26, 270, FW - 58, 60);
      ctx.fillStyle = '#0b0420'; ctx.fillRect(x + FW / 2 - 18, 276, 36, 54);
      ctx.save(); ctx.shadowColor = sc; ctx.shadowBlur = 16; ctx.fillStyle = sc; ctx.font = 'bold 26px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sign, x + FW / 2, 252); ctx.restore();
    }
    // marciapiede e strada
    ctx.fillStyle = '#2a1a50'; ctx.fillRect(0, 330, W, 52);
    ctx.strokeStyle = 'rgba(122,44,255,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let gx = Math.ceil(camX / 64) * 64; gx < camX + W + 64; gx += 64) { ctx.moveTo(gx - camX, 330); ctx.lineTo(gx - camX - 14, 382); }
    ctx.stroke();
    ctx.fillStyle = '#7a2cff'; ctx.fillRect(0, 380, W, 4);
    const rg = ctx.createLinearGradient(0, 384, 0, H); rg.addColorStop(0, '#1c1030'); rg.addColorStop(1, '#0d0620');
    ctx.fillStyle = rg; ctx.fillRect(0, 384, W, H - 384);
    ctx.save(); ctx.shadowColor = '#ff2a6d'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff2a6d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 382); ctx.lineTo(W, 382); ctx.stroke(); ctx.restore();
    ctx.fillStyle = 'rgba(255,226,122,.55)';
    for (let dx = Math.floor(camX / 120) * 120; dx < camX + W + 120; dx += 120) ctx.fillRect(dx - camX, 452, 64, 5);
    // pali della luce
    for (let i = Math.floor(camX / 520) - 1; i < Math.floor(camX / 520) + 3; i++) {
      const lx = i * 520 + 260 - camX;
      ctx.fillStyle = '#14072e'; ctx.fillRect(lx - 4, 190, 8, 160);
      ctx.fillRect(lx - 4, 190, 40, 6);
      ctx.save(); ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 30; ctx.fillStyle = '#fff2a6'; ctx.fillRect(lx + 20, 196, 20, 6); ctx.restore();
      const lg = ctx.createRadialGradient(lx + 30, 360, 4, lx + 30, 360, 118); lg.addColorStop(0, 'rgba(255,226,122,.22)'); lg.addColorStop(1, 'rgba(255,226,122,0)');
      ctx.fillStyle = lg; ctx.fillRect(lx - 90, 240, 240, 240);
    }
  }

  /* ---------- render ---------- */
  function drawSpark(q) {
    const x = q.x - camX, y = q.y, r = (q.big ? 44 : 30) * (0.4 + q.t / 0.18);
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = 1 - q.t / 0.18;
    ctx.strokeStyle = q.big ? '#ffe27a' : '#fff'; ctx.lineWidth = q.big ? 4 : 3; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + 0.4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.35, Math.sin(a) * r * 0.35); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, 7); ctx.fill();
    ctx.restore();
  }
  function render() {
    ctx.save();
    if (shake > 0.01) ctx.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 10);
    drawScenery();
    const list = [];
    for (const it of items) list.push({ y: it.y - 1, f: () => drawItem(it) });
    for (const e of enemies) list.push({ y: e.y + (e.state === 'down' && !e.air ? -20 : 0), f: () => drawFighter(e) });
    if (state !== 'over') list.push({ y: p.y + (p.state === 'down' && !p.air ? -20 : 0), f: () => drawFighter(p) });
    if (state === 'menu') { /* due comparse decorative */ }
    list.sort((a, b) => a.y - b.y); for (const o of list) o.f();

    for (const q of parts) {
      if (q.k === 'spark') drawSpark(q);
      else { ctx.globalAlpha = Math.max(0, 1 - q.t / q.max); ctx.fillStyle = q.c; ctx.fillRect(q.x - camX, q.y, q.s, q.s); ctx.globalAlpha = 1; }
    }
    ctx.font = 'bold 17px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
    for (const f of floats) { ctx.globalAlpha = Math.max(0, 1 - f.t / 1.2); ctx.fillStyle = f.c; ctx.shadowColor = f.c; ctx.shadowBlur = 8; ctx.fillText(f.txt, f.x - camX, f.y); }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (flash > 0.01) { ctx.fillStyle = 'rgba(255,60,60,' + flash * 0.4 + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    ctx.restore();

    // barra nemico colpito / boss
    const tgt = enemies.find(e => e.type === 'boss' && !e.dead) || (lastEnemyT > 0 && lastEnemy && !lastEnemy.dead ? lastEnemy : null);
    if (tgt && state === 'play') {
      const bw = tgt.type === 'boss' ? 380 : 240, bx = W / 2 - bw / 2, by = 86;
      ctx.fillStyle = 'rgba(10,0,30,.7)'; ctx.fillRect(bx - 3, by - 3, bw + 6, 16);
      ctx.fillStyle = tgt.type === 'boss' ? '#ff2a6d' : '#ffb347'; ctx.fillRect(bx, by, bw * clamp(tgt.hp / tgt.max, 0, 1), 10);
      ctx.strokeStyle = '#6ee7ff'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - 3, by - 3, bw + 6, 16);
      ctx.font = 'bold 12px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#6ee7ff'; ctx.textAlign = 'center'; ctx.fillText(ET[tgt.type].name, W / 2, by - 8);
    }
    if (goArrow > 0 && Math.floor(T * 3) % 2 === 0) {
      ctx.save(); ctx.font = 'italic 900 44px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#ffe27a'; ctx.shadowColor = '#ff2a6d'; ctx.shadowBlur = 18; ctx.textAlign = 'right';
      ctx.fillText('VAI ▶', W - 30, 300); ctx.restore();
    }

    $('score').textContent = Math.floor(score);
    $('hpbar').style.width = (clamp(p.hp / p.max, 0, 1) * 100) + '%';
    $('spbar').style.width = p.sp + '%'; $('spwrap').classList.toggle('ready', p.sp >= 50);
    $('lives').textContent = '×' + Math.max(0, lives);
    $('best').textContent = Math.max(best, Math.floor(score));
  }

  /* ---------- input ---------- */
  const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyX: 'punch', KeyJ: 'punch', KeyK: 'jump', KeyC: 'special', KeyL: 'special' };
  function press(k) {
    if (state !== 'play') return;
    if (k === 'punch') punchBuf = 0.2; else if (k === 'jump') jumpBuf = 0.15; else if (k === 'special') spBuf = 0.2;
  }
  window.addEventListener('keydown', e => {
    if (ac && ac.state === 'suspended') ac.resume();
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'play') { if (!e.repeat) press('jump'); } else if (state === 'menu' || state === 'over') startGame();
      return;
    }
    const k = keyMap[e.code];
    if (k) { e.preventDefault(); if (!keys[k] || !e.repeat) { if (!e.repeat) press(k); } keys[k] = true; }
    if (e.code === 'Enter' && (state === 'menu' || state === 'over')) { e.preventDefault(); startGame(); }
    if (e.code === 'KeyM') setMuted(!muted);
  });
  window.addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); b.classList.add('on'); keys[k] = true; press(k); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, () => { keys[k] = false; b.classList.remove('on'); }));
  });
  $('go').addEventListener('click', startGame);
  window.addEventListener('pagehide', () => { if (state !== 'menu') commitScore(); });
  $('dash').addEventListener('click', () => { if (state !== 'menu') commitScore(); });

  window.__cf = {
    p, get state() { return state; }, get lives() { return lives; }, get level() { return level; }, get score() { return score; },
    get camX() { return camX; }, get enemies() { return enemies; }, get waveIdx() { return waveIdx; }, get camLock() { return camLock; },
    LEN, LANE_MIN, LANE_MAX, tele(x) { camX = clamp(x - 380, 0, LEN - W); p.x = x; },
    skipTo(i) { waveIdx = i; camLock = false; enemies = []; }
  };

  resetWorld(); buildStage(); placePlayer(280);
  const step = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= step) { update(step); acc -= step; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
