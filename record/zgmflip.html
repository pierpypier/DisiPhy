<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Flipper</title>
<style>
:root{--bg:#0a0620;--fg:#e6ecff;--btn:#1b1250;--acc:#3be0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>

  <button data-k="L">◀ SX</button><button class="mid" data-k="P">LANCIA</button><button data-k="R">DX ▶</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=320,H=480,SK='pinball_best';
let best=0;try{best=parseInt(localStorage.getItem(SK))||0}catch(e){}
const saveBest=()=>{try{localStorage.setItem(SK,String(best))}catch(e){}};
const k={L:0,R:0,P:0};let pk={L:0,R:0};
let th=0,prevTh=0,fade=1,msg2='',st='title',t=0,score=0,balls=3,mult=1,charge=0,saveT=0,msg='',msgT=0,gate=false,still=0,newRec=false,aud=null,hits=0,ball;
function beep(f,d,ty,v,up){try{if(!aud)return;const n=aud.currentTime,o=aud.createOscillator(),g=aud.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,up?f*2:f*.5),n+d);g.gain.setValueAtTime(v||.03,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(n+d)}catch(e){}}
// ---------- tavolo ----------
const walls=[[12,160,12,378.7],[12,378.7,97.1,430.9],[284,170,284,455],[284,378.7,198.9,430.9],[308,160,308,455],[284,455,308,455]];
for(let i=0;i<28;i++){const a=Math.PI+i/28*Math.PI,b=Math.PI+(i+1)/28*Math.PI;walls.push([160+148*Math.cos(a),160+148*Math.sin(a),160+148*Math.cos(b),160+148*Math.sin(b)])}
const mir=x=>296-x;
const bumpers=[{x:104,y:130,r:14,s:100,f:0},{x:192,y:130,r:14,s:100,f:0},{x:148,y:188,r:14,s:100,f:0},{x:52,y:244,r:10,s:50,f:0},{x:244,y:244,r:10,s:50,f:0},{x:66,y:352,r:11,s:25,f:0,c:'#ff4a9a',k:210},{x:230,y:352,r:11,s:25,f:0,c:'#ff4a9a',k:210},
{x:148,y:98,r:10,s:50,f:0,c:'#27d6a0'},{x:58,y:178,r:10,s:50,f:0,c:'#27d6a0'},{x:238,y:178,r:10,s:50,f:0,c:'#27d6a0'}];
const targets=[{x1:109,x2:133,y:228,on:0,f:0},{x1:136,x2:160,y:228,on:0,f:0},{x1:163,x2:187,y:228,on:0,f:0}];
const lights=[{x:104,y:62,on:0},{x:132,y:62,on:0},{x:160,y:62,on:0},{x:188,y:62,on:0}];
const fl=[{x:94,y:436,len:48,side:1,th:.55,w:0},{x:202,y:436,len:48,side:-1,th:.55,w:0}];
const TH_REST=.55,TH_UP=-.35,OMEGA=19,G=560;
// ---------- fisica ----------
function seg(b,ax,ay,bx,by,e){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=((b.x-ax)*dx+(b.y-ay)*dy)/l2;u=u<0?0:u>1?1:u;
  const px=ax+u*dx,py=ay+u*dy;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);
  if(d>=b.r||d===0)return null;nx/=d;ny/=d;b.x=px+nx*b.r;b.y=py+ny*b.r;
  const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny}
  return{nx,ny,vn};
}
function flipHit(f){
  const b=ball,cs=Math.cos(f.th),sn=Math.sin(f.th),ax=f.x,ay=f.y,bx=ax+f.side*cs*f.len,by=ay+sn*f.len;
  const dx=bx-ax,dy=by-ay;let u=((b.x-ax)*dx+(b.y-ay)*dy)/(dx*dx+dy*dy);u=u<0?0:u>1?1:u;
  const px=ax+u*dx,py=ay+u*dy,rad=6-2.5*u;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),R=b.r+rad;
  if(d>=R||d===0)return;nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;
  const rx=px-ax,ry=py-ay,w=f.w;let vsx,vsy;if(f.side>0){vsx=-w*ry;vsy=w*rx}else{vsx=w*ry;vsy=-w*rx}
  let rvx=b.vx-vsx,rvy=b.vy-vsy;const vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=(1+.25)*vn*nx;rvy-=(1+.25)*vn*ny;b.vx=rvx+vsx;b.vy=rvy+vsy}
}
function step(dt){
  // flipper
  for(let i=0;i<2;i++){const f=fl[i],tg=(i==0?k.L:k.R)?TH_UP:TH_REST;
    if(f.th>tg){f.th=Math.max(tg,f.th-OMEGA*dt);f.w=f.th>tg?-OMEGA:0}
    else if(f.th<tg){f.th=Math.min(tg,f.th+OMEGA*dt);f.w=f.th<tg?OMEGA:0}
    else f.w=0}
  const b=ball;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  const sp=Math.hypot(b.vx,b.vy);if(sp>1000){b.vx*=1000/sp;b.vy*=1000/sp}
  for(const w of walls)seg(b,w[0],w[1],w[2],w[3],.4);
  if(gate)seg(b,284,170,284,78,.4);
  for(const m of bumpers){const dx=b.x-m.x,dy=b.y-m.y,d=Math.hypot(dx,dy),R=m.r+b.r;
    if(d<R&&d>0){const nx=dx/d,ny=dy/d;b.x=m.x+nx*R;b.y=m.y+ny*R;const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}const a=b.vx*nx+b.vy*ny;const kk=m.k||260;if(a<kk){b.vx+=nx*(kk-a);b.vy+=ny*(kk-a)}
      m.f=.15;score+=m.s*mult;hits++;beep(m.r>12?520:700,.09,'triangle',.04,1)}}
  for(const q of targets){let u=(b.x-q.x1)/(q.x2-q.x1);u=u<0?0:u>1?1:u;const px=q.x1+u*(q.x2-q.x1);let nx=b.x-px,ny=b.y-q.y;const d=Math.hypot(nx,ny),R=b.r+3;
    if(d<R&&d>0){nx/=d;ny/=d;b.x=px+nx*R;b.y=q.y+ny*R;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}
      q.f=.15;if(!q.on){q.on=1;score+=100*mult;hits++;beep(820,.08,'triangle',.04,1);
        if(targets.every(z=>z.on)){targets.forEach(z=>z.on=0);score+=750*mult;hits+=5;if(th!=3){prevTh=th;th=3;fade=0}say('BERSAGLI! +'+750*mult,'TEMA: '+THN[3]);beep(600,.35,'triangle',.05,1)}}}}
  for(const f of fl)flipHit(f);
  for(const l of lights){const dl=Math.hypot(b.x-l.x,b.y-l.y);if(dl>=14)l.arm=true;if(!l.on&&l.arm!==false&&dl<9){l.on=1;score+=50*mult;beep(900,.08,'sine',.03,1);
    if(lights.every(q=>q.on)){lights.forEach(q=>{q.on=0;q.arm=false});if(mult<5)mult++;score+=500*mult;nextTheme();say('MOLTIPLICATORE x'+mult+'!','TEMA: '+THN[th]);beep(500,.4,'triangle',.05,1)}}}
  if(!(b.cool>0)&&!(b.tun>0)){const A=Math.hypot(b.x-PL.x,b.y-PL.y)<9?0:Math.hypot(b.x-PR.x,b.y-PR.y)<9?1:-1;
    if(A>=0){b.tun=.7;b.dir=A==0?1:-1;b.vx=b.vy=0;score+=250*mult;hits++;say('TUNNEL!');beep(300,.4,'sine',.05,1)}}
  if(!gate&&b.x<281&&b.y<165)gate=true;
}
function say(s,s2){msg=s;msg2=s2||'';msgT=1.8}
const THN=['PIRATI','SCHELETRI','SPAZIO','FIABA'],PL={x:26,y:296},PR={x:270,y:296};
function nextTheme(){prevTh=th;th=(th+1)%3;fade=0}
function spawn(){ball={x:296,y:446,vx:0,vy:0,r:6};gate=false;charge=0;still=0;st='ready'}
function newGame(){if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(aud&&aud.state=='suspended')aud.resume();
  score=0;balls=3;mult=1;hits=0;newRec=false;th=0;prevTh=0;fade=1;lights.forEach(l=>l.on=0);targets.forEach(q=>q.on=0);msgT=0;spawn()}
function launch(){const v=540+charge*420;ball.x=296;ball.y=446;ball.vx=0;ball.vy=-v;st='play';saveT=12;still=0;beep(180,.25,'sawtooth',.05,1);if(!msgT)say('BALL SAVE!')}
function drain(){
  beep(120,.6,'sawtooth',.06);
  if(saveT>0){say('BALL SAVE!');spawn();return}
  const bonus=hits*20*mult;score+=bonus;hits=0;balls--;mult=1;
  if(balls<=0){st='over';newRec=score>best;if(newRec){best=score;saveBest()}}else{say('BONUS '+bonus);spawn()}
}
function update(dt){
  t+=dt;msgT=Math.max(0,msgT-dt);if(fade<1)fade=Math.min(1,fade+dt*1.2);
  for(const m of bumpers)m.f=Math.max(0,m.f-dt);
  for(const q of targets)q.f=Math.max(0,q.f-dt);
  if(k.L&&!pk.L)beep(110,.04,'square',.03);if(k.R&&!pk.R)beep(110,.04,'square',.03);pk.L=k.L;pk.R=k.R;
  if(st=='ready'){
    if(k.P)charge=Math.min(1,charge+dt*.9);else if(charge>.05){launch();return}else charge=0;
    ball.y=446+charge*12;ball.vx=ball.vy=0;
    for(let i=0;i<2;i++){const f=fl[i],tg=(i==0?k.L:k.R)?TH_UP:TH_REST;f.th+=Math.sign(tg-f.th)*Math.min(Math.abs(tg-f.th),OMEGA*dt);f.w=0}
    return}
  if(st!='play'){for(let i=0;i<2;i++){fl[i].th=TH_REST;fl[i].w=0}return}
  saveT=Math.max(0,saveT-dt);ball.cool=Math.max(0,(ball.cool||0)-dt);
  if(ball.tun>0){ball.tun-=dt;if(ball.tun<=0){ball.tun=0;const d=ball.dir;ball.x=d>0?PR.x-16:PL.x+16;ball.y=296;ball.vx=-d*180;ball.vy=(Math.random()-.4)*80;ball.cool=.9;beep(500,.2,'triangle',.04,1)}return}
  const n=10;for(let i=0;i<n;i++){step(dt/n);if(ball.tun>0)break}
  if(Math.hypot(ball.vx,ball.vy)<12){still+=dt}else still=0;
  if(ball.x>286&&ball.y>420&&still>.5){spawn();return}
  if(still>3&&ball.y<420){ball.vy=-180;ball.vx=(Math.random()-.5)*160;still=0}
  if(ball.y>H+14)drain();
}
// ---------- grafica ----------
function text(s,x,y,sz,al,col){ctx.font='bold '+sz+'px monospace';ctx.textAlign=al||'left';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#e6ecff';ctx.fillText(s,x,y)}
function line(pts,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
const archPts=[];for(let i=0;i<=28;i++){const a=Math.PI+i/28*Math.PI;archPts.push([160+148*Math.cos(a),160+148*Math.sin(a)])}

function bgPirates(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071a33');g.addColorStop(.55,'#0b3b52');g.addColorStop(1,'#04202c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(236,100,4,236,100,70);g.addColorStop(0,'rgba(255,244,200,.55)');g.addColorStop(1,'rgba(255,244,200,0)');ctx.fillStyle=g;ctx.fillRect(150,20,170,170);
  ctx.fillStyle='rgba(244,236,200,.8)';ctx.beginPath();ctx.arc(236,100,17,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<24;i++)ctx.fillRect((i*83)%300+10,(i*37)%160+16,1,1);
  const sx=((t*14)%440)-70,sy=262+Math.sin(t*1.3)*4;ctx.save();ctx.translate(sx,sy);ctx.rotate(Math.sin(t*1.3)*.05);
  ctx.fillStyle='rgba(22,10,4,.85)';ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.lineTo(26,14);ctx.lineTo(-26,14);ctx.closePath();ctx.fill();
  ctx.fillRect(-1,-46,2,46);ctx.fillRect(-20,-30,2,30);ctx.fillRect(18,-26,2,26);
  ctx.fillStyle='rgba(225,210,160,.5)';[[ -1,-44,-26,-4],[ -1,-44,26,-4]].forEach(p=>{ctx.beginPath();ctx.moveTo(-1,-44);ctx.lineTo(p[2],p[3]);ctx.lineTo(-1,-4);ctx.closePath();ctx.fill()});
  ctx.beginPath();ctx.moveTo(19,-24);ctx.lineTo(36,-6);ctx.lineTo(19,-4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(-1,-52,12,7);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(3,-51,3,3);
  ctx.restore();
  for(let l=0;l<3;l++){ctx.fillStyle=['rgba(14,90,120,.45)','rgba(10,70,100,.55)','rgba(6,45,70,.7)'][l];ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8)ctx.lineTo(x,282+l*34+Math.sin(x*.045+t*(1+l*.5)+l)*5);ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
}
function bat(x,y,f){ctx.fillStyle='rgba(18,0,26,.85)';ctx.beginPath();ctx.ellipse(x,y,4,5,0,0,7);ctx.fill();
  for(const sg of[-1,1]){ctx.beginPath();ctx.moveTo(x,y-2);ctx.lineTo(x+sg*18,y-9+f);ctx.lineTo(x+sg*12,y+1);ctx.lineTo(x+sg*7,y+5);ctx.closePath();ctx.fill()}}
function bone(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='rgba(230,235,215,.3)';ctx.fillRect(-11,-2,22,4);
  for(const sx of[-11,11])for(const sy of[-2.5,2.5]){ctx.beginPath();ctx.arc(sx,sy,2.6,0,7);ctx.fill()}ctx.restore()}
function bgSkeleton(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12041c');g.addColorStop(1,'#26103a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(148,400,10,148,400,190);g.addColorStop(0,'rgba(80,255,160,.2)');g.addColorStop(1,'rgba(80,255,160,0)');ctx.fillStyle=g;ctx.fillRect(0,200,W,280);
  ctx.fillStyle='rgba(210,225,200,.15)';ctx.beginPath();ctx.arc(148,235,72,0,7);ctx.fill();ctx.fillRect(116,285,64,40);
  ctx.fillStyle='rgba(8,0,14,.8)';ctx.beginPath();ctx.arc(120,240,17,0,7);ctx.arc(176,240,17,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(148,262);ctx.lineTo(139,282);ctx.lineTo(157,282);ctx.closePath();ctx.fill();
  const gl=.35+.25*Math.sin(t*3);ctx.fillStyle='rgba(120,255,170,'+gl+')';ctx.beginPath();ctx.arc(120,240,6,0,7);ctx.arc(176,240,6,0,7);ctx.fill();
  ctx.fillStyle='rgba(8,0,14,.55)';for(let i=0;i<7;i++)ctx.fillRect(120+i*9,300,2,25);ctx.fillRect(120,307,63,2);
  for(let i=0;i<6;i++)bone((i*61+30)%300+10,H+20-((t*22+i*95)%560),t*.8+i);
  for(let i=0;i<3;i++)bat(((t*38+i*150)%440)-60,95+i*75+Math.sin(t*2+i)*14,Math.sin(t*14+i)*8);
}
function bgSpace(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#01020c');g.addColorStop(1,'#14063f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const b of[[80,170,'60,200,255',.2,120],[240,330,'255,60,180',.18,130],[150,430,'150,80,255',.2,120]]){g=ctx.createRadialGradient(b[0],b[1],5,b[0],b[1],b[4]);g.addColorStop(0,'rgba('+b[2]+','+b[3]+')');g.addColorStop(1,'rgba('+b[2]+',0)');ctx.fillStyle=g;ctx.fillRect(b[0]-b[4],b[1]-b[4],b[4]*2,b[4]*2)}
  for(let i=0;i<70;i++){const y=((i*97)%480+t*(5+(i%3)*9))%480,x=(i*53)%320;ctx.fillStyle='rgba(255,255,255,'+(.25+.35*Math.abs(Math.sin(t*1.5+i)))+')';ctx.fillRect(x,y,i%4==0?2:1,i%4==0?2:1)}
  g=ctx.createRadialGradient(62,146,3,70,152,30);g.addColorStop(0,'#ffcc80');g.addColorStop(1,'#a0481c');ctx.globalAlpha*=.8;ctx.fillStyle=g;ctx.beginPath();ctx.arc(70,150,26,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,220,160,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(70,150,42,9,-.4,0,7);ctx.stroke();ctx.globalAlpha/=.8;
  const sp=(t%7)/1.2;if(sp<1){ctx.strokeStyle='rgba(255,255,255,'+(1-sp)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(300-sp*220,40+sp*120);ctx.lineTo(300-sp*220+30,40+sp*120-14);ctx.stroke()}
  const ux=((t*26)%420)-50,uy=400+Math.sin(t*2)*6;ctx.fillStyle='rgba(170,180,200,.7)';ctx.beginPath();ctx.ellipse(ux,uy,20,6,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(120,255,225,.6)';ctx.beginPath();ctx.ellipse(ux,uy-4,9,7,0,Math.PI,0);ctx.fill();
  for(let i=-1;i<=1;i++){ctx.fillStyle='rgba(255,230,120,'+(.5+.5*Math.sin(t*6+i))+')';ctx.fillRect(ux+i*10-1,uy+1,2,2)}
}
function mush(x,y,s,c){ctx.fillStyle='rgba(235,225,200,.45)';ctx.fillRect(x-3*s,y-14*s,6*s,14*s);ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y-14*s,16*s,11*s,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';[[-7,-19,2.4],[3,-22,2],[9,-17,2.2]].forEach(d=>{ctx.beginPath();ctx.arc(x+d[0]*s,y+d[1]*s,d[2]*s,0,7);ctx.fill()})}
function gnome(x,y,s,sw){ctx.save();ctx.translate(x,y);ctx.rotate(sw);ctx.scale(s,s);
  ctx.fillStyle='rgba(40,90,170,.85)';ctx.beginPath();ctx.ellipse(0,-9,8,10,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(240,205,170,.95)';ctx.beginPath();ctx.arc(0,-24,6,0,7);ctx.fill();
  ctx.fillStyle='rgba(245,245,245,.92)';ctx.beginPath();ctx.moveTo(-6,-22);ctx.lineTo(6,-22);ctx.lineTo(0,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(220,40,50,.92)';ctx.beginPath();ctx.moveTo(-8,-26);ctx.lineTo(8,-26);ctx.lineTo(2,-48);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(30,20,15,.9)';ctx.fillRect(-6,-1,5,3);ctx.fillRect(1,-1,5,3);ctx.restore()}
function fairy(x,y,fl){let g=ctx.createRadialGradient(x,y,1,x,y,20);g.addColorStop(0,'rgba(255,240,160,.5)');g.addColorStop(1,'rgba(255,240,160,0)');ctx.fillStyle=g;ctx.fillRect(x-20,y-20,40,40);
  ctx.fillStyle='rgba(200,255,255,.6)';for(const sg of[-1,1]){ctx.beginPath();ctx.ellipse(x+sg*7,y-4,9,4,sg*(-.5+.4*Math.sin(fl)),0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,170,230,.95)';ctx.beginPath();ctx.ellipse(x,y,2.8,5.5,0,0,7);ctx.fill();

  g=ctx.createRadialGradient(80,90,4,80,90,80);g.addColorStop(0,'rgba(255,245,210,.5)');g.addColorStop(1,'rgba(255,245,210,0)');ctx.fillStyle=g;ctx.fillRect(0,10,170,170);

  ctx.fillStyle='rgba(8,38,30,.75)';for(let i=0;i<7;i++){const x=i*52-10,h=90+(i*37)%50;ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x+28,360-h);ctx.lineTo(x+56,360);ctx.closePath();ctx.fill();ctx.fillRect(x+24,360,8,40)}
  ctx.fillStyle='rgba(20,85,48,.85)';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8)ctx.lineTo(x,430+Math.sin(x*.03+1)*10);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  mush(40,448,1.3,'rgba(225,60,80,.8)');mush(262,452,1.1,'rgba(170,90,230,.8)');mush(150,462,.9,'rgba(255,150,60,.8)');mush(215,330,.7,'rgba(225,60,80,.55)');
  gnome(78,440,1,Math.sin(t*2)*.08);gnome(228,446,.85,Math.sin(t*2+2)*.08);

  for(let i=0;i<14;i++){const x=(i*61+Math.sin(t*.7+i)*20+320)%320,y=120+(i*53)%300+Math.sin(t*.9+i*2)*14;ctx.fillStyle='rgba(220,255,120,'+(.2+.5*Math.abs(Math.sin(t*2+i)))+')';ctx.fillRect(x,y,2,2)}
  for(let i=0;i<3;i++)fairy(160+110*Math.sin(t*.6+i*2.1),130+i*95+30*Math.sin(t*1.1+i),t*22+i);

const BGS=[bgPirates,bgSkeleton,bgSpace,bgFairy];
function drawBg(i,a){ctx.globalAlpha=a;BGS[i]();ctx.globalAlpha=1}
function bz(u){const v=1-u;return[v*v*PL.x+2*v*u*148+u*u*PR.x,v*v*PL.y+2*v*u*330+u*u*PR.y]}
function drawTube(){
  ctx.lineCap='round';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(PL.x,PL.y);ctx.quadraticCurveTo(148,330,PR.x,PR.y);ctx.stroke();
  ctx.strokeStyle='rgba(120,200,255,.35)';ctx.lineWidth=1.5;ctx.setLineDash([5,6]);ctx.lineDashOffset=-t*18;ctx.beginPath();ctx.moveTo(PL.x,PL.y);ctx.quadraticCurveTo(148,330,PR.x,PR.y);ctx.stroke();ctx.setLineDash([]);
}
function drawPortal(p,dir){
  const pl=.5+.5*Math.sin(t*5);ctx.fillStyle='#05020f';ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,106,168,'+(.6+.4*pl)+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(59,224,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,5+pl*2,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(p.x+dir*16,p.y);ctx.lineTo(p.x+dir*10,p.y-4);ctx.lineTo(p.x+dir*10,p.y+4);ctx.closePath();ctx.fill();
}
function render(){
  if(fade<1){drawBg(prevTh,1);drawBg(th,fade)}else drawBg(th,1);
  ctx.strokeStyle='rgba(255,106,168,.14)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(148,290,58,0,7);ctx.stroke();
  drawTube();
  // pareti
  const wp=[archPts,[[12,160],[12,378.7],[97.1,430.9]],[[308,160],[308,455],[284,455]],[[284,170],[284,455]],[[284,378.7],[198.9,430.9]]];
  for(const p of wp){line(p,'rgba(59,224,255,.25)',7);line(p,'#3be0ff',2.5)}
  if(gate)line([[284,170],[284,78]],'#ffa030',2.5);
  drawPortal(PL,1);drawPortal(PR,-1);
  // luci
  for(const l of lights){ctx.fillStyle=l.on?'#ffe27a':'#3a2a5a';ctx.beginPath();ctx.arc(l.x,l.y,6,0,7);ctx.fill();ctx.strokeStyle='#7a6aff';ctx.lineWidth=1.5;ctx.stroke()}
  // bumper
  for(const m of bumpers){const on=m.f>0;ctx.fillStyle=on?'#fff':(m.c||(m.r>12?'#8a3aff':'#2aa8ff'));ctx.beginPath();ctx.arc(m.x,m.y,m.r+(on?2:0),0,7);ctx.fill();
    ctx.strokeStyle=on?'#ffe27a':'#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=on?'#ffd400':'#14083a';ctx.beginPath();ctx.arc(m.x,m.y,m.r*.5,0,7);ctx.fill()}
  // bersagli
  for(const q of targets){const pts=[[q.x1,q.y],[q.x2,q.y]];line(pts,q.on?'rgba(255,226,122,.3)':'rgba(255,106,168,.3)',11);line(pts,q.f>0?'#fff':(q.on?'#ffe27a':'#ff6aa8'),6)}
  // flippers
  for(let i=0;i<2;i++){const f=fl[i],cs=Math.cos(f.th),sn=Math.sin(f.th),tx=f.x+f.side*cs*f.len,ty=f.y+sn*f.len;
    const nx=-sn*f.side,ny=cs;
    ctx.fillStyle=(i==0?k.L:k.R)?'#ffd400':'#ff9a2a';ctx.beginPath();
    ctx.moveTo(f.x+nx*6,f.y+ny*6);ctx.lineTo(tx+nx*3.5,ty+ny*3.5);ctx.lineTo(tx-nx*3.5,ty-ny*3.5);ctx.lineTo(f.x-nx*6,f.y-ny*6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(f.x,f.y,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(tx,ty,3.5,0,7);ctx.fill();
    ctx.fillStyle='#14083a';ctx.beginPath();ctx.arc(f.x,f.y,2.5,0,7);ctx.fill()}
  // stantuffo
  const py=452+(st=='ready'?charge*12:0);ctx.fillStyle='#aab';ctx.fillRect(290,py,12,5);ctx.strokeStyle='#789';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<5;i++){const y=py+5+i*(465-py)/5;ctx.moveTo(i%2?290:302,y);ctx.lineTo(i%2?302:290,y+(465-py)/5)}ctx.stroke();
  if(st=='ready'){ctx.fillStyle='#142';ctx.fillRect(312,360,5,95);ctx.fillStyle=charge>.8?'#ff4a4a':'#7dff7d';ctx.fillRect(312,455-95*charge,5,95*charge)}
  // pallina
  if(ball&&ball.tun>0){const u=1-ball.tun/.7,p=bz(ball.dir>0?u:1-u);ctx.fillStyle='rgba(120,220,255,.35)';ctx.beginPath();ctx.arc(p[0],p[1],9,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill()}
  else if(ball&&st!='title'&&st!='over'){const b=ball,rg=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r);rg.addColorStop(0,'#fff');rg.addColorStop(1,saveT>0?'#7dffd0':'#8890a8');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  // HUD
  text('PUNTI '+String(score).padStart(6,'0'),6,13,10,'left','#fff');text('RECORD '+best,6,27,9,'left','#ffd400');
  text('PALLE '+balls,W-6,13,10,'right','#fff');text('x'+mult,W-6,27,11,'right','#7df');
  if(msgT>0&&st!='title'){text(msg,148,330,13,'center','#ffe27a');if(msg2)text(msg2,148,348,11,'center','#7df')}
  if(st=='ready'&&Math.floor(t*2)%2)text('TIENI PREMUTO LANCIA',148,300,10,'center','#fff');
  if(st=='title'||st=='over'){
    ctx.fillStyle='rgba(5,2,20,.78)';ctx.fillRect(24,170,248,180);
    if(st=='title'){text('NEON',148,215,30,'center','#3be0ff');text('FLIPPER',148,247,30,'center','#ff6aa8');text('RECORD: '+best,148,275,13,'center','#ffd400');
      text('Z/← SX   M/→ DX   Spazio=lancia',148,298,9,'center','#aab')}
    else{text('GAME OVER',148,212,25,'center','#ff4a6a');text('Punti: '+score,148,240,14,'center','#fff');text('Record: '+best,148,260,12,'center','#ffd400');if(newRec)text('NUOVO RECORD!',148,282,14,'center','#ffe27a')}
    if(Math.floor(performance.now()/500)%2)text('INVIO / TOCCA PER GIOCARE',148,325,10,'center','#fff');
  }
}
const KM={ArrowLeft:'L',z:'L',Z:'L',a:'L',A:'L',ArrowRight:'R',m:'R',M:'R',d:'R',D:'R','/':'R',' ':'P',ArrowDown:'P'};
addEventListener('keydown',e=>{
  if(KM[e.key]){k[KM[e.key]]=1;e.preventDefault()}
  if((e.key=='Enter'||e.key==' ')&&(st=='title'||st=='over')){newGame()}
});
addEventListener('keyup',e=>{if(KM[e.key])k[KM[e.key]]=0});
document.querySelectorAll('#pad button').forEach(b=>{const key=b.dataset.k,
  on=e=>{e.preventDefault();k[key]=1;b.classList.add('on');if(st=='title'||st=='over')newGame()},
  off=e=>{e.preventDefault();k[key]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
cv.addEventListener('pointerdown',()=>{if(st=='title'||st=='over')newGame()});
addEventListener('pagehide',()=>{if(score>best){best=score;saveBest()}});
ball={x:296,y:446,vx:0,vy:0,r:6};
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render()}
requestAnimationFrame(loop);
})();
