<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Runner</title>
<style>
:root{--bg:#5c94fc;--fg:#fff;--btn:#1c2f6b;--acc:#ffd400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#5c94fc}}
:root[data-theme="dark"]{--bg:#5c94fc}
html,body{height:100%;margin:0}
body{background:#10163a;color:var(--fg);font-family:monospace;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
canvas{flex:1;min-height:0;width:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{--d:min(100.8px,calc((100vw - 32px) / 4 - 3px));display:none;justify-content:space-between;align-items:center;padding:8px 10px}
#pad div{display:contents}
#pad button{width:var(--d);height:var(--d);padding:0;border:2px solid var(--acc);border-radius:50%;background:var(--btn);color:var(--fg);font:bold calc(var(--d)*.43) monospace;touch-action:none}
#pad button.sm{font-size:calc(var(--d)*.17)}
#pad button.on,#pad button:active{background:var(--acc);color:#000}
@media (pointer:coarse){#pad{display:flex}}
#foot{display:flex;justify-content:flex-end;padding:2px 8px 6px}
#foot a{font:bold 11px monospace;color:var(--fg);text-decoration:none;border:1px solid var(--acc);border-radius:8px;padding:4px 8px;background:var(--btn);opacity:.85}
</style>
</head>
<body>
<canvas id="c" width="450" height="768"></canvas>
<div id="pad">
  <div><button data-k="l">◀</button><button data-k="r">▶</button></div>
  <div><button class="sm" data-k="run">CORRI</button><button class="sm" data-k="j">SALTA</button></div>
</div>
<div id="foot"><a href="salagiochi.html">⌂ Console</a></div>
<script>
(()=>{
// Logica in "unità" da 16 per tile; la vista è 150x256 unità disegnata a scala 3 (450x768 px)
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),S=3,W=150,H=256,ROWS=14,OY=H-ROWS*16,SK='superrunner_best';
let best=0;try{best=parseInt(localStorage.getItem(SK))||0}catch(e){}
const saveBest=()=>{try{localStorage.setItem(SK,String(best))}catch(e){}};
const k={l:0,r:0,j:0,run:0};
let st='title',t=0,score=0,coinsN=0,lives=3,level=1,time=250,cam=0,stT=0,newRec=false,keepBig=false,aud=null,cols=0,fx=0;
let T=[],en=[],coins=[],items={},mush=[],bumps=[],parts=[],pops=[],p;
function beep(f,d,ty,v,up){try{if(!aud)return;const n=aud.currentTime,o=aud.createOscillator(),g=aud.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,up?f*2:f*.5),n+d);g.gain.setValueAtTime(v||.03,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(n+d)}catch(e){}}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function gen(n){
  const R=rng(n*7919+13);cols=130+Math.min(n,8)*12;fx=cols-12;
  T=Array.from({length:ROWS},()=>new Uint8Array(cols));en=[];coins=[];items={};mush=[];bumps=[];parts=[];pops=[];
  for(let x=0;x<cols;x++){T[12][x]=1;T[13][x]=1}
  const spawn=x=>en.push({x:x*16+1,y:12*16-14,w:14,h:14,vx:0,vy:0,dir:-1,on:false,dead:false,dt:0,sp:28+Math.min(n,8)*5});
  let x=14;
  while(x<fx-14){
    const r=R();
    if(r<.18){const w=2+(R()<.3+n*.05?1:0);for(let i=0;i<w;i++){T[12][x+i]=0;T[13][x+i]=0}
      if(R()<.6)for(let i=-1;i<=w;i++)coins.push({x:(x+i)*16+8,y:(i<0||i==w?9:8)*16+8});x+=w+4}
    else if(r<.36){const h=2+(R()<.4?1:0);for(let i=0;i<2;i++)for(let j=0;j<h;j++)T[11-j][x+i]=5;x+=6}
    else if(r<.62){const row=R()<.5?8:9,len=3+Math.floor(R()*4);
      for(let i=0;i<len;i++){const q=R()<.3;T[row][x+i]=q?3:2;if(q&&R()<.35)items[(x+i)+','+row]=1;if(R()<.5)coins.push({x:(x+i)*16+8,y:(row-2)*16+8})}
      if(R()<.5)spawn(x+1);x+=len+3}
    else if(r<.82){const c=1+Math.floor(R()*2+n*.2);for(let i=0;i<c;i++)spawn(x+i*2);x+=c*2+3}
    else if(r<.9){for(let i=0;i<5;i++)coins.push({x:(x+i)*16+8,y:(10-(i==0||i==4?0:i==2?2:1))*16+8});x+=7}
    else x+=3;
  }
  for(let i=0;i<4;i++)for(let j=0;j<=i;j++)T[11-j][fx-4+i]=6;
  T[11][fx+1]=6;
}
const solid=(tx,ty)=>{if(tx<0||tx>=cols)return true;if(ty<0||ty>=ROWS)return false;return T[ty][tx]>0&&T[ty][tx]!=9};
function mv(b,dt){
  const r={x:0,g:0,hx:-1,hy:-1};
  b.x+=b.vx*dt;
  const y0=Math.floor(b.y/16),y1=Math.floor((b.y+b.h-.01)/16);
  if(b.vx>0){const tx=Math.floor((b.x+b.w-.01)/16);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=tx*16-b.w;b.vx=0;r.x=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/16);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=(tx+1)*16;b.vx=0;r.x=1;break}}
  b.y+=b.vy*dt;
  const x0=Math.floor(b.x/16),x1=Math.floor((b.x+b.w-.01)/16);
  if(b.vy>0){const ty=Math.floor((b.y+b.h)/16);for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){b.y=ty*16-b.h;b.vy=0;r.g=1;break}}
  else if(b.vy<0){const ty=Math.floor(b.y/16),cx=Math.floor((b.x+b.w/2)/16);let hit=-1;
    if(solid(cx,ty))hit=cx;else for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){hit=tx;break}
    if(hit>=0){b.y=(ty+1)*16;b.vy=0;r.hx=hit;r.hy=ty}}
  return r;
}
function loadLevel(n){gen(n);p={x:40,y:12*16-(keepBig?26:14),w:12,h:keepBig?26:14,vx:0,vy:0,big:keepBig,face:1,inv:0,coy:0,buf:0,jh:0,g:false};cam=0;time=250}
function newGame(){if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(aud&&aud.state=='suspended')aud.resume();
  score=0;coinsN=0;lives=3;level=1;keepBig=false;newRec=false;loadLevel(1);st='ready';stT=1.5}
function die(){if(st!='play')return;st='dead';stT=2;p.vy=-300;p.vx=0;keepBig=false;beep(400,.6,'square',.05)}
function lose(){lives--;if(lives<=0){st='over';newRec=score>best;if(newRec){best=score;saveBest()}}else{loadLevel(level);st='ready';stT=1.3}}
function hurt(){if(p.inv>0)return;if(p.big){p.big=false;p.y+=12;p.h=14;p.inv=1.6;beep(300,.3,'sawtooth',.05)}else die()}
function frag(tx,ty){for(let i=0;i<4;i++)parts.push({x:tx*16+(i%2)*8,y:ty*16+(i>>1)*8,vx:(i%2?1:-1)*60,vy:-200+(i>>1)*60,t:1})}
function hitBlock(tx,ty){
  const v=T[ty][tx];
  if(v==2){if(p.big){T[ty][tx]=0;score+=50;frag(tx,ty);beep(150,.15,'square',.05)}else{bumps.push({x:tx,y:ty,t:.15});beep(150,.08,'square',.04)}}
  else if(v==3){T[ty][tx]=4;bumps.push({x:tx,y:ty,t:.15});
    if(items[tx+','+ty])mush.push({x:tx*16+1,y:ty*16-14,w:14,h:14,vx:45,vy:0,dirx:1,dead:false,rise:14});
    else{coinsN++;score+=200;pops.push({x:tx*16+8,y:ty*16-4,t:.5});beep(988,.25,'square',.04,1);if(coinsN%20==0){lives++;beep(600,.4,'triangle',.05,1)}}}
  else return;
  for(const e of en)if(!e.dead&&e.x+e.w>tx*16&&e.x<tx*16+16&&Math.abs(e.y+e.h-ty*16)<3){e.dead=true;e.dt=.4;score+=100}
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function update(dt){
  t+=dt;
  if(st=='ready'){stT-=dt;if(stT<=0)st='play';return}
  if(st=='dead'){p.vy+=1400*dt;p.y+=p.vy*dt;stT-=dt;if(stT<=0)lose();return}
  if(st=='clear'){stT-=dt;if(time>0){const d=Math.min(time,70*dt);time-=d;score+=Math.round(d*10)}
    p.vx=0;p.vy=Math.min(p.vy+1000*dt,120);mv(p,dt);if(stT<=0&&time<=.5){level++;keepBig=p.big;loadLevel(level);st='ready';stT=1.5}return}
  if(st!='play')return;
  time-=dt*1.4;if(time<=0){time=0;die();return}
  p.inv=Math.max(0,p.inv-dt);
  // input
  const dir=k.r-k.l,mx=k.run?175:125;
  if(dir){const acc=(p.g?(p.vx*dir<0?1400:650):450);p.vx+=dir*acc*dt;p.vx=Math.max(-mx,Math.min(mx,p.vx));p.face=dir}
  else{const f=Math.min(Math.abs(p.vx),(p.g?700:150)*dt);p.vx-=Math.sign(p.vx)*f}
  if(Math.abs(p.vx)>mx)p.vx=Math.sign(p.vx)*mx;
  p.coy-=dt;if(p.g)p.coy=.1;
  if(k.j&&!p.jh)p.buf=.12;p.jh=k.j;p.buf-=dt;
  if(p.buf>0&&p.coy>0){p.vy=-(385+Math.abs(p.vx)*.25);p.coy=0;p.buf=0;p.g=false;beep(420,.18,'square',.03,1)}
  if(!k.j&&p.vy<-150)p.vy=-150;
  p.vy=Math.min(560,p.vy+(p.vy<0&&k.j?1000:1700)*dt);
  const r=mv(p,dt);p.g=!!r.g;
  if(r.hx>=0)hitBlock(r.hx,r.hy);
  if(p.x<cam){p.x=cam;if(p.vx<0)p.vx=0}
  cam=Math.max(cam,Math.min(cols*16-W,p.x-W*.35));
  if(p.y>ROWS*16+20){die();return}
  // monete
  coins=coins.filter(c=>{if(Math.abs(c.x-(p.x+p.w/2))<10&&Math.abs(c.y-(p.y+p.h/2))<p.h/2+6){coinsN++;score+=100;beep(988,.2,'square',.03,1);if(coinsN%20==0)lives++;return false}return true});
  // nemici
  for(const e of en){
    if(!e.on&&e.x<cam+W+32)e.on=true;if(!e.on)continue;
    if(e.dead){e.dt-=dt;continue}
    e.vx=e.dir*e.sp;e.vy=Math.min(500,e.vy+1400*dt);const q=mv(e,dt);if(q.x)e.dir*=-1;
    if(e.y>ROWS*16+30)e.dead=true,e.dt=0;
    if(ov(p,e)){
      if(p.vy>0&&(p.y+p.h)-e.y<10){e.dead=true;e.dt=.4;p.vy=k.j?-340:-230;score+=100;beep(200,.12,'square',.05)}
      else hurt()}
  }
  en=en.filter(e=>!(e.dead&&e.dt<=0));
  // funghi
  for(const m of mush){if(m.rise>0){const d=Math.min(m.rise,40*dt);m.y-=d;m.rise-=d;continue}
    m.vx=m.dirx*45;m.vy=Math.min(500,m.vy+1400*dt);const q=mv(m,dt);if(q.x)m.dirx*=-1;
    if(m.y>ROWS*16+30)m.dead=true;
    if(ov(p,m)){m.dead=true;score+=1000;beep(500,.4,'triangle',.05,1);if(!p.big){p.big=true;p.y-=12;p.h=26}}}
  mush=mush.filter(m=>!m.dead);
  for(const b of bumps)b.t-=dt;bumps=bumps.filter(b=>b.t>0);
  for(const o of parts){o.vy+=900*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.t-=dt}parts=parts.filter(o=>o.t>0);
  for(const o of pops)o.t-=dt;pops=pops.filter(o=>o.t>0);
  // bandiera
  if(p.x+p.w>=(fx+1)*16+4){st='clear';stT=3;score+=Math.max(0,Math.round((12*16-p.y-p.h)/16))*300+500;beep(700,.8,'triangle',.06,1)}
}
// ---------- grafica ----------
const q=v=>Math.round(v*S)/S;
const rect=(c,x,y,w,h)=>{const x0=q(x),y0=q(y);ctx.fillStyle=c;ctx.fillRect(x0,y0,Math.max(q(x+w)-x0,1/S),Math.max(q(y+h)-y0,1/S))};
const ell=(c,x,y,rx,ry)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
const dome=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+h);ctx.bezierCurveTo(x,y-h*.35,x+w,y-h*.35,x+w,y+h);ctx.closePath();ctx.fill()};
function text(s,x,y,sz,al,col,sh){ctx.font='bold '+sz+'px monospace';ctx.textAlign=al||'left';ctx.fillStyle=sh||'#000';ctx.fillText(s,x+sz*.07+.3,y+sz*.07+.3);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function cloud(x,y){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.arc(x+11,y-5,11,0,7);ctx.arc(x+24,y-1,9,0,7);ctx.arc(x+33,y+2,6,0,7);ctx.fill();rect('#fff',x,y,33,8);rect('#e3eeff',x-1,y+6,35,2)}
function tileAt(tx,ty){return tx<0||tx>=cols||ty<0||ty>=ROWS?0:T[ty][tx]}
function drawTile(v,tx,ty,x,y){
  const h=(Math.imul(tx,73856093)^Math.imul(ty,19349663))>>>0;
  if(v==1){const top=!tileAt(tx,ty-1);
    rect('#b8601c',x,y,16,16);
    for(let i=0;i<4;i++){const a=(h>>>(i*6))&15,b=(h>>>(i*6+3))&15;rect(i&1?'#d98a45':'#8f4a12',x+a%14,y+5+b%10,2,1.3)}
    rect('#7a3a08',x,y+15,16,1);rect('#9a4c12',x+15,y,1,16);
    if(top){rect('#3f9d1f',x,y,16,4.5);rect('#7ed957',x,y,16,1.4);for(let i=0;i<4;i++)rect('#3f9d1f',x+i*4+((h>>>i)&1)*1.5,y+4.5,2.5,1.5+((h>>>(i+4))&1))}}
  else if(v==2){rect('#d2550f',x,y,16,16);
    for(let r=0;r<4;r++){const yy=y+r*4;rect('#f08a50',x,yy,16,.7);rect('#5a1a00',x,yy+3.2,16,.8);
      if(r&1){rect('#5a1a00',x+3.6,yy,.8,3.2);rect('#5a1a00',x+11.6,yy,.8,3.2)}else rect('#5a1a00',x+7.6,yy,.8,3.2)}
    rect('#8a2d00',x+15,y,1,16)}
  else if(v==3){const f=Math.floor(t*4)%4==0;
    rect('#7a3f00',x,y,16,16);rect(f?'#fff0a0':'#ffb300',x+1,y+1,14,14);
    rect(f?'#fffbe0':'#ffd966',x+1,y+1,14,1);rect(f?'#fffbe0':'#ffd966',x+1,y+1,1,14);
    rect('#c47a00',x+1,y+14,14,1);rect('#c47a00',x+14,y+1,1,14);
    for(const [a,b] of [[2.5,2.5],[11.5,2.5],[2.5,11.5],[11.5,11.5]])rect('#7a3f00',x+a,y+b,1.5,1.5);
    text('?',x+8.4,y+12,11,'center','#fff3b0','#7a3f00')}
  else if(v==4){rect('#4a3320',x,y,16,16);rect('#8f6f48',x+1,y+1,14,14);rect('#a98760',x+1,y+1,14,1);rect('#6b4f30',x+1,y+14,14,1);
    rect('#6b4f30',x+4,y+4,8,8);rect('#7d5f3c',x+5,y+5,6,6);
    for(const [a,b] of [[2.5,2.5],[11.5,2.5],[2.5,11.5],[11.5,11.5]])rect('#4a3320',x+a,y+b,1.5,1.5)}
  else if(v==5){const L=tileAt(tx-1,ty)!=5,R=tileAt(tx+1,ty)!=5,top=tileAt(tx,ty-1)!=5;
    rect('#2fa52f',x,y,16,16);
    if(L){rect('#0b4d0b',x,y,1,16);rect('#8df08d',x+3,y,2.5,16);rect('#5fd45f',x+6,y,1.5,16)}
    if(R){rect('#0b4d0b',x+15,y,1,16);rect('#1c7a1c',x+10.5,y,4.5,16)}
    if(top){rect('#0b4d0b',x,y,16,7);rect('#2fa52f',x+(L?1:0),y+1,16-(L?1:0)-(R?1:0),5);
      if(L){rect('#8df08d',x+3,y+1,2.5,5);rect('#5fd45f',x+6,y+1,1.5,5)}
      if(R)rect('#1c7a1c',x+10.5,y+1,4.5,5)}}
  else if(v==6){rect('#a8a8a8',x,y,16,16);rect('#ececec',x,y,16,2);rect('#ececec',x,y,2,16);rect('#555',x,y+14,16,2);rect('#555',x+14,y,2,16);
    rect('#bcbcbc',x+4,y+4,8,8);rect('#909090',x+4,y+11,8,1);rect('#909090',x+11,y+4,1,8)}
}
function drawPlayer(){
  if(p.inv>0&&Math.floor(t*20)%2)return;
  const h=p.h,big=p.big,air=!p.g,walk=p.g&&Math.abs(p.vx)>10,ph=walk?Math.floor(t*14)%3:0;
  ctx.save();ctx.translate(q(p.x-cam+p.w/2),q(p.y));if(p.face<0)ctx.scale(-1,1);
  const tb=8.5,bb=h-(big?7:3.6),lt=bb-1,lh=h-lt;
  let lo=0,ro=0;if(air){lo=-2;ro=2.4}else if(walk){lo=[-2.2,0,2.2][ph];ro=-lo}
  // gambe e scarpe
  rect('#2457d6',-4.6+lo,lt,4.2,lh-1.4);rect('#2457d6',.4+ro,lt,4.2,lh-1.4);
  rect('#5a2a00',-5.6+lo,h-2.6,5.6,2.6);rect('#8a4a18',-5.6+lo,h-2.6,5.6,.8);
  const ry=h-2.6-(air?.8:0);rect('#5a2a00',-.4+ro,ry,6.4,2.6);rect('#8a4a18',-.4+ro,ry,6.4,.8);
  // braccio dietro
  rect('#e53935',-7,tb+.8,2.8,3.4);ell('#fff',-6,tb+5,1.7,1.6);
  // busto e salopette
  rect('#e53935',-5.2,tb,10.4,bb-tb+.5);
  rect('#2457d6',-4.6,tb+2.6,9.2,bb-tb-2.4);rect('#1a3fa8',-4.6,bb-1,9.2,.8);
  rect('#2457d6',-4.6,tb,2.2,3.2);rect('#2457d6',2.4,tb,2.2,3.2);
  ell('#ffd400',-3.5,tb+3.4,.9,.9);ell('#ffd400',3.5,tb+3.4,.9,.9);
  // braccio davanti
  if(air){rect('#e53935',4.6,tb-1.2,2.8,3.4);ell('#fff',6.2,tb-2,1.8,1.7)}
  else{const sw=walk?[0,.8,0][ph]:0;rect('#e53935',4.6,tb+.8,2.8,3.4);ell('#fff',6,tb+5+sw,1.7,1.6)}
  // testa
  rect('#4e2a0e',-5.8,3.6,2.6,4.2);
  rect('#ffcc99',-4,3.6,9,5.4);ell('#ffcc99',-3,6,1.2,1.5);ell('#e8a070',-3,6.1,.5,.8);
  ell('#f4a678',6,6.2,1.6,1.5);
  rect('#fff',1.2,4.3,2,2.6);rect('#111',2.3,4.6,1,2.2);
  rect('#4e2a0e',1.5,7.3,5.5,1.4);
  ell('#e53935',-.5,2,5.2,2.2);rect('#e53935',-5.7,2,10.2,1.6);rect('#ff7a70',-3,.7,3,.8);
  rect('#c62828',0,2.6,7.4,1.4);ell('#c62828',7.4,3.3,.9,.7);
  ctx.restore();
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4a84f0');g.addColorStop(1,'#b4d8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++)cloud(((i*65-cam*.25)%325+325)%325-40,50+(i%2)*34+(i%3)*8);
  const gy=OY+192;
  for(let i=0;i<4;i++){const hx=((i*100-cam*.5)%400+400)%400-70,r=34+(i&1)*12;
    ctx.fillStyle='#2f9250';ctx.beginPath();ctx.arc(hx,gy,r,Math.PI,0);ctx.fill();
    ctx.fillStyle='#4cc36a';ctx.beginPath();ctx.arc(hx-3,gy,r-7,Math.PI,0);ctx.fill();
    ell('#2f9250',hx-r*.35,gy-r*.45,1.2,1.8);ell('#2f9250',hx+r*.1,gy-r*.55,1.2,1.8)}
  rect('#1a1038',0,gy,W,H-gy);
  ctx.save();ctx.translate(0,OY);
  const c0=Math.floor(cam/16);
  for(let ty=0;ty<ROWS;ty++)for(let tx=c0;tx<=c0+10;tx++){
    const v=tileAt(tx,ty);if(!v)continue;let off=0;
    for(const b of bumps)if(b.x==tx&&b.y==ty)off=-Math.sin(b.t/.15*Math.PI)*5;
    drawTile(v,tx,ty,Math.round(tx*16-cam),Math.round(ty*16+off))}
  // bandiera
  const px=(fx+1)*16+7-cam;
  rect('#cfd8dc',px,32,2,144);rect('#fff',px,32,.7,144);rect('#90a4ae',px+1.4,32,.6,144);
  ell('#ffd400',px+1,30,3.4,3.4);ell('#fff59d',px+.2,29.2,1,1);
  ctx.fillStyle='#2ecc40';ctx.beginPath();ctx.moveTo(px,35);ctx.lineTo(px-17,43.5);ctx.lineTo(px,52);ctx.fill();
  ctx.fillStyle='#1fa032';ctx.beginPath();ctx.moveTo(px,43.5);ctx.lineTo(px-17,43.5);ctx.lineTo(px,52);ctx.fill();
  ell('#fff',px-6,43,2.2,2.2);ell('#2ecc40',px-6,43,1,1);
  // monete
  for(const c of coins){const w=Math.abs(Math.cos(t*5+c.x))*4.2+.8,cx=c.x-cam;
    ell('#b8860b',cx,c.y,w+.8,7.2);ell('#ffc107',cx,c.y,w,6.4);ell('#ffe566',cx,c.y,Math.max(w-1.4,.3),5);
    if(w>2.5)rect('#ffc107',cx-.5,c.y-3,1,6);ell('#fff8c4',cx-w*.3,c.y-3,.6,1.2)}
  for(const o of pops){const cx=o.x-cam,cy=o.y-(.5-o.t)*60;ell('#b8860b',cx,cy,3.8,7);ell('#ffc107',cx,cy,3,6.2);ell('#ffe566',cx,cy,1.6,4.6)}
  // funghi
  for(const m of mush){const x=m.x-cam,y=m.y;
    rect('#f8d8a8',x+3.5,y+8,7,5.5);ell('#f8d8a8',x+7,y+12.8,3.5,1.2);rect('#d9b07a',x+3.5,y+8,7,.8);
    ell('#000',x+5.3,y+10.8,.7,.9);ell('#000',x+8.7,y+10.8,.7,.9);
    dome('#8b1a1a',x,y,14,9.4);dome('#e53935',x+.6,y+.6,12.8,8.4);
    rect('#c62828',x+.6,y+8.2,12.8,1.2);
    ell('#fff',x+3.5,y+5,2,1.6);ell('#fff',x+10.5,y+5,2,1.6);ell('#fff',x+7,y+2.3,2.4,1.5)}
  // nemici
  for(const e of en){if(!e.on)continue;const x=e.x-cam,y=e.y;
    const pur=e.sp>45,hd=pur?'#7b2d9b':'#a0522d',hl=pur?'#b266d4':'#cf7d3f',dk=pur?'#3d1450':'#4a2308';
    if(e.dead){ell(dk,x+7,y+12,7.4,2.8);ell(hd,x+7,y+11.6,6.9,2.3);rect('#000',x+3,y+11.4,2.5,.8);rect('#000',x+8.5,y+11.4,2.5,.8);continue}
    const fl=Math.floor(t*6)%2;
    ell('#f8d8a8',x+7,y+9.8,4.2,3);
    ell('#2b1408',x+3.6+(fl?-1:.6),y+12.6,3.3,1.7);ell('#2b1408',x+10.4+(fl?-.6:1),y+12.6,3.3,1.7);
    ell(dk,x+7,y+5.3,7.2,5.5);ell(hd,x+7,y+5.2,6.6,5);ell(hl,x+4.8,y+2.8,3,1.6);
    ell('#fff',x+4.6,y+6.2,2,2.4);ell('#fff',x+9.4,y+6.2,2,2.4);
    ell('#000',x+5.2,y+6.6,.9,1.3);ell('#000',x+8.8,y+6.6,.9,1.3);
    ctx.strokeStyle='#000';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(x+2,y+3.2);ctx.lineTo(x+6.2,y+5.3);ctx.moveTo(x+12,y+3.2);ctx.lineTo(x+7.8,y+5.3);ctx.stroke()}
  for(const o of parts){rect('#c84c0c',o.x-cam,o.y,5,5);rect('#f08a50',o.x-cam,o.y,5,1)}
  drawPlayer();
  ctx.restore();
  // HUD
  const hud=(l,v,x,al)=>{text(l,x,10,5.5,al,'#fff');text(v,x,20,8.5,al,'#ffd400')};
  hud('PUNTI',String(score).padStart(6,'0'),3,'left');hud('MONETE','x'+String(coinsN).padStart(2,'0'),37,'left');
  hud('VITE','x'+lives,68,'left');hud('LIVELLO',level+'',94,'left');hud('TEMPO',Math.ceil(time)+'',W-3,'right');
  if(st=='ready'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,100,W,70);text('LIVELLO '+level,W/2,133,15,'center','#fff');text('Vite: '+lives,W/2,153,9,'center','#ffd400')}
  if(st=='clear'){text('LIVELLO',W/2,120,11,'center','#ffd400');text('COMPLETATO!',W/2,134,11,'center','#ffd400')}
  if(st=='title'||st=='over'){
    ctx.fillStyle='rgba(8,10,40,.72)';ctx.fillRect(0,70,W,130);
    if(st=='title'){text('SUPER RUNNER',W/2,98,16,'center','#ffd400');text('Salta, schiaccia,',W/2,115,8,'center','#fff');text('raggiungi la bandiera!',W/2,126,8,'center','#fff');
      text('RECORD: '+best,W/2,145,10,'center','#7df');
      text('Frecce/WASD  Spazio=salta',W/2,159,6,'center','#cde');text('Shift=corri',W/2,168,6,'center','#cde')}
    else{text('GAME OVER',W/2,102,18,'center','#ff5050');text('Punti: '+score,W/2,122,9,'center','#fff');text('Record: '+best,W/2,134,9,'center','#fff');if(newRec)text('NUOVO RECORD!',W/2,150,10,'center','#ffd400')}
    if(Math.floor(performance.now()/500)%2)text('INVIO / TOCCA PER GIOCARE',W/2,186,7,'center','#fff');
  }
}
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j',z:'j',Z:'j',Shift:'run',x:'run',X:'run'};
addEventListener('keydown',e=>{
  if(KM[e.key]){k[KM[e.key]]=1;e.preventDefault()}
  if((e.key=='Enter'||e.key==' ')&&(st=='title'||st=='over')){newGame();e.preventDefault()}
});
addEventListener('keyup',e=>{if(KM[e.key])k[KM[e.key]]=0});
document.querySelectorAll('#pad button').forEach(b=>{const key=b.dataset.k,on=e=>{e.preventDefault();k[key]=1;b.classList.add('on')},off=e=>{e.preventDefault();k[key]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
cv.addEventListener('pointerdown',()=>{if(st=='title'||st=='over')newGame()});
addEventListener('pagehide',()=>{if(score>best){best=score;saveBest()}});
loadLevel(1);
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
